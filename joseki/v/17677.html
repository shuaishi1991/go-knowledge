<h1>星位 · 白小飞挂</h1>
<p class="lead">12 手 · 理想</p>
<p class="seq">黑Q16 白R14 黑R15 白Q14 黑O17 白P16 黑P17 白R17 黑Q15 白Q17 黑P15 白O16</p>
<div class="gm-host" data-mode="view" data-at="end" data-numbers="1"><script type="text/plain">(;SZ[19];B[pd]C[星位

又称星（hoshi）。星位让棋手在角上取得根据地，同时也便于发展外势。

星位虽偏向外势，取地却未必低效。对这手下法要保持灵活，随时按局势调整：有时用来做势，有时用来取地。（第10页）];W[qf]C[小飞挂

如果白正在朝自己的地域发展，比如说右边，就可以用这手挂来攻角。（其他挂法很少比这一手更可取。）（第14页。）

A（O17）和脱先都强调实地与先手，因此在现代围棋里很常用。];B[qe]C[蹬
这手靠想阻止白先手跳到X（S16）。但在有些情况下，这其实是坏靠。（第1卷。）];W[pf]C[要点
靠了就扳，这是常识。可若靠的子已经和己方连络，就不能一味硬扳。白改为在此长。若容许黑在Q14（X（Q14））扳成虎口，白无法忍受。（第1卷。）

A（O16）与B（O17）是定式。
C（N16）与D（N17）想要更大的角地，但会留下恶味。];B[nc]C[A（R10）或 B（Q10）是正常下法。
C（P16）是常见手法，各种情况下都会下。

可到这里查看职业棋手在实战中于三三打入之后如何继续。];W[od]C[这手棋常见到近乎定式。它出现在各种场合，具体背景不好一概而论。

白需要征子成立。];B[oc];W[qc]C[A（Q15）正常。
B（S14）更复杂。
C（R16）涉及征子。];B[pe]C[A（P14）和B（S15）是正常下法。
C（Q17）对白是难战，而且需要有利的征子。];W[pc];B[oe];W[nd]C[战斗
继续走A（N17）或B（N16），战斗非常困难，而且要看场合。])</script></div>
