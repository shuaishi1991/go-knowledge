<p class="seq">黑Q16 白虚手 黑R14 白R17 黑Q17 白R16 黑R15 白Q18 黑P18 白R18 黑O17 白S16</p>

AKA star point; hoshi. The 4-4 point allows a player to establish a foothold in a corner while also enabling development of influence. 

Although the 4-4 point favors influence, it is not necessarily inefficient at securing territory. Players should be flexible with this move, ready to adjust their strategy to changing circumstances, at times using it to build influence, at other times going for territory. (p. 10.)];W[]C[In general, enclosing a corner takes priority over a side extension];B[qf]C[Small Knight Enclosure

This enclosure is sometimes good, but it doesn't secure the corner as well as a 3-4 point enclosure. White has several moves for taking a large bite out of the corner. (p. 15.)

While A has become a very popular move, the most common continuation is still to deny Black an extension on the top with a move at X.

<A:Q13> has become popular since AlphaGo.
