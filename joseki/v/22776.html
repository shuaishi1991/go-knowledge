<h1>星位 · 白点三三</h1>
<p class="lead">13 手 · 理想</p>
<p class="seq">黑Q16 白R17 黑R16 白Q17 黑P17 白P18 黑O17 白O18 黑N17 白S16 黑S15 白S17 黑R14</p>
<div class="gm-host" data-mode="view" data-at="end" data-numbers="1"><script type="text/plain">(;SZ[19];B[pd]C[4-4 Point

AKA star point; hoshi. The 4-4 point allows a player to establish a foothold in a corner while also enabling development of influence. 

Although the 4-4 point favors influence, it is not necessarily inefficient at securing territory. Players should be flexible with this move, ready to adjust their strategy to changing circumstances, at times using it to build influence, at other times going for territory. (p. 10.)];W[qc]C[Direct 3-3 Invasion
White can invade the corner directly, and easily make a living shape. This invasion produces little territory for White. But it does usually take the corner away from Black. (p. 14.)

For White continuations, see <Position:31231>.

[Explanation by Go Magic on Youtube (DDK/SDK)\](https://youtu.be/i4PJpJ_hsaU?si=H-m456c3eSn5SvnB)

[Explanation by Michael Redmond on Youtube (DDK/SDK)\](https://youtu.be/2khNnE5Q3GM?si=5x52Q888JR2UMIWR)

[Explanation by Go Pro Yeonwoo on Youtube (SDK/Dan)\](https://youtu.be/1qpSyOpK-xw?si=uXLYOu0NudfvEegS)];B[qd]C[Black usually covers on the side that Black wants to build. So in this case, Black would try to build in the direction of the right side of the board, hoping for a moyo (territorial framework) on that side.

See [The Direct 3-3 Invasion Keep it Simple!\](https://www.youtube.com/watch?v=2khNnE5Q3GM&t=147)];W[pc]C[<A:O17> can lead to the ["flying knife joseki"\](21117), which is the most complicated joseki currently played. However, Black does have opportunities to simplify and still get an even result. This also can be seen as an improvement to the modern joseki of the hane at <C:P17>, that is [this result\](22739)*.<br>
<B:P16> takes the outside simply and in sente.<br>
<C:P17> takes the corner simply but in gote.

*[The Direct 3-3 Invasion Keep it Simple!\](https://youtu.be/2khNnE5Q3GM?t=1157)];B[oc];W[ob]C[<A:O18> takes back the corner territory. Most often played variation by professionals nowadays after <X:P17> move.<br>
<B:O17> secures influence, but in the modern version of the joseki, white has ideas to attack black's wall that results (at least without adjacent stones on the sides).*<br>
<C:Q18> is sometimes referred to as a trick but can be as good or better than B when the ladders are favorable and influence is valuable.

 and * see [The Direct 3-3 Invasion Keep it Simple!\](https://youtu.be/2khNnE5Q3GM?t=482)];B[nc];W[nb]C[Tenuki is not advisable. White is crawling on the second line -- the line of defeat -- and Black should gladly answer White at every step. "Getting ahead" is key. (p. 67.)];B[mc]C[The black stones are not thickness. It's a baseless group, as AlphaGo showed. See [Let's conquer 3-3 invasion!\](https://www.youtube.com/watch?v=1qpSyOpK-xw&t=75)

<A:Q10> attacks Black.<br>
<B:N18> secures White but makes Black a little thicker.<br>
<C:S16>, the traditional hane, makes Black thick. It can still be the best move after a middlegame invasion.];W[rd]C[Bending here is slightly inferior to <A:N18> because Black's shape is thicker and makes a tighter space for White when invading and reducing the right side. It does avoid crawling on the second line, however.];B[re];W[rc];B[qf]C[Black's huge thickness is normally more advantageous than White's corner territory. On the other hand, White can time this sequence so that the influence and power from the resulting black thickness would not have much effect. Locally speaking, Black's gain from the exchange is no greater than White's. (p. 3.)])</script></div>
