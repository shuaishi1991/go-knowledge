<h1>目外 · 白挂高目</h1>
<p class="lead">8 手 · 理想</p>
<p class="seq">黑R15 白P16 黑Q17 白Q16 黑R16 白P17 黑Q18 白L17</p>
<div class="gm-host" data-mode="view" data-at="end" data-numbers="1"><script type="text/plain">(;SZ[19];B[qe]C[三五点

又名目外。三五点不是常见的布局着法。它侧重外势和边。由于它常常有利于占据高位，全局作战时更有优势，因此更适合喜欢战斗的棋风。（第9页）

它不对称的姿态会引出早期的续着——黑守角，或白来挂——正如小目上的一子那样。（石仓郁郎——《In the Beginning》，第16页）

这手挂放弃角地，局部略亏。即便如此，它仍是避免被压在低位的可行办法，并能在上边已有的阵地上保持联络与配合的优势。（第56页。）];B[pc];W[pd]C[粗糙的一手。算不上灾难，但没有理由把黑下强。];B[qd];W[oc];B[pb];W[kc]C[与该定式相比，黑更强，并且可以在 A（N17）打入。])</script></div>
