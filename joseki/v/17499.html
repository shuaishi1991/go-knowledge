<h1>星位 · 白小飞挂</h1>
<p class="lead">6 手 · 理想</p>
<p class="seq">黑Q16 白R14 黑O16 白P15 黑R17 白虚手</p>
<div class="gm-host" data-mode="view" data-at="end" data-numbers="1" data-full="1"><script type="text/plain">(;SZ[19];B[pd]C[星位

又称星（hoshi）。星位让棋手在角上取得根据地，同时也便于发展外势。

星位虽偏向外势，取地却未必低效。对这手下法要保持灵活，随时按局势调整：有时用来做势，有时用来取地。（第10页）];W[qf]LB[nc:A]C[小飞挂

如果白正在朝自己的地域发展，比如说右边，就可以用这手挂来攻角。（其他挂法很少比这一手更可取。）（第14页。）

A（O17）和脱先都强调实地与先手，因此在现代围棋里很常用。];B[nd]C[一间跳
偏向外势的普通策略。黑下在这里之后很难取得实地。];W[oe]LB[od:A][qe:B][ne:C]C[刺
这手刺是 AI 所偏爱的，不过人类棋手此前也下过。它补强了黑棋，同时也给白棋留下潜力。黑棋若不接，白棋就会断。

A（P16）把黑子牢固地连在一起，一般是正确下法。见影山利郎，《Lessons in the Fundamentals of Go》，第43页。
B（R15）在这条征子对白不利时可以考虑。
C（O15）也可以。

另见 Michael Redmond, AlphaGo vs. The World: Game 47, Tan Xiao 7p (W) vs. AlphaGo Master (B)，以及 Game 57, Shin Jinseo 6p (W) vs. AlphaGo Master (B)。];B[qc];W[])</script></div>
