<h1>星位 · 白小飞挂</h1>
<p class="lead">8 手 · 理想</p>
<p class="seq">黑Q16 白R14 黑O17 白虚手 黑R15 白Q14 黑Q10 白N14</p>
<div class="gm-host" data-mode="view" data-at="end" data-numbers="1"><script type="text/plain">(;SZ[19];B[pd]C[4-4 Point

AKA star point; hoshi. The 4-4 point allows a player to establish a foothold in a corner while also enabling development of influence. 

Although the 4-4 point favors influence, it is not necessarily inefficient at securing territory. Players should be flexible with this move, ready to adjust their strategy to changing circumstances, at times using it to build influence, at other times going for territory. (p. 10.)];W[qf]C[Knight's Approach

If White is building towards an area of her own on, say, the right side, then White can attack the corner with this approach. (Other approaches are seldom preferable to this one.) (p. 14.)

<A:O17> and Tenuki emphasize territory and sente. This makes them popular choices in modern Go.];B[nc]C[Knight's Move
A territorial response.

Modern Go emphasizes speed and corners so Tenuki and <A:R16> are the most popular choices by far.];W[]C[Tenuki is a common choice.<br>
<A:R15>, <B:R12>, <C:R11> apply presure to the white stone.<br>
<D:R10> and <E:Q10> apply less pressure but may have a better relationship to the lower right.<br>
<F:S16> is joseki when White is strong on the sides and it will be difficult to pressure the approach stone.];B[qe]C[Kicking blocks the corner while making White heavy. This is a bit more dynamic than pincering the white stone directly, though both are common moves.

Answering at <A:Q14> is recommended, but tenuki is possible for a very big opening move or urgent point.];W[pf]C[Fighting Joseki

This is a very common fighting position which can be good for either side depending on the situation. When judging the results, keep in mind that Black began with two moves in the corner and should expect a large local advantage.];B[pj];W[mf])</script></div>
