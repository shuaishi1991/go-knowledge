<h1>小目 · 白挂高目</h1>
<p class="lead">11 手 · 理想</p>
<p class="seq">黑R16 白P16 黑M16 白R17 黑S17 白Q17 黑S15 白P14 黑Q13 白P13 黑Q12</p>
<div class="gm-host" data-mode="view" data-at="end" data-numbers="1"><script type="text/plain">(;SZ[19];B[qd]C[小目

又名komoku。小目偏重实地。就效率而言，它介于星位与三三之间。当重心在角上时，它的效力发挥到最大。小目常被视为稳健行棋的最佳占角，多年来一直受职业棋手（以及AI）青睐。即便如此，它缺少星位那种取势、并迅速向中腹发展的潜力。（第6页；另见石榑郁郎《In the Beginning》第11页。）];W[od]C[一间高挂

白棋高挂时，有压住黑棋的感觉，并向中腹形成明显的外势。黑棋必须小心应对。（第6页）];B[ld]C[二间高夹
在现代职业对局中，这类夹出现得不多，因为AI认为结果并不好。从这个角度看，可以说没有充分理由就不要夹。但这种夹也会引出许多不熟悉的变化。若了解这些变化，你也许能占到便宜。（参见《AI Masterclass》；另见《AGA Master Review Series》第35局：［白］Master对江维杰九段［黑］。）];W[qc]C[这手并不常见。AlphaGo在对李世石的挑战赛第1局下出它之后，以及后来在Teach工具里，它才更受关注。

它可能引出战斗：或在局部，或在对方反夹之后波及全局。];B[rc];W[pc];B[re];W[of]C[AlphaGo 对李世石时下过这手，当时白在左上有子。];B[pg]C[按旧理论，这个形被认为对黑有利，因为假如白直接走在A（P14），黑就不能跳到B（Q13）。这一评价已经大变。首先，正如AlphaGo在对李世石的第一局中所展示的那样，C（R14）有恶味。其次，如今重新重视角部，黑可以应对局面28689里的旧定式。];W[og];B[ph]C[白会攻击这颗夹击的子。

AlphaGo 下了 A（J16），其他下法也可下。])</script></div>
