<h1>小目 · 白脱先</h1>
<p class="lead">31 手 · 理想</p>
<p class="seq">黑R16 白虚手 黑O16 白Q16 黑Q17 白R17 黑Q15 白P16 黑P17 白P15 黑R15 白O17 黑O18 白N17 黑N16 白N18 黑P14 白O15 黑R18 白O14 黑M16 白L17 黑O13 白P13 黑Q14 白N14 黑L16 白K17 黑O12 白M13 黑L14</p>
<div class="gm-host" data-mode="view" data-at="end" data-numbers="1" data-full="1"><script type="text/plain">(;SZ[19];B[qd]C[小目

又名komoku。小目偏重实地。就效率而言，它介于星位与三三之间。当重心在角上时，它的效力发挥到最大。小目常被视为稳健行棋的最佳占角，多年来一直受职业棋手（以及AI）青睐。即便如此，它缺少星位那种取势、并迅速向中腹发展的潜力。（第6页；另见石榑郁郎《In the Beginning》第11页。）];W[]C[布局的最初几步要重视角。尤其下了小目之后，应尽快守角。这样通常能围出大约十目坚实实地。

守角的价值不只是围住的目数。在角上确立坚实根据地，便于从角向两边发展。

角上守角一般优先于边上的拆。];B[nd]LB[pj:X][lc:A][qg:B][qf:C][pd:D][pc:E][oc:F][qc:G]C[二间高守角

又称AlphaGo守角。这一手避开了变化30589处的压。它一度被认为不好，因为角会变得更薄弱，但它更看重中腹，而这正是AlphaGo的棋风。在X（Q10）一带拆边，对双方都是大棋。

A（M17）是最强的挂角。
B（R13）是白右边已有援军时，从另一侧挂角。
C（R14）在黑已经做成模样时，是有效的打入点。
D（Q16）用作试应手，而且需要征子。附近没有能接应的子时，不建议下。
E（Q17）、F（P17）和G（R17）是收官时的打入，白可以在角里后手小活。棋盘还空旷时，通常不推荐。];W[pd];B[pc];W[qc];B[pe];W[od];B[oc];W[oe];B[qe];W[nc];B[nb];W[mc]LB[mb:A][md:B]C[A（N18）简单。
B（N16）可能导向战斗];B[md];W[mb];B[of];W[ne];B[qb];W[nf];B[ld];W[kc];B[ng];W[og];B[pf];W[mf];B[kd];W[jc];B[nh];W[lg];B[kf])</script></div>
