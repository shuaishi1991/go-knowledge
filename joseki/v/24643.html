<h1>小目 · 白挂目外</h1>
<p class="lead">11 手 · 理想</p>
<p class="seq">黑R16 白P17 黑Q15 白L17 黑N17 白N16 黑O16 白O17 黑M16 白N15 黑M17</p>
<div class="gm-host" data-mode="view" data-at="end" data-numbers="1"><script type="text/plain">(;SZ[19];B[qd]C[3-4 Point

AKA komoku. The 3-4 point favors territory. In this regard, its efficiency is between that of the star and the 3-3 point. Its effectiveness is maximized when the focus is on the corner. Since the 3-4 point is often considered to be the best play for a steady approach to the game, the 3-4 point has been favored by professionals (and AI) over the years. Even so, it lacks the star point's potential for influence and rapid center development. (pp. 6; see also Ishigure Ikuro—In the Beginning, p. 11.)];W[oc]C[One-Space Low Approach

AKA small knight approach. This is the basic approach move to the 3-4 point and divides the corner between Black and White.

Prior to AlphaGo, a pincer would be expected. However, AI and current professionals prefer 'backing off' with <A:Q15> or <B:Q14> or kicking at <C:Q17>.];B[pe]C[Shusaku's Diagonal
A move made famous by [this classic fuseki\](29461) that is a steady response to White's approach. Black can now aim at pincering or pressing down the lone white stone.

Tenuki and <A:M17> are strongly preferred by current professionals.<br>
<B:L17> is the traditional move.

[Explanation by Here We Go on Youtube (DDK/SDK)\](https://youtu.be/EeVDVNg1hTs?si=qNDhSGvb_3UWsOaK)];W[kc]C[Three-Space Extension

This is one of the smallest and most frequently encountered frameworks. (Page 174.)

The best place to invade is on the third line directly between the two stones. Exceptions to this rule are so rare they don't matter. The invasion is most effective with a black stone at <X:J17> so that one of the white stones is caught in a pincer. (Ibid.)];B[mc]C[When Black invades here, White isn't strong enough for a diagonal play, but White is still strong enough to make some kind of attack. One-space jumps and contact plays are typical in this intermediate situation, and <A:P15> is both. Leaning against Black, White can gain momentum for an attack on the pincer stone. (Page 177.)

If White is not strong at all on the upper side and does not want to get involved in a running fight, White can make the evasive and purely defensive lower attachment at <B:N18>. This is not so much an attempt to link up as a sacrifice to make shape on the outside. (Pages 175 & 177.)

White can make what looks like the opposite exchange by starting with the upper attachment at <C:N16>, but this is more an outright loss than an exchange. (Page 178.)];W[md]C[Black should capture the attachment stone next.

<A:O16> is the book move, but AI thinks this is the wrong order and prefers <B:M16>, which leads to the same result without opening up counterplay.<br>];B[nd]C[<A:O17> is the book move.<br>
AI thinks White can resist with <B:P16>.];W[nc];B[ld]C[<A:N15> is correct by implication.<br>
<B:N18> "is a move best forgotten." (Pages 178–179.)];W[me];B[lc]C[White would continue locally.])</script></div>
