<h1>星位 · 白小飞挂</h1>
<p class="lead">9 手 · 理想</p>
<p class="seq">黑Q16 白R14 黑O17 白N17 黑N18 白M17 黑M18 白L17 黑O16</p>
<div class="gm-host" data-mode="view" data-at="end" data-numbers="1"><script type="text/plain">(;SZ[19];B[pd]C[星位

又称星（hoshi）。星位让棋手在角上取得根据地，同时也便于发展外势。

星位虽偏向外势，取地却未必低效。对这手下法要保持灵活，随时按局势调整：有时用来做势，有时用来取地。（第10页）];W[qf]C[小飞挂

如果白正在朝自己的地域发展，比如说右边，就可以用这手挂来攻角。（其他挂法很少比这一手更可取。）（第14页。）

A（O17）和脱先都强调实地与先手，因此在现代围棋里很常用。];B[nc]C[小飞
取实地的应手。

现代围棋重视速度和角，所以脱先和A（R16）是最流行的选择，而且遥遥领先。];W[mc]C[靠
白试图压制黑并施加压力。黑有三种选择：

“靠则扳。”A（N16）一般是最好的惩罚。
“靠则扳。”B（N18）偏业余。
“不知道，随便！”C（O16）同样是好的惩罚。];B[mb]C[这手下扳是业余着，勉强能接受，但不够好，只是马马虎虎。];W[lc]C[这正是黑所希望的。对黑来说简直如梦成真！];B[lb];W[kc];B[nd]C[白绝不会这样下。白要是打算走成这样，当初就不会费事在A（N17）靠。])</script></div>
