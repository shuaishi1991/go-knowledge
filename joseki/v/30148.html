<h1>小目 · 白脱先</h1>
<p class="lead">20 手 · 理想</p>
<p class="seq">黑R16 白虚手 黑O17 白Q16 黑Q17 白R15 黑P16 白Q15 黑S16 白P15 黑O15 白O14 黑N15 白N14 黑M15 白R17 黑S17 白M14 黑L15 白Q10</p>
<div class="gm-host" data-mode="view" data-at="end" data-numbers="1"><script type="text/plain">(;SZ[19];B[qd]C[小目

又名komoku。小目偏重实地。就效率而言，它介于星位与三三之间。当重心在角上时，它的效力发挥到最大。小目常被视为稳健行棋的最佳占角，多年来一直受职业棋手（以及AI）青睐。即便如此，它缺少星位那种取势、并迅速向中腹发展的潜力。（第6页；另见石榑郁郎《In the Beginning》第11页。）];W[]C[布局的最初几步要重视角。尤其下了小目之后，应尽快守角。这样通常能围出大约十目坚实实地。

守角的价值不只是围住的目数。在角上确立坚实根据地，便于从角向两边发展。

角上守角一般优先于边上的拆。];B[nc]C[大飞守角
这种守角和小飞守角类似，只是守得松得多。（第56页。）你可以打入而不被吃，但若只是做活，结果并不有利。（武宫正树《守角定式》，第39页。）

A（Q16）是流行的新定式，涉及这些征子：1、2。
B（O16）是另一手新着，涉及这条征子。
C（P16）是一手侵消。
D（Q17）、E（P17）或F（R17）都能把角从黑手里夺走。
G（P15）是另一手侵消，H（O15）也是。];W[pd]C[接触战
这手棋传统棋手乍看会觉得别扭，如今却已经流行起来。

A（Q17）守角。
B（Q15）走外侧。
C（R15）局部稍亏，但白在局部很难处理。
D（R17）偏软。
