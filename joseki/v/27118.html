<h1>小目 · 白挂高目</h1>
<p class="lead">20 手 · 理想</p>
<p class="seq">黑R16 白P16 黑P17 白Q16 黑Q17 白R15 黑S15 白S16 黑R17 白S14 黑O16 白Q14 黑P14 白P13 黑O13 白P12 黑O15 白O12 黑Q15 白R14</p>
<div class="gm-host" data-mode="view" data-at="end" data-numbers="1"><script type="text/plain">(;SZ[19];B[qd]C[小目

又名komoku。小目偏重实地。就效率而言，它介于星位与三三之间。当重心在角上时，它的效力发挥到最大。小目常被视为稳健行棋的最佳占角，多年来一直受职业棋手（以及AI）青睐。即便如此，它缺少星位那种取势、并迅速向中腹发展的潜力。（第6页；另见石榑郁郎《In the Beginning》第11页。）];W[od]C[一间高挂

白棋高挂时，有压住黑棋的感觉，并向中腹形成明显的外势。黑棋必须小心应对。（第6页）];B[oc]C[内靠
黑在此靠，试图加强自己的棋，并保护角上实地。职业棋手常用这个定式。（第1卷）

A（O17）简明，以实地换外势。
B（Q16）会导向复杂的雪崩变化，也有一些简单变化。
C（O16）缓。
D（Q17）较差。

Michael Redmond 在 YouTube 上的讲解（初级/中级）

Go Pro Yeonwoo 在 YouTube 上的讲解（中级/段位）];W[pd]C[雪崩形里有许多凶险变化。不过，黑也可以选择几种简明的后续。

在这个形里，定式怎么走，最初由黑来选。典型结果是黑占角，并在边上出头，白取得厚势。

注意，这一手只有当白占着D4时才可能是定式。否则，某些雪崩局面（例如局面27044）里的征子不成立，结果会对黑略好一些。白子仅仅在C4还不够。参见迈克尔·雷蒙《AlphaGo对世界：第26局，尹灿熙六段（白）对AlphaGo Master（黑）》。];B[pc];W[qe]C[A（S16）以简明的方式取得实地。

B（O17）可能引出大雪崩。

C（R17）是另一种避免复杂变化的走法。

D（O16）是小雪崩（ko-nadare）。

E（S15）比较平和，但结果对白有利。

谈到大雪崩定式，武宫正树九段曾经说过：“我这辈子再也不下雪崩了。我不喜欢这种大规模定式，既复杂，又把棋盘定得太多。对初学者，我建议只下简明变化（A）。”迈克尔·雷蒙也推荐A。

参见迈克尔·雷蒙《AlphaGo对世界：第16局，AlphaGo Master（白）对连笑七段（黑）》，以及《第55局，AlphaGo Master（白）对陈耀烨九段+孟泰龄六段（黑）》。];B[re]C[这是略利于白的旧定式。（第29页。）

连扳为黑在左上一带做出外势。];W[rd];B[qc];W[rf];B[nd];W[pf];B[of];W[og];B[ng];W[oh];B[ne];W[nh]C[白取右边，黑取上边。];B[pe];W[qf]C[定式
