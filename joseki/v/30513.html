<h1>小目 · 白脱先</h1>
<p class="lead">18 手 · 理想</p>
<p class="seq">黑R16 白虚手 黑L17 白P16 黑Q14 白R17 黑S17 白Q17 黑S18 白M17 黑M16 白L18 黑L16 白M18 黑K18 白N16 黑N15 白O16</p>
<div class="gm-host" data-mode="view" data-at="end" data-numbers="1"><script type="text/plain">(;SZ[19];B[qd]C[小目

又名komoku。小目偏重实地。就效率而言，它介于星位与三三之间。当重心在角上时，它的效力发挥到最大。小目常被视为稳健行棋的最佳占角，多年来一直受职业棋手（以及AI）青睐。即便如此，它缺少星位那种取势、并迅速向中腹发展的潜力。（第6页；另见石榑郁郎《In the Beginning》第11页。）];W[]C[布局的最初几步要重视角。尤其下了小目之后，应尽快守角。这样通常能围出大约十目坚实实地。

守角的价值不只是围住的目数。在角上确立坚实根据地，便于从角向两边发展。

角上守角一般优先于边上的拆。];B[kc]LB[qj:X][pg:A][qg:B][od:C][pd:D]C[低中国流

在 X（R10）一带分边，是最常见的后续。
A（Q13）和 B（R13）是传统的挂，通常会诱导黑守角。
C（P16）直接打入。
D（Q16）是新的挂法。];W[od];B[pf];W[qc];B[rc];W[pc];B[rb]LB[mc:A][lc:B][of:C]C[A（N17）是传统下法。
B（M17）是 AI 推广的一手。
C（P14）是靠，两边都变厚，是较少见的选择。];W[lc];B[ld];W[kb];B[kd];W[lb];B[jb];W[md];B[me];W[nd]C[定式])</script></div>
