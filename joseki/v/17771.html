<h1>星位 · 白小飞挂</h1>
<p class="lead">6 手 · 好棋</p>
<p class="seq">黑Q16 白R14 黑R15 白Q14 黑O16 白Q11</p>
<div class="gm-host" data-mode="view" data-at="end" data-numbers="1"><script type="text/plain">(;SZ[19];B[pd]C[4-4 Point

AKA star point; hoshi. The 4-4 point allows a player to establish a foothold in a corner while also enabling development of influence. 

Although the 4-4 point favors influence, it is not necessarily inefficient at securing territory. Players should be flexible with this move, ready to adjust their strategy to changing circumstances, at times using it to build influence, at other times going for territory. (p. 10.)];W[qf]C[Knight's Approach

If White is building towards an area of her own on, say, the right side, then White can attack the corner with this approach. (Other approaches are seldom preferable to this one.) (p. 14.)

<A:O17> and Tenuki emphasize territory and sente. This makes them popular choices in modern Go.];B[qe]C[Kick
This attachment tries to prevent White from jumping to <X:S16> with sente. But this is actually a bad attachment in some cases. (Vol. 1.)];W[pf]C[The Vital Point
It's common sense to answer an attachment with a hane. However, if the attaching stone is connected to friendly forces, one cannot stubbornly hane. White stretches to here instead. Allowing Black to create a tiger's mouth with a hane at Q14(<X:Q14>) is intolerable for White. (Vol. 1.)

<A:O16> and <B:O17> are joseki.<BR>
<C:N16> and <D:N17> are asking for a larger corner but leave bad aji.];B[nd]C[Black must jump out here. Allowing White to block here is dangerous to Black.];W[pi]C[This extension misses a vital point (a three-space extension from a two-stone wall) (Vol. 1). 

It is played when Black already has a position near <X:R8> or
when White is looking to build territory from the lower right.])</script></div>
