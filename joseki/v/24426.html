<h1>小目 · 白挂目外</h1>
<p class="lead">9 手 · 理想</p>
<p class="seq">黑R16 白P17 黑Q15 白虚手 黑O16 白O17 黑N16 白M17 黑虚手</p>
<div class="gm-host" data-mode="view" data-at="end" data-numbers="1" data-full="1"><script type="text/plain">(;SZ[19];B[qd]C[小目

又名komoku。小目偏重实地。就效率而言，它介于星位与三三之间。当重心在角上时，它的效力发挥到最大。小目常被视为稳健行棋的最佳占角，多年来一直受职业棋手（以及AI）青睐。即便如此，它缺少星位那种取势、并迅速向中腹发展的潜力。（第6页；另见石榑郁郎《In the Beginning》第11页。）];W[oc]LB[pe:A][pf:B][pc:C]C[一间低挂

又称小飞挂。这是对小目的基本挂法，把角分给黑白双方。

AlphaGo 之前，人们预期会夹。然而 AI 和当今职业棋手更喜欢在 A（Q15）或 B（Q14）退，或在 C（Q17）踢。];B[pe]LB[lc:A][kc:B]C[秀策的尖
因这一经典布局而闻名，是对白挂角的稳健应对。黑此后可以瞄着夹击或压住那颗孤立的白子。

脱先和 A（M17）是当今职业棋手非常偏爱的下法。
B（L17）是传统下法。];W[]LB[lc:A][nd:B][kc:C]C[A（M17）非常流行，职业棋手研究得很充分。
B（O16）可以是非常好的一手。
C（L17）和其他夹不太常见。];B[nd]LB[mc:A][nc:B][qc:C]C[A（N17）是传统的定式一手。
B（O17）和C（R17）是其他选择。];W[nc];B[md];W[lc];B[]C[见局面24726])</script></div>
