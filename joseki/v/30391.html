<h1>小目 · 白脱先</h1>
<p class="lead">17 手 · 理想</p>
<p class="seq">黑R16 白虚手 黑P16 白O16 黑O17 白N17 黑N16 白O15 黑N15 白P17 黑O18 白O14 黑P18 白N14 黑L15 白L13 黑J15</p>
<div class="gm-host" data-mode="view" data-at="end" data-numbers="1" data-full="1"><script type="text/plain">(;SZ[19];B[qd]C[小目

又名komoku。小目偏重实地。就效率而言，它介于星位与三三之间。当重心在角上时，它的效力发挥到最大。小目常被视为稳健行棋的最佳占角，多年来一直受职业棋手（以及AI）青睐。即便如此，它缺少星位那种取势、并迅速向中腹发展的潜力。（第6页；另见石榑郁郎《In the Beginning》第11页。）];W[]C[布局的最初几步要重视角。尤其下了小目之后，应尽快守角。这样通常能围出大约十目坚实实地。

守角的价值不只是围住的目数。在角上确立坚实根据地，便于从角向两边发展。

角上守角一般优先于边上的拆。];B[od]LB[mc:B][nd:A][mc:B][qe:C][qc:D][pc:E]C[高一间守角
这手守角能形成一道便于向右边展开的好壁。可是白若在 B（N17）挂，角上的门就开了，白可以进角。这说明了下在三线和四线上的基本差别。（第10页）

A（O16）是流行的新定式。白应考虑这条征子。
B（N17）是自然的挂角。
C（R15）从右边挂。
D（R17）和 E（Q17）用来试探角部。];W[nd];B[nc];W[mc];B[md];W[ne]LB[me:A][lc:B][oc:C]C[A（N15）是大多数时候的下法。
B（M17）侧重中腹和右边。
这条征子不利时，C（P17）会让白棋为难。];B[me];W[oc];B[nb];W[nf];B[ob];W[mf];B[ke];W[kg];B[ie])</script></div>
