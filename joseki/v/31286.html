<h1>三三 · 白星</h1>
<p class="lead">12 手 · 理想</p>
<p class="seq">黑R17 白Q16 黑R16 白Q15 黑P18 白N16 黑虚手 白R15 黑O16 白O15 黑O17 白N14</p>
<div class="gm-host" data-mode="view" data-at="end" data-numbers="1"><script type="text/plain">(;SZ[19];B[qc]C[三三

又称 san-san。一着三三就能完全占住角，不过位置偏低，机动性较差。重视实地、并准备打持久战的棋手最常使用，白棋也经常走这里。（第7页）

不像小目那样急着守角或挂角。双方都可以先观望，等别处的进程使挂或守变得合适时再动手。（石榑郁郎——《In the Beginning》，第12–13页。）];W[pd]C[压

这是对付三三的传统应手。

黑下一手往哪边走，取决于两边的配置。

先爬一手，往往是为了随后朝相反方向小飞滑入做准备。若黑走在1位（右侧），随后的小飞就走在上边。黑的小飞会削减它所在那一边的实地潜力。

如果边上已经有白子，白这一手就是错着。那种情况下，白本应从那颗子拆边，而不是走在Q16。];B[qd];W[pe];B[ob];W[md]LB[rf:A]C[定式
脱先很常见。
A（S14）继续传统定式。];B[];W[qe]LB[nd:A]C[后续
白的拐使右边更重要。

A（O16）是局部后续。];B[nd];W[ne];B[nc];W[mf])</script></div>
