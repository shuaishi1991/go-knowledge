又名komoku。小目偏重实地。就效率而言，它介于星位与三三之间。当重心在角上时，它的效力发挥到最大。小目常被视为稳健行棋的最佳占角，多年来一直受职业棋手（以及AI）青睐。即便如此，它缺少星位那种取势、并迅速向中腹发展的潜力。（第6页；另见石榑郁郎《In the Beginning》第11页。）];W[oc]LB[pe:A][pf:B][pc:C]C[一间低挂

又称小飞挂。这是对小目的基本挂法，把角分给黑白双方。

AlphaGo 之前，人们预期会夹。然而 AI 和当今职业棋手更喜欢在 A（Q15）或 B（Q14）退，或在 C（Q17）踢。];B[ld]C[二间高夹

这种夹在实地与外势之间保持平衡，选择很多，弱点很少。];W[pe];B[pd];W[od];B[oe];W[qe]C[这手棋在影山利郎的名著《围棋基本功》里曾被称作“无理”，如今则被视为局部的最佳着。旧定式白的收获不够。在这里挡，会引出困难的战斗。由此展开的变化，使它与雪崩、匕首、妖刀、大斜并列，成为现存最难的定式。
