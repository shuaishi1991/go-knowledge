<h1>目外 · 白靠小目</h1>
<p class="lead">11 手 · 理想</p>
<p class="seq">黑R15 白Q17 黑P16 白O17 黑P17 白P18 黑Q16 白R17 黑Q18 白O18 黑R18</p>
<div class="gm-host" data-mode="view" data-at="end" data-numbers="1"><script type="text/plain">(;SZ[19];B[qe]C[3-5 Point

AKA mokuhazushi. The 3-5 point is not a common opening play. It emphasizes influence and the side. Since it can often support taking a high position, it has more advantages when fighting globally. So it is more suitable to those who prefer a fighting game. (p. 9.)

Its asymmetrical stance invites an early follow-up play—either an enclosure by Black or an approach by White—as did a stone on the 3-4 point. (Ishigure Ikuro—In the Beginning, p. 16.)

[Explanation by Go Magic on Youtube (DDK/SDK)\](https://youtu.be/uGd_LM3A1H4?si=SL-EB3ZZXxuwC85m)

[Explanation by Go Inside on Youtube (SDK/Dan)\](https://youtu.be/enVLz7ZHzUY?si=bA8o6Rg6qafuQcDf)];W[pc]C[Low Approach
The usual move.

<A:P16> is the expected continuation. Black presses and normally retains sente.<br>
<B:O16> is the beginning of the Taisha joseki.];B[od]C[Pressing Move
Black shouldn't miss the chance to press down White's position with this knight's move. White's position will be entirely on the third line, which is not desirable. (p. 56.)

<A:P17> is chosen most of the time.<br>
<B:R16> is a new variation.<br>
<C:O17> is unplayable if [the ladder\](32024) favors Black.<br>
<D:Q16> is severe and can be good when White has a stone around <X:K16>.];W[nc]C[White has cutting points to worry about. 

<A:P17> is the local continuation. If [the ladder\](32022) favors White, Black should first play a ladder breaker, then embark on A.];B[oc];W[ob];B[pd]C[<A:R17> requires a favorable ladder at <C:O18>.<br>
White must play at <B:Q18> if the ladder favors Black.];W[qc]C[<A:Q18> requires a favorable ladder at B. (Page 71.)<br>
Black plays at <B:O18> if the ladder is unfavorable.];B[pb]C[<A:R18> wants a favorable ladder but is the best result regardless.<br>
<B:O18> is clearly bad. (Page 71.)];W[nb];B[qb]C[Black captures the corner. White certainly can't play this way. (Page 71.)])</script></div>
