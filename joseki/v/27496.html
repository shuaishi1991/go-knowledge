<h1>小目 · 白挂高目</h1>
<p class="lead">24 手 · 理想</p>
<p class="seq">黑R16 白P16 黑P17 白O17 黑Q17 白N16 黑R14 白J17 黑G17 白虚手 黑M17 白N18 黑K18 白Q15 黑R15 白L16 黑K16 白K17 黑L17 白L15 黑J18 白H17 黑H18 白J15</p>
<div class="gm-host" data-mode="view" data-at="end" data-numbers="1"><script type="text/plain">(;SZ[19];B[qd]C[3-4 Point

AKA komoku. The 3-4 point favors territory. In this regard, its efficiency is between that of the star and the 3-3 point. Its effectiveness is maximized when the focus is on the corner. Since the 3-4 point is often considered to be the best play for a steady approach to the game, the 3-4 point has been favored by professionals (and AI) over the years. Even so, it lacks the star point's potential for influence and rapid center development. (pp. 6; see also Ishigure Ikuro—In the Beginning, p. 11.)];W[od]C[One-Space High Approach

When White approaches high, it feels like it is pressing down on Black. This creates obvious influence toward the center. Black must take careful notice. (p. 6.)];B[oc]C[Inside Attachment
Black tries to strengthen his stones and protect the territory in the corner via attaching here. This joseki is commonly used by professional players. (Vol. 1.)

<A:O17> is simple and trades territory for influence.<br>
<B:Q16> leads to complex avalanche variations and some simple ones too.<br>
<C:O16> is slack.<br>
<D:Q17> is inferior.

[Explanation by Michael Redmond on Youtube (DDK/SDK)\](https://youtu.be/tMC4vI_ojzI?si=htpYGrXExUVloVOo)

[Explanation by Go Pro Yeonwoo on Youtube (SDK/Dan)\](https://youtu.be/WrawM8besGQ?si=DX0VX_2ouiSTysac)];W[nc]C[This is the simplest and most common response. White accepts a trade of territory for influence. (Vol. 1.)];B[pc]C[Attach and Draw Back Joseki

This move is a vital point to secure the corner territory and prevent White from cutting Black apart with an atari at the same point. When Black draws back to here, the cutting point at A becomes the focus of attack and defense. (Vol. 1.)

<A:O16> is the often best reinforcement (Vol. 1) and, according to Toshiro Kageyama, is "the only move White need consider"(Lessons in the Fundamentals of Go, p. 41).<br>
<B:N16> is another type of connection. (Vol. 1.)<br>
<C:O13> is a special tactic for moving into the center.];W[md]C[Hanging Connection
This move has almost completely left professional joseki repertoire.

The reason why is that the tiger's mouth connection is not as threatening to Black's corner as the [solid connection\](27533). Black should take the initiative and play elsewhere.

<A:R14> is the usual local response.];B[qf];W[ic]C[Joseki

White uses the thicker hanging connection to develop one line further on the top. (Vol. 1.) Even so, Black's four stones surround more territory than White's four stones on the upper side. If Black can do this in all four corners, White will certainly lose. (Yilun Yang—Fundamental Principles of Go, p. 13.)

The continuation of <A:G17> supports an invasion at <X:M17>.];B[gc];W[];B[lc];W[mb];B[jb];W[pe];B[qe];W[kd];B[jd];W[jc];B[kc];W[ke];B[ib];W[hc];B[hb];W[ie])</script></div>
