<p class="lead">15 手 · 理想</p>
<p class="seq">黑Q16 白R14 黑Q14 白Q13 黑R15 白P14 黑Q15 白R13 黑P13 白P12 黑O13 白O12 黑N13 白N12 黑M13</p>

又称星（hoshi）。星位让棋手在角上取得根据地，同时也便于发展外势。

星位虽偏向外势，取地却未必低效。对这手下法要保持灵活，随时按局势调整：有时用来做势，有时用来取地。（第10页）];W[qf]C[小飞挂

如果白正在朝自己的地域发展，比如说右边，就可以用这手挂来攻角。（其他挂法很少比这一手更可取。）（第14页。）

A（O17）和脱先都强调实地与先手，因此在现代围棋里很常用。];B[pf]C[靠
这手棋试图靠来加强黑棋，并经营上边。然而，加强自己却不加强对方，往往很难做到。（第1卷）

A（Q13）是传统正解。
B（R15）让黑变厚，但白也得到相当的补偿。
若这条征子有利于白，C（Q15）可以接受。
D（R13）松缓。
E（S16）是过分之着。];W[pg]C[这手扳是对黑靠的传统正解。白随后可以在A（P14）或X（Q15）先手打吃，便于进入中腹。一般说来，因为有打吃的可能，对靠的正解就是扳。（第1卷。）];B[qe]C[李昌镐九段推广了这手棋。职业棋手曾认为，由于棋形不好，这是黑最坏的变化。
