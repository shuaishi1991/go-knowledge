<h1>小目 · 白脱先</h1>
<p class="lead">14 手 · 理想</p>
<p class="seq">黑R16 白虚手 黑O16 白Q16 黑Q17 白R17 黑P17 白R15 黑S16 白Q14 黑R13 白S15 黑S17 白R11</p>
<div class="gm-host" data-mode="view" data-at="end" data-numbers="1"><script type="text/plain">(;SZ[19];B[qd]C[3-4 Point

AKA komoku. The 3-4 point favors territory. In this regard, its efficiency is between that of the star and the 3-3 point. Its effectiveness is maximized when the focus is on the corner. Since the 3-4 point is often considered to be the best play for a steady approach to the game, the 3-4 point has been favored by professionals (and AI) over the years. Even so, it lacks the star point's potential for influence and rapid center development. (pp. 6; see also Ishigure Ikuro—In the Beginning, p. 11.)];W[]C[The first steps in the opening emphasize the corners. When you play a 3-4 stone, in particular, you should waste no time enclosing the corner. This will usually build about ten points of secure territory.

The value of an enclosure isn't just the points of territory it surrounds. Securing a solid base in the corner makes it easy to develop along either side from the corner.

A corner enclosure generally takes priority over a side extension.];B[nd]C[Two-Space High Enclosure

AKA AlphaGo enclosure. This move avoids the shoulder hit at <position: 30589>. It was once considered bad because it makes the corner more vulnerable, but it fits with a greater concern for the center, which is characteristic of AlphaGo's play. A side extension around <X:Q10> is big for both sides.<br>

<A:M17> is the strongest approach.<br>
<B:R13> approaches from the opposite side when White has friendly support on the right.<br>
<C:R14> is an effective invasion point when Black has an established moyo.<br>
<D:Q16> functions as a probe and requires a [ladder\](33466). It is not recommended without any nearby stones that could support it.<br>
<E:Q17>, <F:P17>, and <G:R17> are late game invasions that White can play to live small inside the corner in gote. They are typically not recommended in an open board.];W[pd];B[pc];W[qc];B[oc]C[If there are no surrounding stones, Tenuki is recommended in the AI joseki dictionary, as White cannot expect to get a good local result.];W[qe];B[rd];W[pf];B[qg];W[re];B[rc];W[qi]C[Joseki])</script></div>
