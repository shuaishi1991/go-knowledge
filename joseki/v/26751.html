<h1>小目 · 白挂目外</h1>
<p class="lead">18 手 · 理想</p>
<p class="seq">黑R16 白P17 黑M17 白R17 黑S17 白Q16 黑R18 白R15 黑Q17 白S16 黑R17 白P15 黑虚手 白O18 黑S15 白S14 黑T16 白R14</p>
<div class="gm-host" data-mode="view" data-at="end" data-numbers="1" data-full="1"><script type="text/plain">(;SZ[19];B[qd]C[小目

又名komoku。小目偏重实地。就效率而言，它介于星位与三三之间。当重心在角上时，它的效力发挥到最大。小目常被视为稳健行棋的最佳占角，多年来一直受职业棋手（以及AI）青睐。即便如此，它缺少星位那种取势、并迅速向中腹发展的潜力。（第6页；另见石榑郁郎《In the Beginning》第11页。）];W[oc]LB[pe:A][pf:B][pc:C]C[一间低挂

又称小飞挂。这是对小目的基本挂法，把角分给黑白双方。

AlphaGo 之前，人们预期会夹。然而 AI 和当今职业棋手更喜欢在 A（Q15）或 B（Q14）退，或在 C（Q17）踢。];B[lc]LB[pe:A]C[二间低夹
这种夹在17世纪很流行，当代对局中仍在使用。与它从前“悠闲”的名声相反（据大竹英雄等人所说），白棋走了 A（Q15）之后，这手棋可能引发战斗（见局面26800）。AI 分析认为这块战斗大致两分，与传统预期不同。白棋若避开战斗，棋局也可以用简明的下法继续。

见 Michael Redmond, AlphaGo vs. The World: Game 34, Dang Yifei 9p (W) vs. AlphaGo Master (B)。];W[qc]C[常见错误
这一手想造出强形，准备攻击夹过来的棋子，但白造出的形既不强，之后去攻也不划算。白有更好的选择。];B[rc];W[pd];B[qb];W[qe];B[pc];W[rd];B[qc];W[oe]C[白的棋形很容易被破坏。];B[];W[nb];B[re];W[rf];B[sd];W[qf])</script></div>
