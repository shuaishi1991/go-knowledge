<h1>星位 · 白脱先</h1>
<p class="lead">8 手 · 理想</p>
<p class="seq">黑Q16 白虚手 黑R14 白Q13 黑虚手 白R13 黑Q14 白P13</p>
<div class="gm-host" data-mode="view" data-at="end" data-numbers="1"><script type="text/plain">(;SZ[19];B[pd]C[4-4 Point

AKA star point; hoshi. The 4-4 point allows a player to establish a foothold in a corner while also enabling development of influence. 

Although the 4-4 point favors influence, it is not necessarily inefficient at securing territory. Players should be flexible with this move, ready to adjust their strategy to changing circumstances, at times using it to build influence, at other times going for territory. (p. 10.)];W[]C[In general, enclosing a corner takes priority over a side extension];B[qf]C[Small Knight Enclosure

This enclosure is sometimes good, but it doesn't secure the corner as well as a 3-4 point enclosure. White has several moves for taking a large bite out of the corner. (p. 15.)

While A has become a very popular move, the most common continuation is still to deny Black an extension on the top with a move at X.

<A:Q13> has become popular since AlphaGo.
<BR><B:P18> and <D:Q18> are traditional and aim to make miai of the corner and top.
<BR><C:O17> approaches directly and must be prepared for a fight.
<BR><E:Q17> is sometimes played when Black has a position around <X:K17>.
<BR><F:R17> aims for small life in the corner, typically involving a ko.];W[pg]C[Shoulder Hit
In the past, this was an unusual play, rarely seen, especially early in the game. It doesn't seem urgent and it isn't sente, but the perception changed when AlphaGo often played it. The idea is to compress Black's position without directly invading. As opposed to an invasion, this play lowers risk and offers a trade of the corner for outside influence. This also fits with the fundamental principle of Go that you don't try to destroy your opponent and get everything, but simply to play better than the opponent so as to get a little more.

Playing a pincer against this shoulder hit is an AI idea that is commonly played. <D:Q9>, <E:R10>, <F:Q10>, and <G:R11> are fixtures in current(2019) professional play but have not quite settled into set patterns yet.];B[];W[qg];B[pf];W[og])</script></div>
