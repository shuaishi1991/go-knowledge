这手刺是 AI 所偏爱的，不过人类棋手此前也下过。它补强了黑棋，同时也给白棋留下潜力。黑棋若不接，白棋就会断。

A（P16）把黑子牢固地连在一起，一般是正确下法。见影山利郎，《Lessons in the Fundamentals of Go》，第43页。
B（R15）在这条征子对白不利时可以考虑。
C（O15）也可以。
