<h1>星位 · 白小飞挂</h1>
<p class="lead">10 手 · 理想</p>
<p class="seq">黑Q16 白R14 黑O17 白虚手 黑R15 白Q14 黑Q10 白Q8 黑Q12 白O15</p>
<div class="gm-host" data-mode="view" data-at="end" data-numbers="1" data-full="1"><script type="text/plain">(;SZ[19];B[pd]C[星位

又称星（hoshi）。星位让棋手在角上取得根据地，同时也便于发展外势。

星位虽偏向外势，取地却未必低效。对这手下法要保持灵活，随时按局势调整：有时用来做势，有时用来取地。（第10页）];W[qf]LB[nc:A]C[小飞挂

如果白正在朝自己的地域发展，比如说右边，就可以用这手挂来攻角。（其他挂法很少比这一手更可取。）（第14页。）

A（O17）和脱先都强调实地与先手，因此在现代围棋里很常用。];B[nc]LB[qd:A]C[小飞
取实地的应手。

现代围棋重视速度和角，所以脱先和A（R16）是最流行的选择，而且遥遥领先。];W[]LB[qe:A][qh:B][qi:C][qj:D][pj:E][rd:F]C[脱先是常见选择。
A（R15）、B（R12）、C（R11）对白子施压。
D（R10）和 E（Q10）压力较小，但与右下的关系可能更好。
当白两边都强、难以压迫这颗挂子时，F（S16）是定式。];B[qe]LB[pf:A]C[蹬能封住角，同时把白走重。这比直接夹那颗白子更有弹性，不过两种都是常见下法。

应在A（Q14）是推荐的；但如果有非常大的布局点或急所，也可以脱先。];W[pf]C[战斗定式

这是很常见的战斗局面，视情况双方都可能有利。判断结果时要记住：黑在角上先下了两手，局部应当期待较大优势。];B[pj];W[pl];B[ph];W[ne])</script></div>
