<h1>小目 · 白挂高目</h1>
<p class="lead">26 手 · 理想</p>
<p class="seq">黑R16 白P16 黑P17 白O17 黑Q17 白N16 黑O15 白N15 黑O18 白N18 黑O16 白N17 黑O14 白N13 黑O13 白O12 黑P12 白O11 黑N14 白M14 黑M13 白N12 黑L14 白M15 黑Q12 白Q10</p>
<div class="gm-host" data-mode="view" data-at="end" data-numbers="1"><script type="text/plain">(;SZ[19];B[qd]C[小目

又名komoku。小目偏重实地。就效率而言，它介于星位与三三之间。当重心在角上时，它的效力发挥到最大。小目常被视为稳健行棋的最佳占角，多年来一直受职业棋手（以及AI）青睐。即便如此，它缺少星位那种取势、并迅速向中腹发展的潜力。（第6页；另见石榑郁郎《In the Beginning》第11页。）];W[od]C[一间高挂

白棋高挂时，有压住黑棋的感觉，并向中腹形成明显的外势。黑棋必须小心应对。（第6页）];B[oc]C[内靠
黑在此靠，试图加强自己的棋，并保护角上实地。职业棋手常用这个定式。（第1卷）

A（O17）简明，以实地换外势。
B（Q16）会导向复杂的雪崩变化，也有一些简单变化。
C（O16）缓。
D（Q17）较差。];W[nc]C[这是最简单、也最常见的应手。白接受实地换外势的转换。（第1卷。）];B[pc]C[靠退定式

这一手是要点，既能保住角地，又能防止白在同一点打吃、把黑断开。黑退到这里之后，A位的断点就成了攻防的焦点。（第1卷。）

A（O16）常常是最好的补强（第1卷）。影山利郎认为，这是“白唯一需要考虑的一手”（《围棋基本功》，第41页）。
B（N16）是另一种连法。（第1卷。）
C（O13）是进入中腹的特殊手段。];W[md]C[挂连
这手棋几乎已经完全退出职业定式谱。

原因是，虎口连对黑角的威胁不如实连。黑应当抓住主动，到别处去下。

A（R14）是通常的局部应手。];B[ne]C[这手刺消掉 A（M17）一带的味道，但有助于经营右边。黑若要在这里刺，必须在 B（Q14）或 C（R14）防守之前下。黑若先占其中一点，一旦白挡上边、黑再切断虎口，棋形就可能重复。];W[me];B[nb];W[mb];B[nd];W[mc];B[nf];W[mg];B[ng];W[nh];B[oh];W[ni];B[mf];W[lf];B[lg];W[mh];B[kf];W[le];B[ph];W[pj])</script></div>
