<h1>小目 · 白挂目外</h1>
<p class="lead">23 手 · 理想</p>
<p class="seq">黑R16 白P17 黑M17 白Q15 黑Q16 白P16 黑P15 白Q14 黑O15 白Q18 黑O18 白S18 黑S15 白N16 黑O16 白O17 黑N17 白P18 黑S17 白N18 黑M18 白O19 黑R13</p>
<div class="gm-host" data-mode="view" data-at="end" data-numbers="1"><script type="text/plain">(;SZ[19];B[qd]C[小目

又名komoku。小目偏重实地。就效率而言，它介于星位与三三之间。当重心在角上时，它的效力发挥到最大。小目常被视为稳健行棋的最佳占角，多年来一直受职业棋手（以及AI）青睐。即便如此，它缺少星位那种取势、并迅速向中腹发展的潜力。（第6页；另见石榑郁郎《In the Beginning》第11页。）];W[oc]C[一间低挂

又称小飞挂。这是对小目的基本挂法，把角分给黑白双方。

AlphaGo 之前，人们预期会夹。然而 AI 和当今职业棋手更喜欢在 A（Q15）或 B（Q14）退，或在 C（Q17）踢。];B[lc]C[二间低夹
这种夹在17世纪很流行，当代对局中仍在使用。与它从前“悠闲”的名声相反（据大竹英雄等人所说），白棋走了 A（Q15）之后，这手棋可能引发战斗（见局面26800）。AI 分析认为这块战斗大致两分，与传统预期不同。白棋若避开战斗，棋局也可以用简明的下法继续。

见 Michael Redmond, AlphaGo vs. The World: Game 34, Dang Yifei 9p (W) vs. AlphaGo Master (B)。

Go Inside 在 YouTube 上的讲解（SDK/段）];W[pe];B[pd];W[od];B[oe];W[pf];B[ne];W[pb];B[nb];W[rb];B[re]C[从这个局面出发，白有许多可行的后续，其中多数复杂且分支很多。N17和R13很可能是最佳选择：N17给白一条在角上做活的路，R13在多数情况下导向双活。];W[md];B[nd];W[nc];B[mc];W[ob];B[rc];W[mb];B[lb];W[na]C[从这个局面可以下R18，并可能导向更复杂的战斗。];B[qg])</script></div>
