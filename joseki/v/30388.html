<h1>小目 · 白脱先</h1>
<p class="lead">15 手 · 理想</p>
<p class="seq">黑R16 白虚手 黑P16 白O16 黑O17 白N17 黑N16 白O15 黑N15 白P17 黑O18 白O14 黑P18 白N14 黑M17</p>
<div class="gm-host" data-mode="view" data-at="end" data-numbers="1"><script type="text/plain">(;SZ[19];B[qd]C[3-4 Point

AKA komoku. The 3-4 point favors territory. In this regard, its efficiency is between that of the star and the 3-3 point. Its effectiveness is maximized when the focus is on the corner. Since the 3-4 point is often considered to be the best play for a steady approach to the game, the 3-4 point has been favored by professionals (and AI) over the years. Even so, it lacks the star point's potential for influence and rapid center development. (pp. 6; see also Ishigure Ikuro—In the Beginning, p. 11.)];W[]C[The first steps in the opening emphasize the corners. When you play a 3-4 stone, in particular, you should waste no time enclosing the corner. This will usually build about ten points of secure territory.

The value of an enclosure isn't just the points of territory it surrounds. Securing a solid base in the corner makes it easy to develop along either side from the corner.

A corner enclosure generally takes priority over a side extension.];B[od]C[One-Space High Enclosure
This enclosure makes a good wall from which to extend across the right side. But if White plays <B:N17>, the door is then open
for White to step into the corner. This illustrates the basic difference between playing on the third and fourth lines. (p. 10.)

<A:O16> is a popular new joseki. White should consider [this ladder\](30380).<br>
<B:N17> is a natural way to approach the corner.<br>
<C:R15> approaches from the right side.<br>
<D:R17> and <E:Q17> probe the corner.];W[nd]C[[Explanation by Michael Redmond on Youtube (SDK/Dan)\](https://www.youtube.com/watch?v=OrGXvq6Fap8&t=1318s)

[Explanation by Go Pro Yeonwoo on Youtube (SDK/Dan)\](https://youtu.be/jHLSD7qns38?si=f6GYC0r-IW1N28tK)];B[nc];W[mc];B[md];W[ne]C[<A:N15> is played the majority of the time.<br>
<B:M17> emphasizes the center and the right.<br>
<C:P17> makes things difficult for White if [the ladder\](30380) is unfavorable.];B[me];W[oc];B[nb];W[nf];B[ob];W[mf];B[lc])</script></div>
