<h1>小目 · 白挂目外</h1>
<p class="lead">7 手 · 理想</p>
<p class="seq">黑R16 白P17 黑Q17 白P16 黑Q14 白Q12 黑O14</p>
<div class="gm-host" data-mode="view" data-at="end" data-numbers="1"><script type="text/plain">(;SZ[19];B[qd]C[3-4 Point

AKA komoku. The 3-4 point favors territory. In this regard, its efficiency is between that of the star and the 3-3 point. Its effectiveness is maximized when the focus is on the corner. Since the 3-4 point is often considered to be the best play for a steady approach to the game, the 3-4 point has been favored by professionals (and AI) over the years. Even so, it lacks the star point's potential for influence and rapid center development. (pp. 6; see also Ishigure Ikuro—In the Beginning, p. 11.)];W[oc]C[One-Space Low Approach

AKA small knight approach. This is the basic approach move to the 3-4 point and divides the corner between Black and White.

Prior to AlphaGo, a pincer would be expected. However, AI and current professionals prefer 'backing off' with <A:Q15> or <B:Q14> or kicking at <C:Q17>.];B[pc]C[Kick
AlphaGo reintroduced this move to get the corner in sente.];W[od]C[The Vital Point
It’s common sense to answer an attachment with a hane. However, if the attaching stone is connected to friendly forces, one cannot stubbornly hane. White stretches to here instead. Allowing Black to create a tiger’s mouth with a hane at P16(<X:P16>) was intolerable for White. (Vol. 1.)];B[pf];W[ph];B[nf])</script></div>
