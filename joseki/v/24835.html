<h1>小目 · 白挂目外</h1>
<p class="lead">16 手 · 理想</p>
<p class="seq">黑R16 白P17 黑N17 白P15 黑Q14 白P14 黑Q13 白P13 黑K17 白Q12 黑R12 白R11 黑S13 白S12 黑R13 白Q11</p>
<div class="gm-host" data-mode="view" data-at="end" data-numbers="1" data-full="1"><script type="text/plain">(;SZ[19];B[qd]C[小目

又名komoku。小目偏重实地。就效率而言，它介于星位与三三之间。当重心在角上时，它的效力发挥到最大。小目常被视为稳健行棋的最佳占角，多年来一直受职业棋手（以及AI）青睐。即便如此，它缺少星位那种取势、并迅速向中腹发展的潜力。（第6页；另见石榑郁郎《In the Beginning》第11页。）];W[oc]LB[pe:A][pf:B][pc:C]C[一间低挂

又称小飞挂。这是对小目的基本挂法，把角分给黑白双方。

AlphaGo 之前，人们预期会夹。然而 AI 和当今职业棋手更喜欢在 A（Q15）或 B（Q14）退，或在 C（Q17）踢。];B[mc]LB[pe:A][oe:B][md:C]C[一间低夹
这种贴身夹往往立刻引发战斗。

A（Q15）基本上是当前职业棋手和 AI 考虑的唯一一手。它会导向非常复杂的定式（24937），白若不做重大让步就无法避开。
可以脱先。
B（P15）和 C（N16）是更简单的选择。];W[oe];B[pf];W[of];B[pg];W[og];B[jc]C[恶手
有些棋手“竟一本正经地认为，这手荒唐的拆二是妙手，能让两边都有好结果。他们那高兴劲儿，像是在沙漠里捡到了钻石。可怕的是这种扭曲的眼光：把对的看成错的。一个错觉引出下一个，棋的质量便迅速下降。”（第57页）];W[ph]LB[jc:A][ph:B]C[“黑在A（K17）走出败着的那一刻，白就用B（Q12）扳住他的棋头。”（第58页）];B[qh]C[“黑在此扳作为应手。”（第58页。）];W[qi]C[“可是接下来白在这里下出精彩有力的连扳。”（第58页）];B[rg];W[rh];B[qg];W[pi]C[白棋有利

“走到此处为止，后面的棋都是被牵着走。黑棋的结果惨不忍睹。

“‘这对黑棋真有这么糟吗？’我知道会有人这么问，所以在此作答。‘糟？用荒谬更合适。看看黑棋被压扁的棋形，看看白棋的外势。爱上那堵厚厚的白壁吧。体会白棋的结果有多好。若你仍不明白，就每天一起床把这个局面摆上棋盘，反复念：白棋的厚势更优。’”（第58页）])</script></div>
