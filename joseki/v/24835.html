<h1>小目 · 白挂目外</h1>
<p class="lead">16 手 · 理想</p>
<p class="seq">黑R16 白P17 黑N17 白P15 黑Q14 白P14 黑Q13 白P13 黑K17 白Q12 黑R12 白R11 黑S13 白S12 黑R13 白Q11</p>
<div class="gm-host" data-mode="view" data-at="end" data-numbers="1"><script type="text/plain">(;SZ[19];B[qd]C[3-4 Point

AKA komoku. The 3-4 point favors territory. In this regard, its efficiency is between that of the star and the 3-3 point. Its effectiveness is maximized when the focus is on the corner. Since the 3-4 point is often considered to be the best play for a steady approach to the game, the 3-4 point has been favored by professionals (and AI) over the years. Even so, it lacks the star point's potential for influence and rapid center development. (pp. 6; see also Ishigure Ikuro—In the Beginning, p. 11.)];W[oc]C[One-Space Low Approach

AKA small knight approach. This is the basic approach move to the 3-4 point and divides the corner between Black and White.

Prior to AlphaGo, a pincer would be expected. However, AI and current professionals prefer 'backing off' with <A:Q15> or <B:Q14> or kicking at <C:Q17>.];B[mc]C[One-Space Low Pincer
This close-up pincer will often lead to immediate fighting.

<A:Q15> is basically the only move current professionals and AI consider. It can lead to a very [complicated joseki\](24937) that White can't avoid without heavy compromise.<br>
Tenuki is possible.<br>
<B:P15> and <C:N16> are simpler options.

[Explanation by Shawn Ray on Youtube (DDK/SDK)\](https://youtu.be/CSlczQFWmAw?si=SmxMJCs9DOuzunKF)

[Explanation by Go Inside on Youtube (SDK/Dan)\](https://youtu.be/FzV95UuM7aA?si=pSeXUtPNNJW2HdB9)];W[oe];B[pf];W[of];B[pg];W[og];B[jc]C[Blunder
Some players "seriously think that this ridiculous two-space extension is a splendid move, giving them good results on both sides. They look as pleased as if they had found a diamond in the desert. The frightening thing about this is the warped vision that perceives the correct as incorrect. One such illusion leads to the next, and the quality of the game quickly
deteriorates." (Page 57.)];W[ph]C["The moment Black makes his blunder at <A:K17>, White hanes at the head of his stones with <B:Q12>." (Page 58.)];B[qh]C["Black hanes [here\] in reply." (Page 58.)];W[qi]C["But then White plays the wonderful, powerful double hane [here\]." (Page 58.)];B[rg];W[rh];B[qg];W[pi]C[Good for White

"The rest of the moves up to [here\] are a forced walk. Black's result is too pitiful for words.

"'[Is this\] really so bad for Black?' I can hear the
question coming, so here is my answer. 'Bad? Preposterous
would be a better word. Look at Black's compressed
position. Look at White's outer influence. Fall in love
with that thick white wall. Realize how good White's
result is. If you cannot understand this, lay the position
out on the go board every morning as soon as you get up
and chant the words, "White's thickness is superior."'" (Page 58.)])</script></div>
