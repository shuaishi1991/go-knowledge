<h1>小目 · 白挂目外</h1>
<p class="lead">15 手 · 理想</p>
<p class="seq">黑R16 白P17 黑Q14 白R17 黑S17 白Q16 黑R18 白R15 黑Q17 白S16 黑R17 白Q15 黑O17 白P14 黑P18</p>
<div class="gm-host" data-mode="view" data-at="end" data-numbers="1"><script type="text/plain">(;SZ[19];B[qd]C[小目

又名komoku。小目偏重实地。就效率而言，它介于星位与三三之间。当重心在角上时，它的效力发挥到最大。小目常被视为稳健行棋的最佳占角，多年来一直受职业棋手（以及AI）青睐。即便如此，它缺少星位那种取势、并迅速向中腹发展的潜力。（第6页；另见石榑郁郎《In the Beginning》第11页。）];W[oc]C[一间低挂

又称小飞挂。这是对小目的基本挂法，把角分给黑白双方。

AlphaGo 之前，人们预期会夹。然而 AI 和当今职业棋手更喜欢在 A（Q15）或 B（Q14）退，或在 C（Q17）踢。];B[pf]C[小飞

这是对白棋挂角的稳健应手。比起尖，它更灵活，黑棋可以在右边拆得更开，但没有那么坚实。

脱先相当流行。
A（L16）是现代的拆法。
B（R12）从另一侧挂入。
C（M17）坚实而有韧性。
D（L17）是古典的拆法。
F（R17）视局面而定，意在立刻安定。黑棋右边已强时，这手是合理的。

Go Pro Yeonwoo 在 YouTube 上的讲解（SDK/段）];W[qc]C[这手靠加强了黑，并削弱了X（R12）处那手牵制的威力，所以最合理的场合，是黑在右边已经很强。];B[rc]C[A（Q16）常常把行棋方向转到右边。
B（S16）是试应手；若黑在右边已经很强，可以成为合理的交换。
C（R18）旨在马上安定。];W[pd]C[这个鼓出在AI定式辞典里受到严厉批评。历史上它被当作让白得以安定的一手，但B（R18）的打吃破坏了这个打算。

A（R15）是传统下法，但偏软。
