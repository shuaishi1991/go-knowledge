<h1>小目 · 白挂高目</h1>
<p class="lead">19 手 · 理想</p>
<p class="seq">黑R16 白P16 黑P17 白Q16 黑Q17 白R15 黑O16 白R17 黑S16 白R18 黑S15 白R14 黑S14 白O17 黑P15 白Q15 黑R13 白Q14 黑P14</p>
<div class="gm-host" data-mode="view" data-at="end" data-numbers="1"><script type="text/plain">(;SZ[19];B[qd]C[3-4 Point

AKA komoku. The 3-4 point favors territory. In this regard, its efficiency is between that of the star and the 3-3 point. Its effectiveness is maximized when the focus is on the corner. Since the 3-4 point is often considered to be the best play for a steady approach to the game, the 3-4 point has been favored by professionals (and AI) over the years. Even so, it lacks the star point's potential for influence and rapid center development. (pp. 6; see also Ishigure Ikuro—In the Beginning, p. 11.)];W[od]C[One-Space High Approach

When White approaches high, it feels like it is pressing down on Black. This creates obvious influence toward the center. Black must take careful notice. (p. 6.)];B[oc]C[Inside Attachment
Black tries to strengthen his stones and protect the territory in the corner via attaching here. This joseki is commonly used by professional players. (Vol. 1.)

<A:O17> is simple and trades territory for influence.<br>
<B:Q16> leads to complex avalanche variations and some simple ones too.<br>
<C:O16> is slack.<br>
<D:Q17> is inferior.

[Explanation by Michael Redmond on Youtube (DDK/SDK)\](https://youtu.be/tMC4vI_ojzI?si=htpYGrXExUVloVOo)

[Explanation by Go Pro Yeonwoo on Youtube (SDK/Dan)\](https://youtu.be/WrawM8besGQ?si=DX0VX_2ouiSTysac)];W[pd]C[The avalanche pattern includes many perilous variations. However, there are a couple of simple continuations that Black can choose.

Black has the initial choice of joseki with this pattern. The outcome is typically Black gets the corner and out on the side, White thickness.

Note that this move may be joseki only when White occupies D4, as a ladder from certain avalanche positions (e.g., <position:27044>) won't work otherwise and makes the outcome a bit better for Black. A White stone at C4 is insufficient. See [Michael Redmond, *AlphaGo vs. The World: Game 26, Yun Chanhee 6p (W) vs. AlphaGo Master (B)*\](https://www.youtube.com/watch?v=1w1Kx2n44tU&t=182s).];B[pc];W[qe]C[<A:S16> takes territory in a simple way.<br>

<B:O17> can lead to the large avalanche.<br>

<C:R17> is another way to avoids complications.<br>

<D:O16> is the small avalanche (ko-nadare).<br>

<E:S15> is peaceful but leads to good results for White.

On the large avalanche joseki, Takemiya Masaki 9p once remarked: "I will never play avalanche in my life again. I don't like large scale joseki since it's complicated and it settles too much of the board. For beginners I recommend just to play the simple variation (A)." Michael Redmond also recommends A. 

See [Michael Redmond, *AlphaGo vs. The World: Game 16, AlphaGo Master (W) vs. Lian Xiao 7p (B)*\](https://www.youtube.com/watch?v=w5QIaTIZqFo&t=144s) and [*Game 55, AlphaGo Master (W) vs. Chen Yaoye 9p + Meng Tailing 6p (B)*\](https://www.youtube.com/watch?v=aAk_JW21zOg&t=249s).];B[nd]C[Small Avalanche Joseki

This joseki involves a ladder (see <position:27044>). If White occupies D4, then the variation favors White. If White occupies C4 or has no presence in that corner, then this joseki is playable for Black.

See [Michael Redmond, *AlphaGo vs. The World: Game 26, Yun Chanhee 6p (W) vs. AlphaGo Master (B)*\](https://www.youtube.com/watch?v=1w1Kx2n44tU&t=405s).

[Explanation by New York Institute of Go on Youtube (SDK/Dan)\](https://youtu.be/CCf9cqsZVDE?si=9NdVjJltTpclON7E)];W[qc];B[rd];W[qb]C[This White's move aiming for the cut at <X:O17>];B[re]C[<A:R14> requires a [favorable ladder\](27049).<BR>
<B:Q14> is the only move otherwise.

See [Michael Redmond, *AlphaGo vs. The World: Game 26, Yun Chanhee 6p (W) vs. AlphaGo Master (B)*\](https://www.youtube.com/watch?v=1w1Kx2n44tU&t=405s).];W[qf]C[<A:Q18> or <B:O15> are joseki.<br>
<X:S14> punishes White if the ladder is unfavorable.];B[rf]C[<A:O17> shows the ladder variation.<br>
<B:R13> is the best that White can do if the ladder is unfavorable.];W[nc]C[Ladder Variation];B[oe];W[pe];B[qg];W[pf];B[of]C[Ladder])</script></div>
