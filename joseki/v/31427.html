<div class="gm-host" data-mode="view" data-at="end" data-numbers="1"><script type="text/plain">(;SZ[19];B[qe]C[三五点

又名目外。三五点不是常见的布局着法。它侧重外势和边。由于它常常有利于占据高位，全局作战时更有优势，因此更适合喜欢战斗的棋风。（第9页）

它不对称的姿态会引出早期的续着——黑守角，或白来挂——正如小目上的一子那样。（石仓郁郎——《In the Beginning》，第16页）];W[od]C[高挂

这手挂放弃角地，局部略亏。即便如此，它仍是避免被压在低位的可行办法，并能在上边已有的阵地上保持联络与配合的优势。（第56页。）];B[oe];W[pe]C[若征子（31417）有利于白，则可以。];B[pf];W[pd];B[qd];W[qc];B[qg];W[rf];B[qf];W[ne];B[of];W[pb]LB[qi:A]C[定式
