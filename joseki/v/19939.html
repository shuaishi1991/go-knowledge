<h1>星位 · 白小飞挂</h1>
<p class="lead">13 手 · 理想</p>
<p class="seq">黑Q16 白R14 黑Q12 白P14 黑O16 白R17 黑R16 白S16 黑S15 白S17 黑S14 白P18 黑R13</p>
<div class="gm-host" data-mode="view" data-at="end" data-numbers="1"><script type="text/plain">(;SZ[19];B[pd]C[4-4 Point

AKA star point; hoshi. The 4-4 point allows a player to establish a foothold in a corner while also enabling development of influence. 

Although the 4-4 point favors influence, it is not necessarily inefficient at securing territory. Players should be flexible with this move, ready to adjust their strategy to changing circumstances, at times using it to build influence, at other times going for territory. (p. 10.)];W[qf]C[Knight's Approach

If White is building towards an area of her own on, say, the right side, then White can attack the corner with this approach. (Other approaches are seldom preferable to this one.) (p. 14.)

<A:O17> and Tenuki emphasize territory and sente. This makes them popular choices in modern Go.];B[ph]C[One-Space High Pincer
This pincer is good if Black has a stone around <A:K16>. It's a severe pincer, reducing White's potential to make a base.

See also [Michael Redmond, *AlphaGo vs. The World: Game 23, Kim Junghyun 6p (W) vs. AlphaGo Master (B)*\](https://www.youtube.com/watch?v=H8Oehpm4Rho&t=140s).];W[of]C[White plays this way to stop black getting a moyo at the top.];B[nd];W[qc];B[qd];W[rd];B[re];W[rc];B[rf]C[Black plays this and <X:R13> to erase most of whites' aji in the center.];W[ob];B[qg]C[White prevents Black from getting a moyo at the top.])</script></div>
