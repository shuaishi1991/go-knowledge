<h1>星位 · 白小飞挂</h1>
<p class="lead">13 手 · 理想</p>
<p class="seq">黑Q16 白R14 黑Q12 白P14 黑O16 白R17 黑R16 白S16 黑S15 白S17 黑S14 白P18 黑R13</p>
<div class="gm-host" data-mode="view" data-at="end" data-numbers="1" data-full="1"><script type="text/plain">(;SZ[19];B[pd]C[星位

又称星（hoshi）。星位让棋手在角上取得根据地，同时也便于发展外势。

星位虽偏向外势，取地却未必低效。对这手下法要保持灵活，随时按局势调整：有时用来做势，有时用来取地。（第10页）];W[qf]LB[nc:A]C[小飞挂

如果白正在朝自己的地域发展，比如说右边，就可以用这手挂来攻角。（其他挂法很少比这一手更可取。）（第14页。）

A（O17）和脱先都强调实地与先手，因此在现代围棋里很常用。];B[ph]LB[jd:A]C[一间高夹
黑棋在 A（K16）一带有子时，这手夹很好。它夹得很紧，压缩了白棋做根据地的余地。

另见 Michael Redmond, AlphaGo vs. The World: Game 23, Kim Junghyun 6p (W) vs. AlphaGo Master (B)。];W[of]C[白这样下，是为了不让黑在上边做出模样。];B[nd];W[qc];B[qd];W[rd];B[re];W[rc];B[rf]LB[qg:X]C[黑下这手，再下X（R13），以消去白在中腹的大部分味道。];W[ob];B[qg]C[白防止黑在上边形成模样。])</script></div>
