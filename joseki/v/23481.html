<h1>星位 · 白脱先</h1>
<p class="lead">14 手 · 理想</p>
<p class="seq">黑Q16 白虚手 黑R14 白虚手 黑O17 白R17 黑S15 白P18 黑O18 白P17 黑P16 白S18 黑P19 白O16</p>
<div class="gm-host" data-mode="view" data-at="end" data-numbers="1" data-full="1"><script type="text/plain">(;SZ[19];B[pd]C[星位

又称星（hoshi）。星位让棋手在角上取得根据地，同时也便于发展外势。

星位虽偏向外势，取地却未必低效。对这手下法要保持灵活，随时按局势调整：有时用来做势，有时用来取地。（第10页）];W[]C[一般而言，守角优先于边上的拆。];B[qf]LB[pg:A][ob:B][pb:D][nc:C][pc:E][jc:X][qc:F]C[小飞守角

这种守角有时不错，但不如小目守角那样把角守牢。白有好几手可以从角上咬下一大块。（第15页。）

虽然A已经非常流行，最常见的后续仍是在X落子，不让黑往上边拆。

A（Q13）自AlphaGo以来变得流行。
B（P18）和D（Q18）是传统下法，意在让角部和上边形成见合。
C（O17）直接来挂，必须准备作战。
黑在X（K17）一带有棋时，有时会下E（Q17）。
F（R17）意在角上小活，通常会涉及劫。];W[];B[nc]C[大飞守角

这手守角一度被认为不好，因为角上会出劫。人工智能革命之后它更流行了，因为对中腹战斗的影响更大，而且很难找到合适的时机打入。];W[qc]LB[qd:A][re:B]C[试应手
A（R16）会形成劫。
B（S15）局部杀死白棋，但留下坏味道。];B[re]C[与局面23523比较。];W[ob];B[nb];W[oc];B[od];W[rb]C[若白进角太早，黑这里可以脱先。黑虽然能在角上杀死白棋，但留下的味道实在很坏，其价值可以抵得上一个大场。];B[oa]LB[nd:A]C[黑杀棋

但A（O16）的断给了白外侧许多先手，在一定程度上可以补偿损失。];W[nd]LB[qd:A]C[视白外边有多强，白有可能从这手断开始救回角上的子：若能先手加强这颗断子，就从 A（R16）逃出。])</script></div>
