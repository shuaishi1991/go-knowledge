<h1>星位 · 白小飞挂</h1>
<p class="lead">8 手 · 理想</p>
<p class="seq">黑Q16 白R14 黑R12 白P14 黑O16 白Q11 黑虚手 白R11</p>
<div class="gm-host" data-mode="view" data-at="end" data-numbers="1"><script type="text/plain">(;SZ[19];B[pd]C[星位

又称星（hoshi）。星位让棋手在角上取得根据地，同时也便于发展外势。

星位虽偏向外势，取地却未必低效。对这手下法要保持灵活，随时按局势调整：有时用来做势，有时用来取地。（第10页）];W[qf]LB[nc:A]C[小飞挂

如果白正在朝自己的地域发展，比如说右边，就可以用这手挂来攻角。（其他挂法很少比这一手更可取。）（第14页。）

A（O17）和脱先都强调实地与先手，因此在现代围棋里很常用。];B[qh]C[一间低夹
这手窄夹不让白沿边拆开。（第1卷。）];W[of]C[一间跳
这手跳只是逃出。此时黑棋必须补强角部，因为它堵住了白棋向上逃出的路。（第1卷）];B[nd]LB[oh:X][qk:Y][pi:A][qj:B][rd:C][qc:D]C[虽然白可以攻击黑的夹击之子，但黑既能跳出到 X（P12），也能拆到 Y（R9），并无即时危险。（第1卷）

白要下 A（Q11），必须有这条征子。
近年来 B（R10）变得流行。
C（S16）希望黑先在 D（R17）应一手，然后再于 B 夹。];W[pi];B[];W[qi])</script></div>
