又名komoku。小目偏重实地。就效率而言，它介于星位与三三之间。当重心在角上时，它的效力发挥到最大。小目常被视为稳健行棋的最佳占角，多年来一直受职业棋手（以及AI）青睐。即便如此，它缺少星位那种取势、并迅速向中腹发展的潜力。（第6页；另见石榑郁郎《In the Beginning》第11页。）];W[]C[布局的最初几步要重视角。尤其下了小目之后，应尽快守角。这样通常能围出大约十目坚实实地。

守角的价值不只是围住的目数。在角上确立坚实根据地，便于从角向两边发展。
