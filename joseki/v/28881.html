又名komoku。小目偏重实地。就效率而言，它介于星位与三三之间。当重心在角上时，它的效力发挥到最大。小目常被视为稳健行棋的最佳占角，多年来一直受职业棋手（以及AI）青睐。即便如此，它缺少星位那种取势、并迅速向中腹发展的潜力。（第6页；另见石榑郁郎《In the Beginning》第11页。）];W[od]C[一间高挂

白棋高挂时，有压住黑棋的感觉，并向中腹形成明显的外势。黑棋必须小心应对。（第6页）];B[ld]C[二间高夹
在现代职业对局中，这类夹出现得不多，因为AI认为结果并不好。从这个角度看，可以说没有充分理由就不要夹。但这种夹也会引出许多不熟悉的变化。若了解这些变化，你也许能占到便宜。（参见《AI Masterclass》；另见《AGA Master Review Series》第35局：［白］Master对江维杰九段［黑］。）];W[pg]LB[qf:A][oc:B][oe:C]C[这一手开启了著名定式——村正之剑。它相对简单，但仍可能引出复杂变化。

A（R14）让黑在右边取得实地，并且先手，通常值得下。

B（P17）让黑取得角上实地。

C（P15）是旧定式，2017年以前几乎是唯一的下法；直到 AlphaGo 揭示了职业棋手认知中的错误。

参见 Michael Redmond, AlphaGo vs. The World: Game 35, AlphaGo Master (W) vs. Jiang Weijie 9p (B)，以及 Game 41, AlphaGo Master (W) vs. Kim Jiseok 9p (B)。];B[oe]LB[ne:A][pd:B][pe:C]C[白接着下A（O15）。

B（Q16）和C（Q15）更差。];W[ne]LB[pd:A][of:B][pe:C]C[A（Q16）看起来别扭，但会给白留下可利用的切断点，是AlphaGo之后的首选。

B（P14）是旧定式，职业棋手从2017年起就不再下了。

C（Q15）缓，不推荐。

参见迈克尔·雷蒙《AlphaGo vs. The World》第35局：AlphaGo Master（白）对江维杰九段（黑）。];B[of];W[pd]LB[qf:A][qe:B][pe:C][qc:D]C[A（R14）大多数时候都会下。
