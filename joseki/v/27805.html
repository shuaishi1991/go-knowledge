<div class="gm-host" data-mode="view" data-at="end" data-numbers="1" data-full="1"><script type="text/plain">(;SZ[19];B[qd]C[小目

又名komoku。小目偏重实地。就效率而言，它介于星位与三三之间。当重心在角上时，它的效力发挥到最大。小目常被视为稳健行棋的最佳占角，多年来一直受职业棋手（以及AI）青睐。即便如此，它缺少星位那种取势、并迅速向中腹发展的潜力。（第6页；另见石榑郁郎《In the Beginning》第11页。）];W[od]C[一间高挂

白棋高挂时，有压住黑棋的感觉，并向中腹形成明显的外势。黑棋必须小心应对。（第6页）];B[oe]C[外靠
这一手沿右边造出厚势。];W[qc]LB[pd:A][pe:B][nd:C]C[A（Q16）和 B（Q15）筑壁。
