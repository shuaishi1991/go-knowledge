<h1>目外 · 白靠小目</h1>
<p class="lead">8 手 · 理想</p>
<p class="seq">黑R15 白Q17 黑P16 白P17 黑O16 白O17 黑虚手 白N16</p>
<div class="gm-host" data-mode="view" data-at="end" data-numbers="1"><script type="text/plain">(;SZ[19];B[qe]C[三五点

又名目外。三五点不是常见的布局着法。它侧重外势和边。由于它常常有利于占据高位，全局作战时更有优势，因此更适合喜欢战斗的棋风。（第9页）

它不对称的姿态会引出早期的续着——黑守角，或白来挂——正如小目上的一子那样。（石仓郁郎——《In the Beginning》，第16页）];W[pc]LB[od:A][nd:B]C[低挂
通常的一手。

A（P16）是预期的后续。黑压，通常仍保先手。
B（O16）是大斜定式的开始。];B[od]LB[oc:A][qd:B][nc:C][pd:D][jd:X]C[压
黑棋不该错过用这手小飞压住白棋的机会。白棋的棋形会全部落在三路上，这并不理想。（第56页）

A（P17）是大多数情况下的选择。
B（R16）是新变化。
C（O17）在这条征子对黑有利时不能下。
D（Q16）很严厉，白棋在 X（K16）一带有子时可以很好。];W[oc];B[nd]LB[mc:A][nc:B][mb:C]C[白的棋完全落在三路上，这并不理想。（第56页。）

A（N17）尽早跳出去，是定式。
B（O17）取得先手。
C（N18）是新手。];W[nc]LB[qc:X]C[影山批评这一手：“必须尽早抓住机会占得先机。”（《Lessons in the Fundamentals of Go》，第70页。）

它比其他选择慢，但更坚实——黑更难瞄着 X（R17）。例如上边很不重要、白又急需先手到右边去时，这一手也有用。];B[];W[md])</script></div>
