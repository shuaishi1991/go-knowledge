<h1>小目 · 白挂目外</h1>
<p class="lead">10 手 · 理想</p>
<p class="seq">黑R16 白P17 黑Q15 白L17 黑N17 白P15 黑P14 白O15 黑M16 白O14</p>
<div class="gm-host" data-mode="view" data-at="end" data-numbers="1"><script type="text/plain">(;SZ[19];B[qd]C[小目

又名komoku。小目偏重实地。就效率而言，它介于星位与三三之间。当重心在角上时，它的效力发挥到最大。小目常被视为稳健行棋的最佳占角，多年来一直受职业棋手（以及AI）青睐。即便如此，它缺少星位那种取势、并迅速向中腹发展的潜力。（第6页；另见石榑郁郎《In the Beginning》第11页。）];W[oc]LB[pe:A][pf:B][pc:C]C[一间低挂

又称小飞挂。这是对小目的基本挂法，把角分给黑白双方。

AlphaGo 之前，人们预期会夹。然而 AI 和当今职业棋手更喜欢在 A（Q15）或 B（Q14）退，或在 C（Q17）踢。];B[pe]LB[lc:A][kc:B]C[秀策的尖
因这一经典布局而闻名，是对白挂角的稳健应对。黑此后可以瞄着夹击或压住那颗孤立的白子。

脱先和 A（M17）是当今职业棋手非常偏爱的下法。
B（L17）是传统下法。];W[kc]LB[ic:X]C[拆三

这是最小、也最常见的阵势之一。（第174页）

最佳打入点是两子之间的三路。例外少到可以忽略。X（J17）有黑子时打入最有效，因为白棋的一子会被夹住。（同上）];B[mc]LB[oe:A][mb:B][md:C]C[黑在这里打入时，白还不够强，不宜走尖，但仍有力量发动某种攻击。在这种中间局面里，一间跳和靠都很典型，而A（P15）两者兼备。白靠着黑棋借力，就能积蓄势头去攻那颗夹击之子。（第177页。）

如果白在上边完全不强，又不想卷入追逃战，可以在B（N18）下靠，这是避让性的纯防守。与其说是想联络，不如说是弃子，以便在外侧整形。（第175页及第177页。）

白也可以先在C（N16）上靠，看起来像相反方向的交换，但这与其说是交换，不如说是纯损。（第178页。）];W[oe];B[of];W[ne];B[ld]LB[pf:A]C[战斗型。白继续下 A（Q14）。];W[nf]LB[og:A][pf:B][pc:C]C[黑可以继续走A（P13）、B（Q14）或C（Q17）。])</script></div>
