<p class="seq">黑Q16 白R17 黑R16 白Q17 黑O17 白P17 黑P16 白O16</p>
<div class="gm-host" data-mode="view" data-at="end" data-numbers="1"><script type="text/plain">(;SZ[19];B[pd]C[星位

又称星（hoshi）。星位让棋手在角上取得根据地，同时也便于发展外势。

星位虽偏向外势，取地却未必低效。对这手下法要保持灵活，随时按局势调整：有时用来做势，有时用来取地。（第10页）];W[qc]C[直接点三三
白可以直接打入角里，并轻易做出活形。这种打入白得到的实地很少，但通常能把角从黑手里夺走。（第14页）

白的后续见局面31231。];B[qd]C[黑通常挡在自己想做棋的那一边。所以这里黑会设法朝棋盘右边发展，希望在那边形成模样。

B（P16）简明地取得外侧，而且是先手。
C（P17）简明地取得角地，但是后手。
