<h1>小目 · 白挂高目</h1>
<p class="lead">12 手 · 理想</p>
<p class="seq">黑R16 白P16 黑N17 白R17 黑Q17 白Q16 黑P17 白O17 黑R18 白S17 黑O16 白O18</p>
<div class="gm-host" data-mode="view" data-at="end" data-numbers="1"><script type="text/plain">(;SZ[19];B[qd]C[3-4 Point

AKA komoku. The 3-4 point favors territory. In this regard, its efficiency is between that of the star and the 3-3 point. Its effectiveness is maximized when the focus is on the corner. Since the 3-4 point is often considered to be the best play for a steady approach to the game, the 3-4 point has been favored by professionals (and AI) over the years. Even so, it lacks the star point's potential for influence and rapid center development. (pp. 6; see also Ishigure Ikuro—In the Beginning, p. 11.)];W[od]C[One-Space High Approach

When White approaches high, it feels like it is pressing down on Black. This creates obvious influence toward the center. Black must take careful notice. (p. 6.)];B[mc]C[One-Space Low Pincer
This pincer was used a lot before AI. In modern pro games, pincers like this don't show up that much because AI says that you don't get a good result. From that standpoint, you might say that you shouldn't pincer without a good reason. But this pincer can also lead to a lot of unfamiliar variations. If you know about them, you may get an advantage. (See [AI Masterclass\](https://www.youtube.com/watch?v=-TQy9F8lnhc&t=75s).)

<A:R17> is the most common move.

[Explanation by Go Inside on Youtube (SDK/Dan)\](https://youtu.be/fawf6DcCQDc?si=z_v0SAivVbSSdxDe)];W[qc]C[White attaches at the 3-3 point most of the time. (See [AI Masterclass\](https://www.youtube.com/watch?v=-TQy9F8lnhc&t=92s).)];B[pc];W[pd];B[oc];W[nc]C[When White wedges like this, Black can atari on either side. (See [AI Masterclass\](https://www.youtube.com/watch?v=-TQy9F8lnhc&t=206s).)];B[qb];W[rc];B[nd];W[nb]C[See <position: 28661>])</script></div>
