A（O17）和脱先都强调实地与先手，因此在现代围棋里很常用。];B[nc]LB[qd:A]C[小飞
取实地的应手。

现代围棋重视速度和角，所以脱先和A（R16）是最流行的选择，而且遥遥领先。];W[]LB[qe:A][qh:B][qi:C][qj:D][pj:E][rd:F]C[脱先是常见选择。

D（R10）和 E（Q10）压力较小，但与右下的关系可能更好。
当白两边都强、难以压迫这颗挂子时，F（S16）是定式。];B[qh];W[qj];B[pf];W[pe];B[qe];W[oe];B[od];W[pg];B[of];W[ne];B[nf];W[qd];B[re];W[me];B[mf];W[le];B[qg]LB[mc:A]C[白在上边继续，于 A（N17）一带下一手。])</script></div>
