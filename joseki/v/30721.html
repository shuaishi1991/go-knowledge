<h1>高目 · 白脱先</h1>
<p class="lead">4 手 · 理想</p>
<p class="seq">黑Q15 白虚手 黑P17 白S15</p>
<div class="gm-host" data-mode="view" data-at="end" data-numbers="1" data-full="1"><script type="text/plain">(;SZ[19];B[pe]LB[pc:A][qc:B][qg:C][oc:D]C[四五点

又名高目。四五点着眼于外势。在这一点上，它和三五点相似。

外势的价值低段棋手很难体会。随着战斗经验增加，这一点会越来越清楚。（第36页）

A（Q17）是传统下法，非常常见。
B（R17）正越来越受青睐。
C（R13）从边上挂入。
D（P17）避开正面冲突。];W[];B[oc]LB[jc:A][qj:B]C[不拘常规的大守角强调边和中腹。

白在角里动手之前，也许想先在A（K17）或B（R10）附近续走。];W[re])</script></div>
