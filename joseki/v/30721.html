AKA takamoku. The 4-5 point aims at influence. In this respect, the 3-5 point is similar. 

The value of influence is hard for low-ranked players to grasp. As you gain experience in fighting, it becomes more apparent. (p. 36.)

<A:Q17> is traditional and very common.<br>
<B:R17> is gaining favor.<br>
<C:R13> approaches from the side.<br>
<D:P17> avoids confrontation.
