<h1>星位 · 白小飞挂</h1>
<p class="lead">21 手 · 理想</p>
<p class="seq">黑Q16 白R14 黑Q10 白O16 黑O15 白N15 黑O14 白N16 黑P16 白N14 黑O13 白S16 黑R13 白Q14 黑S14 白Q13 黑S15 白R12 黑S13 白P12 黑R15</p>
<div class="gm-host" data-mode="view" data-at="end" data-numbers="1"><script type="text/plain">(;SZ[19];B[pd]C[星位

又称星（hoshi）。星位让棋手在角上取得根据地，同时也便于发展外势。

星位虽偏向外势，取地却未必低效。对这手下法要保持灵活，随时按局势调整：有时用来做势，有时用来取地。（第10页）];W[qf]C[小飞挂

如果白正在朝自己的地域发展，比如说右边，就可以用这手挂来攻角。（其他挂法很少比这一手更可取。）（第14页。）

A（O17）和脱先都强调实地与先手，因此在现代围棋里很常用。];B[pj]C[三间高夹
这种大夹有点少见，但如果右下已有局面，比如白棋有弱子，或黑棋有守角，就可以是好棋。（AlphaGo vs. Alphago with Michael Redmond 9p: Game 9）

Go Inside 在 YouTube 上的讲解（SDK/段）];W[nd]C[一间高双挂
