<h1>小目 · 白挂高目</h1>
<p class="lead">17 手 · 理想</p>
<p class="seq">黑R16 白P16 黑M16 白Q13 黑P15 白O15 黑P14 白R17 黑S17 白Q16 黑R15 白Q15 黑Q14 白R14 黑S14 白R13 黑P13</p>
<div class="gm-host" data-mode="view" data-at="end" data-numbers="1"><script type="text/plain">(;SZ[19];B[qd]C[3-4 Point

AKA komoku. The 3-4 point favors territory. In this regard, its efficiency is between that of the star and the 3-3 point. Its effectiveness is maximized when the focus is on the corner. Since the 3-4 point is often considered to be the best play for a steady approach to the game, the 3-4 point has been favored by professionals (and AI) over the years. Even so, it lacks the star point's potential for influence and rapid center development. (pp. 6; see also Ishigure Ikuro—In the Beginning, p. 11.)];W[od]C[One-Space High Approach

When White approaches high, it feels like it is pressing down on Black. This creates obvious influence toward the center. Black must take careful notice. (p. 6.)];B[ld]C[Two-Space High Pincer
In modern pro games, pincers like this don't show up that much because AI says that you don't get a good result. From that standpoint, you might say that you shouldn't pincer without a good reason. But this pincer can also lead to a lot of unfamiliar variations. If you know about them, you may get an advantage. (See [AI Masterclass\](https://www.youtube.com/watch?v=-TQy9F8lnhc&t=75s); see also [AGA Master Review Series, Game 35: [W\] Master vs. Jiang Weijie 9p [B\]\](https://www.youtube.com/watch?v=1vVe1pKmhQ4&t=326).)

[Explanation by Go Pro Yeonwoo on Youtube (SDK/Dan)\](https://youtu.be/w5CyNBt_Uso?si=9uZ39ctwyfeV4Y9w)];W[pg]C[This move starts a famous joseki---the sword of Muramasa. It's relatively simple but can still lead to complications.

<A:R14> gives Black territory on the right side as well as sente and is generally advisable. 

<B:P17> gives Black territory in the corner.

<C:P15> is the old joseki and just about the only move played before 2017, when AlphaGo revealed mistakes in the professionals' knowledge.

See [Michael Redmond, *AlphaGo vs. The World: Game 35, AlphaGo Master (W) vs. Jiang Weijie 9p (B)*\](https://www.youtube.com/watch?v=zjEZDmYqRPg&t=398s) and [*Game 41, AlphaGo Master (W) vs. Kim Jiseok 9p (B)*\](https://www.youtube.com/watch?v=wbh4iG4rH14&t=267s).

[Explanation by Simple Baduk on Youtube (SDK/Dan)\](https://youtu.be/ANglGDKGhaY?si=fZ_t1ZtFCOo_KMhJ)];B[oe]C[White continues with <A:O15>. 

<B:Q16> and <C:Q15> are worse.];W[ne]C[<A:Q16> looks weird but leaves White with exploitable cutting points and is the preferred move post-AlphaGo.

<B:P14> is the old joseki, which professional players stopped playing in 2017.

<C:Q15> is slow and not recommended.

See [Michael Redmond, *AlphaGo vs. The World: Game 35, AlphaGo Master (W) vs. Jiang Weijie 9p (B)*\](https://www.youtube.com/watch?v=zjEZDmYqRPg&t=563s).];B[of];W[qc];B[rc]C[Black is tricked];W[pd]C[Black can't patch all the holes in the shape.];B[qe];W[pe];B[pf];W[qf];B[rf];W[qg];B[og]C[See <position: 28825>])</script></div>
