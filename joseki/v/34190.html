<h1>星位 · 白小飞挂</h1>
<p class="lead">13 手 · 理想</p>
<p class="seq">黑Q16 白R14 黑R12 白R16 黑R17 白Q17 黑R18 白P17 黑P16 白O16 黑P15 白R15 黑O17</p>
<div class="gm-host" data-mode="view" data-at="end" data-numbers="1" data-full="1"><script type="text/plain">(;SZ[19];B[pd]C[星位

又称星（hoshi）。星位让棋手在角上取得根据地，同时也便于发展外势。

星位虽偏向外势，取地却未必低效。对这手下法要保持灵活，随时按局势调整：有时用来做势，有时用来取地。（第10页）];W[qf]LB[nc:A]C[小飞挂

如果白正在朝自己的地域发展，比如说右边，就可以用这手挂来攻角。（其他挂法很少比这一手更可取。）（第14页。）

A（O17）和脱先都强调实地与先手，因此在现代围棋里很常用。];B[qh]C[一间低夹
这手窄夹不让白沿边拆开。（第1卷。）];W[qd]C[夹之后再靠，而不是走小飞，是可以下的，但在顶尖对局中非常少见。];B[qc];W[pc];B[qb];W[oc];B[od];W[nd];B[oe]C[要点。];W[qe];B[nc]C[两块白棋都有危险，对白很糟。])</script></div>
