<h1>星位 · 白小飞挂</h1>
<p class="lead">14 手 · 理想</p>
<p class="seq">黑Q16 白R14 黑虚手 白O16 黑O15 白P15 黑P16 白P14 黑N16 白O17 黑N17 白P17 黑Q17 白N18</p>
<div class="gm-host" data-mode="view" data-at="end" data-numbers="1"><script type="text/plain">(;SZ[19];B[pd]C[星位

又称星（hoshi）。星位让棋手在角上取得根据地，同时也便于发展外势。

星位虽偏向外势，取地却未必低效。对这手下法要保持灵活，随时按局势调整：有时用来做势，有时用来取地。（第10页）];W[qf]C[小飞挂

如果白正在朝自己的地域发展，比如说右边，就可以用这手挂来攻角。（其他挂法很少比这一手更可取。）（第14页。）

A（O17）和脱先都强调实地与先手，因此在现代围棋里很常用。];B[];W[nd]C[A（O15）是通常的下法，变化很多。
B（Q14）旨在让出角部，换取朝向上边的外势。

Ryan Li对这一双挂有详细讲解。];B[ne]C[A（N15）是传统的正常下法。
B（P15）是 AlphaGo 定式，做出朝向右边的势力。];W[oe];B[od];W[of]C[A（N16）可能很复杂。
B（O17）用实地换一面大棋壁。];B[md];W[nc];B[mc]C[A（P18）简单。
B（P17）导向战斗。];W[oc];B[pc];W[mb]C[作战])</script></div>
