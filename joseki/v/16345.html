<h1>星位 · 白小飞挂</h1>
<p class="lead">7 手 · 理想</p>
<p class="seq">黑Q16 白R14 黑O17 白Q10 黑R12 白R10 黑P12</p>
<div class="gm-host" data-mode="view" data-at="end" data-numbers="1" data-full="1"><script type="text/plain">(;SZ[19];B[pd]C[星位

又称星（hoshi）。星位让棋手在角上取得根据地，同时也便于发展外势。

星位虽偏向外势，取地却未必低效。对这手下法要保持灵活，随时按局势调整：有时用来做势，有时用来取地。（第10页）];W[qf]LB[nc:A]C[小飞挂

如果白正在朝自己的地域发展，比如说右边，就可以用这手挂来攻角。（其他挂法很少比这一手更可取。）（第14页。）

A（O17）和脱先都强调实地与先手，因此在现代围棋里很常用。];B[nc]LB[qd:A]C[小飞
取实地的应手。

现代围棋重视速度和角，所以脱先和A（R16）是最流行的选择，而且遥遥领先。];W[pj]C[三间拆
白用这手拆达成快速的配合。白子之间的间隔看起来薄，但并不是严重缺陷。若黑试图分断白棋，白有很多选择。（第39页）];B[qh]LB[ph:A][oh:B][qj:C][qd:D]C[A（Q12）是最自然、也最常正确的应手。（第180页。）
若白想战斗，下B（P12）。
若白有模样，可以下C（R10）。
D（R16）也可以。];W[qj];B[oh]LB[qj:A]C[右下可能成为白棋大模样时，可以考虑在 A（R10）立铁柱。不过这手略嫌缓，黑棋只要简单地跳出，白棋就会有些不满。])</script></div>
