<h1>小目 · 白挂目外</h1>
<p class="lead">10 手 · 理想</p>
<p class="seq">黑R16 白P17 黑M16 白P14 黑R13 白K16 黑N14 白Q15 黑R15 白Q12</p>
<div class="gm-host" data-mode="view" data-at="end" data-numbers="1" data-full="1"><script type="text/plain">(;SZ[19];B[qd]C[小目

又名komoku。小目偏重实地。就效率而言，它介于星位与三三之间。当重心在角上时，它的效力发挥到最大。小目常被视为稳健行棋的最佳占角，多年来一直受职业棋手（以及AI）青睐。即便如此，它缺少星位那种取势、并迅速向中腹发展的潜力。（第6页；另见石榑郁郎《In the Beginning》第11页。）];W[oc]LB[pe:A][pf:B][pc:C]C[一间低挂

又称小飞挂。这是对小目的基本挂法，把角分给黑白双方。

AlphaGo 之前，人们预期会夹。然而 AI 和当今职业棋手更喜欢在 A（Q15）或 B（Q14）退，或在 C（Q17）踢。];B[ld]C[二间高夹

这种夹在实地与外势之间保持平衡，选择很多，弱点很少。];W[of]C[二间跳
这手先手轻轻地钝化了在P16或Q17攻击的效果。];B[qg]C[黑下在这里，是为了防止白把角围起来。

如果白在左上有子，白可以在1附近夹。];W[jd]C[当白占着左上角、能支援这颗夹击子时，这手反夹极好。若左上角是黑占的，就差一些，那时白可能在黑夹的两侧同时遭到攻击。];B[mf]LB[oc:A][of:B]C[这是攻击的要点。一旦有机会，它瞄着切断白棋 A（P17）与 B（P14）之间的空隙。];W[pe]C[这不是理想的一手，但意思明确：你不能从这条缝里穿过去。];B[qe];W[ph]LB[oh:A][pg:B]C[这手小飞压比 A（P12）更严厉，但在 B（Q13）露出断点。])</script></div>
