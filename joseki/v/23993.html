<h1>星位 · 白脱先</h1>
<p class="lead">14 手 · 理想</p>
<p class="seq">黑Q16 白虚手 黑R14 白Q17 黑P17 白R16 黑Q15 白R17 黑P18 白S14 黑S13 白S15 黑R13 白Q18</p>
<div class="gm-host" data-mode="view" data-at="end" data-numbers="1" data-full="1"><script type="text/plain">(;SZ[19];B[pd]C[星位

又称星（hoshi）。星位让棋手在角上取得根据地，同时也便于发展外势。

星位虽偏向外势，取地却未必低效。对这手下法要保持灵活，随时按局势调整：有时用来做势，有时用来取地。（第10页）];W[]C[一般而言，守角优先于边上的拆。];B[qf]LB[pg:A][ob:B][pb:D][nc:C][pc:E][jc:X][qc:F]C[小飞守角

这种守角有时不错，但不如小目守角那样把角守牢。白有好几手可以从角上咬下一大块。（第15页。）

虽然A已经非常流行，最常见的后续仍是在X落子，不让黑往上边拆。

A（Q13）自AlphaGo以来变得流行。
B（P18）和D（Q18）是传统下法，意在让角部和上边形成见合。
C（O17）直接来挂，必须准备作战。
黑在X（K17）一带有棋时，有时会下E（Q17）。
F（R17）意在角上小活，通常会涉及劫。];W[pc]LB[oc:A][qc:B]C[小飞守角的打入

这种打入并不简单。虽然在这里靠可能有效，黑也能顽强抵抗，所以白必须小心，不要把棋走重。

A（P17）严厉。
B（R17）让白可以在A位退，轻易取得轻灵、有弹性的姿态。];B[oc]LB[ob:A][qd:B][od:C]C[黑在上边强的时候，A（P18）是很好的打入方法。
B（R16）或者在角上小活，或者切断 R14 一子。
C（P16）主要用于制造一个大劫材。此外，也可在模样里腾挪，或作为引征。];W[qd];B[pe]LB[qb:A][ob:B][qc:C]C[A（R18）在角上做活。
B（P18）试图在做活之前先造味道。
C（R17）是AI的构思，职业对局中还不多见。];W[qc];B[ob];W[rf];B[rg];W[re];B[qg]C[AI建议的下法];W[pb]C[AI建议的走法])</script></div>
