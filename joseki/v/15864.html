<h1>星位 · 白小飞挂</h1>
<p class="lead">14 手 · 理想</p>
<p class="seq">黑Q16 白R14 黑O17 白S16 黑R13 白S13 黑S14 白Q13 黑R12 白S12 黑R15 白Q14 黑S15 白R11</p>
<div class="gm-host" data-mode="view" data-at="end" data-numbers="1" data-full="1"><script type="text/plain">(;SZ[19];B[pd]C[星位

又称星（hoshi）。星位让棋手在角上取得根据地，同时也便于发展外势。

星位虽偏向外势，取地却未必低效。对这手下法要保持灵活，随时按局势调整：有时用来做势，有时用来取地。（第10页）];W[qf]LB[nc:A]C[小飞挂

如果白正在朝自己的地域发展，比如说右边，就可以用这手挂来攻角。（其他挂法很少比这一手更可取。）（第14页。）

A（O17）和脱先都强调实地与先手，因此在现代围棋里很常用。];B[nc]LB[qd:A]C[小飞
取实地的应手。

现代围棋重视速度和角，所以脱先和A（R16）是最流行的选择，而且遥遥领先。];W[rd]C[滑
这手流传已久，但已不再是最常见的下法。一些职业棋手（例如2019年的Yeonwoo Cho、2020年的Michael Redmond）指出，一旦下出这手，AI胜率就会下降，并称之为稍劣。的确，这手滑对黑影响不大，黑不必在局部应。不过现代AI也并非完全回避它。事实上，腾讯绝艺等现代AI有时会把它当作首选。当抢先并不那么重要时，可以推荐这手；对两位数级位的棋手也合适，因为简单。否则更宜靠，如局面16045。];B[qg];W[rg];B[rf];W[pg];B[qh];W[rh];B[qe];W[pf];B[re];W[qi]C[定式])</script></div>
