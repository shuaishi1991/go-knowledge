<h1>高目 · 白点三三</h1>
<p class="lead">4 手 · 理想</p>
<p class="seq">黑Q15 白R17 黑Q17 白Q18</p>
<div class="gm-host" data-mode="view" data-at="end" data-numbers="1"><script type="text/plain">(;SZ[19];B[pe]LB[pc:A][qc:B][qg:C][oc:D]C[四五点

又名高目。四五点着眼于外势。在这一点上，它和三五点相似。

外势的价值低段棋手很难体会。随着战斗经验增加，这一点会越来越清楚。（第36页）

A（Q17）是传统下法，非常常见。
B（R17）正越来越受青睐。
C（R13）从边上挂入。
D（P17）避开正面冲突。];W[qc]C[三三侵入
走这里可以避开复杂变化。];B[pc]LB[oc:A][pb:B][pd:C]C[不论黑是否有有利的征子（30738），A（P17）都好。
