又称星（hoshi）。星位让棋手在角上取得根据地，同时也便于发展外势。

A（O17）和脱先都强调实地与先手，因此在现代围棋里很常用。];B[nc]LB[qd:A]C[小飞
取实地的应手。

现代围棋重视速度和角，所以脱先和A（R16）是最流行的选择，而且遥遥领先。];W[rd]C[滑
这手流传已久，但已不再是最常见的下法。一些职业棋手（例如2019年的Yeonwoo Cho、2020年的Michael Redmond）指出，一旦下出这手，AI胜率就会下降，并称之为稍劣。的确，这手滑对黑影响不大，黑不必在局部应。不过现代AI也并非完全回避它。事实上，腾讯绝艺等现代AI有时会把它当作首选。当抢先并不那么重要时，可以推荐这手；对两位数级位的棋手也合适，因为简单。否则更宜靠，如局面16045。];B[qh]C[黑用夹来以角换取外势。];W[qc]LB[qe:A][pf:B]C[只有这条征子有利时，才应下A（R15）。

B（S14）也可以。
