<h1>星位 · 白点三三</h1>
<p class="lead">8 手 · 理想</p>
<p class="seq">黑Q16 白R17 黑R16 白Q17 黑P16 白P17 黑N17 白虚手</p>
<div class="gm-host" data-mode="view" data-at="end" data-numbers="1"><script type="text/plain">(;SZ[19];B[pd]C[4-4 Point

AKA star point; hoshi. The 4-4 point allows a player to establish a foothold in a corner while also enabling development of influence. 

Although the 4-4 point favors influence, it is not necessarily inefficient at securing territory. Players should be flexible with this move, ready to adjust their strategy to changing circumstances, at times using it to build influence, at other times going for territory. (p. 10.)];W[qc]C[Direct 3-3 Invasion
White can invade the corner directly, and easily make a living shape. This invasion produces little territory for White. But it does usually take the corner away from Black. (p. 14.)

For White continuations, see <Position:31231>.

[Explanation by Go Magic on Youtube (DDK/SDK)\](https://youtu.be/i4PJpJ_hsaU?si=H-m456c3eSn5SvnB)

[Explanation by Michael Redmond on Youtube (DDK/SDK)\](https://youtu.be/2khNnE5Q3GM?si=5x52Q888JR2UMIWR)

[Explanation by Go Pro Yeonwoo on Youtube (SDK/Dan)\](https://youtu.be/1qpSyOpK-xw?si=uXLYOu0NudfvEegS)];B[qd]C[Black usually covers on the side that Black wants to build. So in this case, Black would try to build in the direction of the right side of the board, hoping for a moyo (territorial framework) on that side.

See [The Direct 3-3 Invasion Keep it Simple!\](https://www.youtube.com/watch?v=2khNnE5Q3GM&t=147)];W[pc]C[<A:O17> can lead to the ["flying knife joseki"\](21117), which is the most complicated joseki currently played. However, Black does have opportunities to simplify and still get an even result. This also can be seen as an improvement to the modern joseki of the hane at <C:P17>, that is [this result\](22739)*.<br>
<B:P16> takes the outside simply and in sente.<br>
<C:P17> takes the corner simply but in gote.

*[The Direct 3-3 Invasion Keep it Simple!\](https://youtu.be/2khNnE5Q3GM?t=1157)];B[od]C[Simple Extension

This move is the simplest of Black's choices. Black tries to build in the direction of the right side. 

See [The Direct 3-3 Invasion Keep it Simple!\](https://www.youtube.com/watch?v=2khNnE5Q3GM&t=200)

<A:O18> is simple, common, and natural.<br>
<B:O17> works best if [this ladder\](22211) is good.<br>
<C:P17> is often inferior to A.];W[oc]C[<A:O17> reverts to the normal joseki.<br>
