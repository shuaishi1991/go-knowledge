<h1>小目 · 白挂目外</h1>
<p class="lead">11 手 · 理想</p>
<p class="seq">黑R16 白P17 黑N16 白N17 黑M17 白M16 黑N15 白L17 黑M18 白N18 黑L18</p>
<div class="gm-host" data-mode="view" data-at="end" data-numbers="1" data-full="1"><script type="text/plain">(;SZ[19];B[qd]C[小目

又名komoku。小目偏重实地。就效率而言，它介于星位与三三之间。当重心在角上时，它的效力发挥到最大。小目常被视为稳健行棋的最佳占角，多年来一直受职业棋手（以及AI）青睐。即便如此，它缺少星位那种取势、并迅速向中腹发展的潜力。（第6页；另见石榑郁郎《In the Beginning》第11页。）];W[oc]LB[pe:A][pf:B][pc:C]C[一间低挂

又称小飞挂。这是对小目的基本挂法，把角分给黑白双方。

AlphaGo 之前，人们预期会夹。然而 AI 和当今职业棋手更喜欢在 A（Q15）或 B（Q14）退，或在 C（Q17）踢。];B[md]C[一间高夹

这手夹严厉，意在外侧做厚。];W[mc]C[这是AlphaGo出现之前最流行的应手，连AlphaGo也喜欢。

参见迈克尔·雷蒙《AlphaGo对世界：第12局，AlphaGo Master（白）对王昊洋六段（黑）》。];B[lc];W[ld]LB[nc:A][kc:B][me:C]C[A（O17）是流行的定式，但黑需要对付白断子的征子有利。

B（L17）是另一流行定式，同样涉及白断子引出的征子。

C（N15）也可以下。

参见Michael Redmond，《AlphaGo vs. The World》第12局，AlphaGo Master（白）对Wang Haoyang 6p（黑）。];B[me];W[kc];B[lb];W[mb];B[kb])</script></div>
