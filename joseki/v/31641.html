<h1>目外 · 白靠小目</h1>
<p class="lead">6 手 · 理想</p>
<p class="seq">黑R15 白Q17 黑N17 白O16 黑N16 白R16</p>
<div class="gm-host" data-mode="view" data-at="end" data-numbers="1" data-full="1"><script type="text/plain">(;SZ[19];B[qe]C[三五点

又名目外。三五点不是常见的布局着法。它侧重外势和边。由于它常常有利于占据高位，全局作战时更有优势，因此更适合喜欢战斗的棋风。（第9页）

它不对称的姿态会引出早期的续着——黑守角，或白来挂——正如小目上的一子那样。（石仓郁郎——《In the Beginning》，第16页）];W[pc]LB[od:A][nd:B]C[低挂
通常的一手。

A（P16）是预期的后续。黑压，通常仍保先手。
B（O16）是大斜定式的开始。];B[mc]C[双挂

也称二间低夹。若左上角已有根据，这一手可以很好地控制上边。

参见迈克尔·雷蒙《AlphaGo对世界：第39局，井山裕太九段（白）对AlphaGo Master（黑）》，以及《第54局，聂卫平九段（白）对AlphaGo Master（黑）》。];W[nd];B[md];W[qd])</script></div>
