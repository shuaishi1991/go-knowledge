<h1>星位 · 白小飞挂</h1>
<p class="lead">13 手 · 理想</p>
<p class="seq">黑Q16 白R14 黑Q10 白R17 黑R16 白Q17 黑P16 白S16 黑S15 白S17 黑R15 白O17 黑Q14</p>
<div class="gm-host" data-mode="view" data-at="end" data-numbers="1" data-full="1"><script type="text/plain">(;SZ[19];B[pd]C[星位

又称星（hoshi）。星位让棋手在角上取得根据地，同时也便于发展外势。

星位虽偏向外势，取地却未必低效。对这手下法要保持灵活，随时按局势调整：有时用来做势，有时用来取地。（第10页）];W[qf]LB[nc:A]C[小飞挂

如果白正在朝自己的地域发展，比如说右边，就可以用这手挂来攻角。（其他挂法很少比这一手更可取。）（第14页。）

A（O17）和脱先都强调实地与先手，因此在现代围棋里很常用。];B[pj]C[三间高夹
这种大夹有点少见，但如果右下已有局面，比如白棋有弱子，或黑棋有守角，就可以是好棋。（AlphaGo vs. Alphago with Michael Redmond 9p: Game 9）];W[qc];B[qd]C[白棋若在角上跳入，黑棋可以这样挡，筑起面向夹击之子的棋壁。此后的进行与其他更紧的夹类似，接着是三三侵入。];W[pc];B[od];W[rd];B[re];W[rc];B[qe]C[旧下法。];W[nc]C[黑棋得到一面朝向夹击之子的棋壁。黑棋可以脱先，或走 Q14 消掉白子的味道。];B[pf]C[防止白利用这颗子的味道。])</script></div>
