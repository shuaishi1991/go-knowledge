<h1>小目 · 白挂目外</h1>
<p class="lead">7 手 · 理想</p>
<p class="seq">黑R16 白P17 黑L17 白R17 黑S17 白Q16 黑R15</p>
<div class="gm-host" data-mode="view" data-at="end" data-numbers="1"><script type="text/plain">(;SZ[19];B[qd]C[小目

又名komoku。小目偏重实地。就效率而言，它介于星位与三三之间。当重心在角上时，它的效力发挥到最大。小目常被视为稳健行棋的最佳占角，多年来一直受职业棋手（以及AI）青睐。即便如此，它缺少星位那种取势、并迅速向中腹发展的潜力。（第6页；另见石榑郁郎《In the Beginning》第11页。）];W[oc]C[一间低挂

又称小飞挂。这是对小目的基本挂法，把角分给黑白双方。

AlphaGo 之前，人们预期会夹。然而 AI 和当今职业棋手更喜欢在 A（Q15）或 B（Q14）退，或在 C（Q17）踢。];B[kc]C[三间低夹

这种夹比二间夹更为从容。它是仍算夹的最远一手，也可以看作从左上已有棋形向外的拆。

Go Inside 在 YouTube 上的讲解（SDK/段）];W[qc]C[这已经不太是可行的选择。它想做强棋形，准备攻击 A（L17），但做出的棋形并不强，之后攻击 A（L17）也不划算。白有更好的选择。];B[rc];W[pd];B[qe]C[见局面26282])</script></div>
