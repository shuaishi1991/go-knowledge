<h1>小目 · 白挂目外</h1>
<p class="lead">31 手 · 理想</p>
<p class="seq">黑R16 白P17 黑M17 白Q15 黑Q16 白P16 黑P15 白Q14 黑O15 白Q18 黑O16 白S15 黑R18 白S16 黑S17 白N18 黑O17 白O18 黑M18 白R15 黑R17 白Q19 黑R19 白S19 黑T18 白T16 黑N19 白T17 黑P19 白O19 黑M19</p>
<div class="gm-host" data-mode="view" data-at="end" data-numbers="1"><script type="text/plain">(;SZ[19];B[qd]C[3-4 Point

AKA komoku. The 3-4 point favors territory. In this regard, its efficiency is between that of the star and the 3-3 point. Its effectiveness is maximized when the focus is on the corner. Since the 3-4 point is often considered to be the best play for a steady approach to the game, the 3-4 point has been favored by professionals (and AI) over the years. Even so, it lacks the star point's potential for influence and rapid center development. (pp. 6; see also Ishigure Ikuro—In the Beginning, p. 11.)];W[oc]C[One-Space Low Approach

AKA small knight approach. This is the basic approach move to the 3-4 point and divides the corner between Black and White.

Prior to AlphaGo, a pincer would be expected. However, AI and current professionals prefer 'backing off' with <A:Q15> or <B:Q14> or kicking at <C:Q17>.];B[lc]C[Two-Space Low Pincer
Popular in the 17th century, this pincer is still played in contemporary games. Contrary to its former "leisurely" reputation (according to Hideo Otake and others), this move can spark fighting after White <A:Q15> (see <Position:26800>). AI analysis scores the fight as relatively equal, diverging from traditional expectations. If White opts out of the fight, the game might continue with simple moves.

See [Michael Redmond, *AlphaGo vs. The World: Game 34, Dang Yifei 9p (W) vs. AlphaGo Master (B)*\](https://www.youtube.com/watch?v=jL7D9U6d7W4&t=80s).

[Explanation by Go Inside on Youtube (SDK/Dan)\](https://youtu.be/qlYiRBuwzKE?si=gW8cV9B2aLuLsFSt)];W[pe];B[pd];W[od];B[oe];W[pf];B[ne];W[pb];B[nd];W[re];B[qb];W[rd];B[rc];W[mb];B[nc];W[nb];B[lb]C[From this position, white has two options: either the corner will result in a seki (e.g with 1, though there are many similar lines), or white can sacrifice a few stones to take it in gote with 2.];W[qe];B[qc];W[pa];B[qa];W[ra];B[sb];W[sd];B[ma];W[sc];B[oa];W[na];B[la]C[From here white can tenuki or play a move around R11 to support the wall.])</script></div>
