<p class="lead">31 手 · 理想</p>
<p class="seq">黑R16 白P17 黑M17 白Q15 黑Q16 白P16 黑P15 白Q14 黑O15 白Q18 黑O16 白S15 黑R18 白S16 黑S17 白N18 黑O17 白O18 黑M18 白R15 黑R17 白Q19 黑R19 白S19 黑T18 白T16 黑N19 白T17 黑P19 白O19 黑M19</p>
<div class="gm-host" data-mode="view" data-at="end" data-numbers="1"><script type="text/plain">(;SZ[19];B[qd]C[小目

又名komoku。小目偏重实地。就效率而言，它介于星位与三三之间。当重心在角上时，它的效力发挥到最大。小目常被视为稳健行棋的最佳占角，多年来一直受职业棋手（以及AI）青睐。即便如此，它缺少星位那种取势、并迅速向中腹发展的潜力。（第6页；另见石榑郁郎《In the Beginning》第11页。）];W[oc]LB[pe:A][pf:B][pc:C]C[一间低挂

又称小飞挂。这是对小目的基本挂法，把角分给黑白双方。

AlphaGo 之前，人们预期会夹。然而 AI 和当今职业棋手更喜欢在 A（Q15）或 B（Q14）退，或在 C（Q17）踢。];B[lc]LB[pe:A]C[二间低夹
这种夹在17世纪很流行，当代对局中仍在使用。与它从前“悠闲”的名声相反（据大竹英雄等人所说），白棋走了 A（Q15）之后，这手棋可能引发战斗（见局面26800）。AI 分析认为这块战斗大致两分，与传统预期不同。白棋若避开战斗，棋局也可以用简明的下法继续。

见 Michael Redmond, AlphaGo vs. The World: Game 34, Dang Yifei 9p (W) vs. AlphaGo Master (B)。];W[pe];B[pd];W[od];B[oe];W[pf];B[ne];W[pb];B[nd];W[re];B[qb];W[rd];B[rc];W[mb];B[nc];W[nb];B[lb]C[从这个局面出发，白有两种选择：要么角上成为双活（例如按1走，不过类似变化很多），要么白可以牺牲几子，用2后手取角。];W[qe];B[qc];W[pa];B[qa];W[ra];B[sb];W[sd];B[ma];W[sc];B[oa];W[na];B[la]C[此后白可以脱先，或在 R11 一带下一手，支撑这道壁。])</script></div>
