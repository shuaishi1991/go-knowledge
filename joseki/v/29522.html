<p class="lead">18 手 · 理想</p>
<p class="seq">黑R16 白D16 黑Q3 白D4 黑P17 白Q5 黑R5 白R6 黑R4 白Q6 黑O3 白R15 黑Q15 白R14 黑S16 白Q14 黑P15 白Q10</p>
<div class="gm-host" data-mode="view" data-at="end" data-numbers="1"><script type="text/plain">(;SZ[19];B[qd]C[小目

又名komoku。小目偏重实地。就效率而言，它介于星位与三三之间。当重心在角上时，它的效力发挥到最大。小目常被视为稳健行棋的最佳占角，多年来一直受职业棋手（以及AI）青睐。即便如此，它缺少星位那种取势、并迅速向中腹发展的潜力。（第6页；另见石榑郁郎《In the Beginning》第11页。）];W[dd];B[pq];W[dp];B[oc]C[守角布局];W[po];B[qo];W[qn];B[qp];W[pn];B[nq];W[qe]C[涉及此局面的职业对局（2018年以来的对局中很流行；截至2019年11月，Waltheri尚未收录更新的棋谱）];B[pe];W[qf];B[rd];W[pf];B[oe];W[pj])</script></div>
