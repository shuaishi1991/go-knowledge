<h1>星位 · 白小飞挂</h1>
<p class="lead">15 手 · 理想</p>
<p class="seq">黑Q16 白R14 黑Q11 白R17 黑Q17 白R16 黑Q15 白R15 黑Q14 白Q13 黑P13 白P12 黑Q12 白R13 黑O13</p>
<div class="gm-host" data-mode="view" data-at="end" data-numbers="1"><script type="text/plain">(;SZ[19];B[pd]C[星位

又称星（hoshi）。星位让棋手在角上取得根据地，同时也便于发展外势。

星位虽偏向外势，取地却未必低效。对这手下法要保持灵活，随时按局势调整：有时用来做势，有时用来取地。（第10页）];W[qf]C[小飞挂

如果白正在朝自己的地域发展，比如说右边，就可以用这手挂来攻角。（其他挂法很少比这一手更可取。）（第14页。）

A（O17）和脱先都强调实地与先手，因此在现代围棋里很常用。];B[pi]C[二间高夹

若与 A（Q4）一带的黑子配合，这手夹会很好；否则 B（R12）的低夹对白限制更有效率。];W[qc];B[pc]C[如果黑在 A（K16）一带有子，挡这一边可以是好棋。];W[qd];B[pe];W[qe];B[pf];W[pg];B[og];W[oh];B[ph];W[qg];B[ng]C[黑棋得到模样，仍然假设 K16 一带有子（X（K16））。])</script></div>
