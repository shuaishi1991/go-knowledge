<h1>小目 · 白脱先</h1>
<p class="lead">12 手 · 理想</p>
<p class="seq">黑R16 白虚手 黑O17 白Q16 黑Q15 白R17 黑P16 白Q17 黑R15 白O18 黑P18 白P17</p>
<div class="gm-host" data-mode="view" data-at="end" data-numbers="1"><script type="text/plain">(;SZ[19];B[qd]C[3-4 Point

AKA komoku. The 3-4 point favors territory. In this regard, its efficiency is between that of the star and the 3-3 point. Its effectiveness is maximized when the focus is on the corner. Since the 3-4 point is often considered to be the best play for a steady approach to the game, the 3-4 point has been favored by professionals (and AI) over the years. Even so, it lacks the star point's potential for influence and rapid center development. (pp. 6; see also Ishigure Ikuro—In the Beginning, p. 11.)];W[]C[The first steps in the opening emphasize the corners. When you play a 3-4 stone, in particular, you should waste no time enclosing the corner. This will usually build about ten points of secure territory.

The value of an enclosure isn't just the points of territory it surrounds. Securing a solid base in the corner makes it easy to develop along either side from the corner.

A corner enclosure generally takes priority over a side extension.];B[nc]C[Large Knight Enclosure
This enclosure is similar to the small knight enclosure except that it defends the corner much more loosely. (p. 56.) You can invade this enclosure without being captured, but if you just live the result is unfavorable. (Masaki Takemiya, Enclosure Josekis, p. 39.)

<A:Q16> is a popular new joseki. It involves these ladders - [1\](30043), [2\](30103).<br>
<B:O16> is another new move. It involves [this ladder.\](29926)<br>
<C:P16> an erasure (reduction) move.<br>
<D:Q17>, <E:P17>, or <F:R17> can take the corner away from Black.<br>
<G:P15> is [another erasure move\](https://www.youtube.com/watch?v=sS2az_zzUTA&t=217s) as is <H:O15>.<br>];W[pd]C[Contact Play
Although this move looks odd at first to traditional players, this move has become popular. 

<A:Q17> defends the corner.<br>
<B:Q15> plays outside.<br>
<C:R15> takes a small local loss but is tricky for White to handle locally.<br>
<D:R17> is submissive.

[Explanation by Baduk Doctor on Youtube (SDK/Dan)\](https://youtu.be/6A_ekFfcalc?si=2df15vqKo7d1Ej14)
