<h1>高目 · 白靠小目</h1>
<p class="lead">8 手 · 其他</p>
<p class="seq">黑Q15 白Q17 黑O16 白R15 黑R16 白Q16 黑S16 白R14</p>
<div class="gm-host" data-mode="view" data-at="end" data-numbers="1" data-full="1"><script type="text/plain">(;SZ[19];B[pe]LB[pc:A][qc:B][qg:C][oc:D]C[四五点

又名高目。四五点着眼于外势。在这一点上，它和三五点相似。

外势的价值低段棋手很难体会。随着战斗经验增加，这一点会越来越清楚。（第36页）

A（Q17）是传统下法，非常常见。
B（R17）正越来越受青睐。
C（R13）从边上挂入。
D（P17）避开正面冲突。];W[pc]C[挂

这手可能引出复杂变化。];B[nd]LB[qe:A][nc:B]C[小飞
这手棋施加压力，是高目之后的传统后续。白棋的角上之子此刻显得孤单；白棋若在那里应，黑棋会自然地筑起外势。

脱先是最常见的选择，能让白棋避开复杂变化。
A（R15）用角地换给黑棋外势，但黑棋若抵抗，就会变得棘手。
B（O17）变化复杂，在这条征子对黑不利时最为有效。];W[qe]LB[qf:A][pd:B][qd:C]C[A（R14）和 B（Q16）很常见，通常很快就能安定。
