<h1>星位 · 白小飞挂</h1>
<p class="lead">7 手 · 其他</p>
<p class="seq">黑Q16 白R14 黑O16 白P15 黑P16 白S16 黑O13</p>
<div class="gm-host" data-mode="view" data-at="end" data-numbers="1"><script type="text/plain">(;SZ[19];B[pd]C[4-4 Point

AKA star point; hoshi. The 4-4 point allows a player to establish a foothold in a corner while also enabling development of influence. 

Although the 4-4 point favors influence, it is not necessarily inefficient at securing territory. Players should be flexible with this move, ready to adjust their strategy to changing circumstances, at times using it to build influence, at other times going for territory. (p. 10.)];W[qf]C[Knight's Approach

If White is building towards an area of her own on, say, the right side, then White can attack the corner with this approach. (Other approaches are seldom preferable to this one.) (p. 14.)

<A:O17> and Tenuki emphasize territory and sente. This makes them popular choices in modern Go.];B[nd]C[One-Space Jump
An ordinary strategy that favors influence. It's difficult for Black to get territory after playing here.];W[oe]C[Peep
This peep is an AI favorite, though human players had played it before. It reinforces Black but creates potential for White. If Black does not connect, White will cut. 

<A:P16>, linking the black stones firmly together, is generally correct. See Toshiro Kageyama, *Lessons in the Fundamentals of Go*, p. 43.<br>
<B:R15> is possible if [this ladder\](17547) is unfavorable for White.<br>
<C:O15> is also possible.

See also [Michael Redmond, *AlphaGo vs. The World: Game 47, Tan Xiao 7p (W) vs. AlphaGo Master (B)*\](https://www.youtube.com/watch?v=Lf0We2j5h8M&t=195s) and [*Game 57, Shin Jinseo 6p (W) vs. AlphaGo Master (B)*\](https://www.youtube.com/watch?v=PSfZEbgvT1c&t=123s).

[Explanation by Go Pro Yeonwoo on Youtube (SDK/Dan)\](https://youtu.be/MyZQX1OAB90?si=waRtUkZU3kDz9F7j&t=66)];B[od]C["Even a moron connects against a peep."];W[rd]C[Joseki];B[ng])</script></div>
