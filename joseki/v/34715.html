<h1>星位 · 白小飞挂</h1>
<p class="lead">22 手 · 理想</p>
<p class="seq">黑Q16 白R14 黑O17 白R16 黑R17 白S17 黑S16 白R15 黑S18 白Q17 黑R18 白P16 黑Q15 白O13 黑P14 白P13 黑Q14 白Q13 黑O14 白N14 黑P17 白R11</p>
<div class="gm-host" data-mode="view" data-at="end" data-numbers="1" data-full="1"><script type="text/plain">(;SZ[19];B[pd]C[星位

又称星（hoshi）。星位让棋手在角上取得根据地，同时也便于发展外势。

星位虽偏向外势，取地却未必低效。对这手下法要保持灵活，随时按局势调整：有时用来做势，有时用来取地。（第10页）];W[qf]LB[nc:A]C[小飞挂

如果白正在朝自己的地域发展，比如说右边，就可以用这手挂来攻角。（其他挂法很少比这一手更可取。）（第14页。）

A（O17）和脱先都强调实地与先手，因此在现代围棋里很常用。];B[nc]LB[qd:A]C[小飞
取实地的应手。

现代围棋重视速度和角，所以脱先和A（R16）是最流行的选择，而且遥遥领先。];W[qd]LB[rd:X]C[靠
这是最常见、最流行的一手。多亏了 AI，几乎所有职业棋手都下过。它类似于在 X（S16）的爬。但与 X 不同，靠必须应一手。参见 AI推荐的定式。];B[qc];W[rc]LB[qe:A][pb:B][rb:C][qb:D][pc:E][rd:F]C[A（R15）最常见，取外势。
B（Q18）给白两个选择，并鼓励取地的那一种。
C（S18）偏实地。
D（R18）给白两个选择，并鼓励朝外的那一种。
E（Q17）简明。
F（S16）是级位棋手的常见错误，但在收官战斗中可以作为一种选择。];B[rd]C[许多低级位棋手觉得这里必须下，因为能吃到一子。但这是常见错误。这一颗子并不值钱，其实是废子。参见 AI推荐的定式。];W[qe];B[rb];W[pc];B[qb];W[od]C[这个局面也类似于 position: 16125，区别在于那里当白下 B 时，有 Q17 的子要比有 Q15 更好。];B[pe];W[ng];B[of];W[og];B[pf];W[pg];B[nf];W[mf];B[oc];W[qi]C[即便黑能在1位逃出，白仍然更好。])</script></div>
