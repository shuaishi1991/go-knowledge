<h1>星位 · 白脱先</h1>
<p class="lead">11 手 · 理想</p>
<p class="seq">黑Q16 白虚手 黑R14 白虚手 黑P17 白R17 黑S15 白P18 黑Q18 白O18 黑Q17</p>
<div class="gm-host" data-mode="view" data-at="end" data-numbers="1"><script type="text/plain">(;SZ[19];B[pd]C[星位

又称星（hoshi）。星位让棋手在角上取得根据地，同时也便于发展外势。

星位虽偏向外势，取地却未必低效。对这手下法要保持灵活，随时按局势调整：有时用来做势，有时用来取地。（第10页）];W[]C[一般而言，守角优先于边上的拆。];B[qf]C[小飞守角

这种守角有时不错，但不如小目守角那样把角守牢。白有好几手可以从角上咬下一大块。（第15页。）

虽然A已经非常流行，最常见的后续仍是在X落子，不让黑往上边拆。

A（Q13）自AlphaGo以来变得流行。
B（P18）和D（Q18）是传统下法，意在让角部和上边形成见合。
C（O17）直接来挂，必须准备作战。
黑在X（K17）一带有棋时，有时会下E（Q17）。
F（R17）意在角上小活，通常会涉及劫。];W[];B[oc]C[小飞守角

这手“四等”着从星位把角完全围住。（第16页。）额外的两手中只要漏掉一手，白就能成功打入角部。（第3页；另见《打入小飞守角》0:32处。）

A（Q13）是标准的消法。
B（R17）可以是试应手，也可以借附近的味道真做活。];W[qc]C[打入

白在 X（N17）或 Y（R11）一带已经有子时，这一手更容易。没有后援，这种打入收益很小。参见《打入小城堡》0分47秒。];B[re]C[这手潇洒的棋，除非白在上边有援军，否则能杀死白。参见《打入小城堡》5分35秒。

A（P18）试图利用味道做活。
B（N18）是 AI 的下法，以放弃角部来换取上边的一些力量。];W[ob]C[A（O18）是本手，能杀死白，但在上边留下味道。
B（Q18）杀白更稳，但如果A成立，就会亏目。];B[pb];W[nb];B[pc]C[白死
如果白在上边已经有子，这一手尤其好用。参见《打入小城堡》6分29秒。])</script></div>
