<p class="lead">13 手 · 理想</p>

又称星（hoshi）。星位让棋手在角上取得根据地，同时也便于发展外势。

星位虽偏向外势，取地却未必低效。对这手下法要保持灵活，随时按局势调整：有时用来做势，有时用来取地。（第10页）];W[qf]LB[nc:A]C[小飞挂

如果白正在朝自己的地域发展，比如说右边，就可以用这手挂来攻角。（其他挂法很少比这一手更可取。）（第14页。）

A（O17）和脱先都强调实地与先手，因此在现代围棋里很常用。];B[qh]C[一间低夹
这手窄夹不让白沿边拆开。（第1卷。）];W[qc]LB[qd:A][pc:B]C[点三三
白潜入角部，从而脱出严厉的攻击。若黑先占了小目，就不存在这种可能。（第62页。）
A（R16）是最常见的后续，现代职业对局中尤其如此。
B（Q17）历史上常见，但在现代职业对局中已很少见。当黑在上边已有子、使这一带的势力比边上的势力更有价值时，才会下这手。];B[pc]LB[jd:X][qd:A]C[当上边的势力比边上的势力更有价值时，例如黑已有 X（K16），这手才是定式。否则就是失误，黑应改在 A（R16）分投。
