<h1>三三 · 白一间跳</h1>
<p class="lead">4 手 · 理想</p>
<p class="seq">黑R17 白Q14 黑O16 白R10</p>
<div class="gm-host" data-mode="view" data-at="end" data-numbers="1"><script type="text/plain">(;SZ[19];B[qc]C[三三

又称 san-san。一着三三就能完全占住角，不过位置偏低，机动性较差。重视实地、并准备打持久战的棋手最常使用，白棋也经常走这里。（第7页）

不像小目那样急着守角或挂角。双方都可以先观望，等别处的进程使挂或守变得合适时再动手。（石榑郁郎——《In the Beginning》，第12–13页。）];W[pf]C[二间高挂];B[nd];W[qj]C[定式])</script></div>
