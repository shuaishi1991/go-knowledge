<h1>星位 · 白小飞挂</h1>
<p class="lead">6 手 · 好棋</p>
<p class="seq">黑Q16 白R14 黑O16 白S16 黑R17 白Q10</p>
<div class="gm-host" data-mode="view" data-at="end" data-numbers="1" data-full="1"><script type="text/plain">(;SZ[19];B[pd]C[星位

又称星（hoshi）。星位让棋手在角上取得根据地，同时也便于发展外势。

星位虽偏向外势，取地却未必低效。对这手下法要保持灵活，随时按局势调整：有时用来做势，有时用来取地。（第10页）];W[qf]LB[nc:A]C[小飞挂

如果白正在朝自己的地域发展，比如说右边，就可以用这手挂来攻角。（其他挂法很少比这一手更可取。）（第14页。）

A（O17）和脱先都强调实地与先手，因此在现代围棋里很常用。];B[nd]C[一间跳
偏向外势的普通策略。黑下在这里之后很难取得实地。];W[rd]C[滑];B[qc]C[这一手把角上的棋形定住，黑很容易在那里取得实地。];W[pj]LB[rd:A][qh:B]C[有些业余棋手可能会走这手。在这里拆既不快也不坚实。走 A（S16）来消黑角可以理解，但黑棋在 B（R12）打入之后，白棋就失去了侵入角部的选择。（第40页）])</script></div>
