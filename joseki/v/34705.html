<h1>星位 · 白脱先</h1>
<p class="lead">12 手 · 其他</p>
<p class="seq">黑Q16 白虚手 黑R14 白P18 黑Q18 白Q17 黑P17 白R17 黑R18 白R16 黑Q15 白O18</p>
<div class="gm-host" data-mode="view" data-at="end" data-numbers="1" data-full="1"><script type="text/plain">(;SZ[19];B[pd]C[星位

又称星（hoshi）。星位让棋手在角上取得根据地，同时也便于发展外势。

星位虽偏向外势，取地却未必低效。对这手下法要保持灵活，随时按局势调整：有时用来做势，有时用来取地。（第10页）];W[]C[一般而言，守角优先于边上的拆。];B[qf]LB[pg:A][ob:B][pb:D][nc:C][pc:E][jc:X][qc:F]C[小飞守角

这种守角有时不错，但不如小目守角那样把角守牢。白有好几手可以从角上咬下一大块。（第15页。）

虽然A已经非常流行，最常见的后续仍是在X落子，不让黑往上边拆。

A（Q13）自AlphaGo以来变得流行。
B（P18）和D（Q18）是传统下法，意在让角部和上边形成见合。
C（O17）直接来挂，必须准备作战。
黑在X（K17）一带有棋时，有时会下E（Q17）。
F（R17）意在角上小活，通常会涉及劫。];W[ob]LB[pb:A][oc:B][pc:C][nc:D]C[这手“四等着”用来消掉已经守住的星位角。（第16–17页）

A（Q18）寸土不让，非常流行，可能引出复杂变化。
黑想要外边时下 B（P17），也可能变得复杂。
C（Q17）简明坚实。
D（O17）可下，但是非常悠闲的一手。];B[pb]LB[oc:A][pc:B][rf:C][qg:D][lc:E]C[A（P17）与B（Q17）是通常的后续。
C（S14）是在A与B之间选择之前的试应手。
D（R13）转换方向。
E（M17）弃掉角上的子，以便在上边做出根据。];W[pc];B[oc];W[qc];B[qb];W[qd];B[pe];W[nb])</script></div>
