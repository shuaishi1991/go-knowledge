<h1>小目 · 白挂目外</h1>
<p class="lead">10 手 · 理想</p>
<p class="seq">黑R16 白P17 黑Q14 白R17 黑S17 白Q16 黑R15 白R18 黑虚手 白R12</p>
<div class="gm-host" data-mode="view" data-at="end" data-numbers="1"><script type="text/plain">(;SZ[19];B[qd]C[3-4 Point

AKA komoku. The 3-4 point favors territory. In this regard, its efficiency is between that of the star and the 3-3 point. Its effectiveness is maximized when the focus is on the corner. Since the 3-4 point is often considered to be the best play for a steady approach to the game, the 3-4 point has been favored by professionals (and AI) over the years. Even so, it lacks the star point's potential for influence and rapid center development. (pp. 6; see also Ishigure Ikuro—In the Beginning, p. 11.)];W[oc]C[One-Space Low Approach

AKA small knight approach. This is the basic approach move to the 3-4 point and divides the corner between Black and White.

Prior to AlphaGo, a pincer would be expected. However, AI and current professionals prefer 'backing off' with <A:Q15> or <B:Q14> or kicking at <C:Q17>.];B[pf]C[Knight's Move

This answer is a quiet response to White's approach. It's more flexible than the diagonal play, since Black can make a wider extension along the right side, but it's not as solid.

Tenuki is quite popular.<br>
<A:L16> is a modern extension.<br>
<B:R12> approaches from the opposite side.<br>
<C:M17> is sturdy and resilient.<br>
<D:L17> is the classic extension.<br>
<F:R17> is a situational move that looks to settle immediately. It's reasonable if Black is strong on the right side.

[Explanation by Go Pro Yeonwoo on Youtube (SDK/Dan)\](https://youtu.be/qFnhnzTuIzk?si=xIqKAtu2Rmx7GgXt)];W[qc]C[The attachment strengthens Black and reduces the potency of the check at <X:R12>, so it is most reasonable in situations when Black is already strong on the right side.];B[rc]C[<A:Q16> often switches the direction of play to the right side.<br>
<B:S16> is a probe that can be reasonable exchange if Black is already strong on the right side.<br>
<C:R18> aims to settle immediately.];W[pd]C[This bulge is heavily criticized in the AI joseki dictionary. Historically, it was played as a move that allows White to settle, but the atari at <B:R18> foils that plan.

<A:R15> is traditional but submissive.<br>
<B:R18> is recommended by AI.];B[qe];W[qb]C[Old Joseki];B[];W[qh]C[Follow-up])</script></div>
