<h1>星位 · 白小飞挂</h1>
<p class="lead">9 手 · 理想</p>
<p class="seq">黑Q16 白R14 黑O17 白S16 黑R17 白R11 黑虚手 白M17 黑Q14</p>
<div class="gm-host" data-mode="view" data-at="end" data-numbers="1"><script type="text/plain">(;SZ[19];B[pd]C[4-4 Point

AKA star point; hoshi. The 4-4 point allows a player to establish a foothold in a corner while also enabling development of influence. 

Although the 4-4 point favors influence, it is not necessarily inefficient at securing territory. Players should be flexible with this move, ready to adjust their strategy to changing circumstances, at times using it to build influence, at other times going for territory. (p. 10.)];W[qf]C[Knight's Approach

If White is building towards an area of her own on, say, the right side, then White can attack the corner with this approach. (Other approaches are seldom preferable to this one.) (p. 14.)

<A:O17> and Tenuki emphasize territory and sente. This makes them popular choices in modern Go.];B[nc]C[Knight's Move
A territorial response.

Modern Go emphasizes speed and corners so Tenuki and <A:R16> are the most popular choices by far.];W[rd]C[Slide
This move has been around for ages but is no longer the most common one. Some professionals (such as [Yeonwoo Cho in 2019\](https://www.youtube.com/watch?v=BUetCMEW4Cc&t=53) and [Michael Redmond in 2020\](https://www.youtube.com/watch?v=MzglC0kVQTY&t=142s)) have noted a decrease in the AI winning percentage once played and called it slightly bad. True enough, this slide has little effect on Black, who needn't respond locally. But modern AI doesn't entirely shun it. In fact, it's occasionally the preferred move of modern AI such as Tencent's FineArt. It can be recommended when taking sente isn't so important and for double-digit kyu players because it's simple. Otherwise, attaching may be preferred, as in <position: 16045>.];B[qc];W[qi]C[Traditionally, this was the most common joseki and was considered a typical solid combination. (See Yilun Yang, *Fundamental Principles of Go*, p. 40.) After AI appeared, this pattern virtually disappeared in professional play. See [Yeonwoo Cho, *Joseki recommended by AI*\](https://www.youtube.com/watch?v=BUetCMEW4Cc&t=53).   

However, for double-digit kyu players, this can still be a good choice.];B[];W[lc]C[Follow-up
Tenuki is playable.<br>
<A:S17> and <B:Q14> are two of Black's local responses.];B[pf]C[[Pro games involving this position.\](http://ps.waltheri.net/740973)])</script></div>
