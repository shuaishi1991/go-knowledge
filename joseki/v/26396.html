<h1>小目 · 白挂目外</h1>
<p class="lead">13 手 · 理想</p>
<p class="seq">黑R16 白P17 黑L17 白Q14 黑Q15 白P15 黑R14 白Q13 黑R13 白Q12 黑R12 白Q11 黑R11</p>
<div class="gm-host" data-mode="view" data-at="end" data-numbers="1" data-full="1"><script type="text/plain">(;SZ[19];B[qd]C[小目

又名komoku。小目偏重实地。就效率而言，它介于星位与三三之间。当重心在角上时，它的效力发挥到最大。小目常被视为稳健行棋的最佳占角，多年来一直受职业棋手（以及AI）青睐。即便如此，它缺少星位那种取势、并迅速向中腹发展的潜力。（第6页；另见石榑郁郎《In the Beginning》第11页。）];W[oc]LB[pe:A][pf:B][pc:C]C[一间低挂

又称小飞挂。这是对小目的基本挂法，把角分给黑白双方。

AlphaGo 之前，人们预期会夹。然而 AI 和当今职业棋手更喜欢在 A（Q15）或 B（Q14）退，或在 C（Q17）踢。];B[kc]C[三间低夹

这种夹比二间夹更为从容。它是仍算夹的最远一手，也可以看作从左上已有棋形向外的拆。];W[pf]LB[kc:A]C[定式

这基本上就是著名的大斜定式（又称大斜），只是黑在A（L17）多了一子。它曾经诱人而复杂，如今因AI而被压缩、简化了。（参见江维杰讲解三星杯对局：申真谞对谢尔豪。）];B[pe]C[这曾是大斜定式中最流行、也相当成功的形，可在AI看来，如今已是坏棋。

参见迈克尔·雷蒙的Go TV《AlphaGo vs. The World》第7局：乔智健四段（白）对AlphaGo Master（黑）。];W[oe];B[qf];W[pg];B[qg];W[ph];B[qh];W[pi];B[qi]C[这一手让白更难取得先手。如果白应了，黑打算脱先，让白把右边一带封住。

参见 Michael Redmond's Go TV, AlphaGo vs. The World: Game 7, Qiao Zhijian 4p (W) vs. AlphaGo Master (B)])</script></div>
