<h1>小目 · 白挂高目</h1>
<p class="lead">9 手 · 好棋</p>
<p class="seq">黑R16 白P16 黑N17 白R17 黑S17 白Q17 黑S15 白O15 黑L16</p>
<div class="gm-host" data-mode="view" data-at="end" data-numbers="1" data-full="1"><script type="text/plain">(;SZ[19];B[qd]C[小目

又名komoku。小目偏重实地。就效率而言，它介于星位与三三之间。当重心在角上时，它的效力发挥到最大。小目常被视为稳健行棋的最佳占角，多年来一直受职业棋手（以及AI）青睐。即便如此，它缺少星位那种取势、并迅速向中腹发展的潜力。（第6页；另见石榑郁郎《In the Beginning》第11页。）];W[od]C[一间高挂

白棋高挂时，有压住黑棋的感觉，并向中腹形成明显的外势。黑棋必须小心应对。（第6页）];B[mc]LB[qc:A]C[一间低夹
人工智能出现之前，这种夹用得很多。现代职业对局里不太出现，因为 AI 认为结果不好。从这个角度看，没有充分理由就不要夹。不过这种夹也能引出许多不熟悉的变化，了解它们，也许能占到便宜。（参见 AI Masterclass。）

A（R17）是最常见的一手。];W[qc]C[白大多数时候在三三靠。（参见AI大师课。）];B[rc];W[pc];B[re];W[ne]C[白用尖向外逃出完全可以。这是“从前”的主定式。（参见《AI Masterclass》。）];B[kd]LB[qf:A]C[右边不应，会留下A（R14）这个要点。那之后黑会有点难受。（参见《AI大师课》。）])</script></div>
