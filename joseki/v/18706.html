<h1>星位 · 白小飞挂</h1>
<p class="lead">10 手 · 理想</p>
<p class="seq">黑Q16 白R14 黑R12 白R17 黑R16 白Q17 黑P16 白O18 黑虚手 白N17</p>
<div class="gm-host" data-mode="view" data-at="end" data-numbers="1"><script type="text/plain">(;SZ[19];B[pd]C[星位

又称星（hoshi）。星位让棋手在角上取得根据地，同时也便于发展外势。

星位虽偏向外势，取地却未必低效。对这手下法要保持灵活，随时按局势调整：有时用来做势，有时用来取地。（第10页）];W[qf]C[小飞挂

如果白正在朝自己的地域发展，比如说右边，就可以用这手挂来攻角。（其他挂法很少比这一手更可取。）（第14页。）

A（O17）和脱先都强调实地与先手，因此在现代围棋里很常用。];B[qh]C[一间低夹
这手窄夹不让白沿边拆开。（第1卷。）];W[qc]C[点三三
白潜入角部，从而脱出严厉的攻击。若黑先占了小目，就不存在这种可能。（第62页。）
A（R16）是最常见的后续，现代职业对局中尤其如此。
B（Q17）历史上常见，但在现代职业对局中已很少见。当黑在上边已有子、使这一带的势力比边上的势力更有价值时，才会下这手。];B[qd]C[A（Q17）是定式。
B（S16）只在极少数情况下是好棋。它是常见的初学者错误。];W[pc]C[A（P16）是定式。
B（P17）和C（S17）是初学者常犯的错误。];B[od]C[A（S16）是多数时候的选择。

C（P17）可以下：如果上边价值不大，或者已经有大模样，而白想先手去消它。];W[nb]C[定式
