<h1>目外 · 白靠小目</h1>
<p class="lead">12 手 · 理想</p>
<p class="seq">黑R15 白Q17 黑O16 白P16 黑P15 白O17 黑N16 白N17 黑M16 白M17 黑L16 白K17</p>
<div class="gm-host" data-mode="view" data-at="end" data-numbers="1" data-full="1"><script type="text/plain">(;SZ[19];B[qe]C[三五点

又名目外。三五点不是常见的布局着法。它侧重外势和边。由于它常常有利于占据高位，全局作战时更有优势，因此更适合喜欢战斗的棋风。（第9页）

它不对称的姿态会引出早期的续着——黑守角，或白来挂——正如小目上的一子那样。（石仓郁郎——《In the Beginning》，第16页）];W[pc]LB[od:A][nd:B]C[低挂
通常的一手。

A（P16）是预期的后续。黑压，通常仍保先手。
B（O16）是大斜定式的开始。];B[nd]LB[od:B][pe:A][nc:C][oc:D]C[定式

这就是著名的大斜定式（Taisha）。它曾经既诱人又复杂，如今因AI而被精简。（参见江维杰讲解三星杯对局：申真谞对谢尔豪。）

白可在B（P16）下，或脱先以避免复杂。这些都是妥协之着，轻微的亏损不可避免。即使在A（Q15）靠上之后，也仍有妥协之着。

C（O17）和D（P17）是旧定式，比现在的下法更简单。];W[od]C[这一手避开大斜的复杂变化，但局部略亏。];B[oe];W[nc];B[md];W[mc];B[ld];W[lc];B[kd];W[jc]C[定式])</script></div>
