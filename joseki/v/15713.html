<h1>星位 · 白小飞挂</h1>
<p class="lead">9 手 · 好棋</p>
<p class="seq">黑Q16 白R14 黑O17 白M17 黑S16 白S15 黑R15 白S14 黑R17</p>
<div class="gm-host" data-mode="view" data-at="end" data-numbers="1"><script type="text/plain">(;SZ[19];B[pd]C[星位

又称星（hoshi）。星位让棋手在角上取得根据地，同时也便于发展外势。

星位虽偏向外势，取地却未必低效。对这手下法要保持灵活，随时按局势调整：有时用来做势，有时用来取地。（第10页）];W[qf]C[小飞挂

如果白正在朝自己的地域发展，比如说右边，就可以用这手挂来攻角。（其他挂法很少比这一手更可取。）（第14页。）

A（O17）和脱先都强调实地与先手，因此在现代围棋里很常用。];B[nc]C[小飞
取实地的应手。

现代围棋重视速度和角，所以脱先和A（R16）是最流行的选择，而且遥遥领先。];W[lc]C[视局面而定，白也许能下在这里。这手棋在让子棋中常见。];B[rd]C[这手把角定下来了，但有点消极。];W[re]C[这手靠是过分之着，也是对黑的侮辱。白想欺负黑，希望黑到别处去下。

A（R15）是有自信的一手，推荐给一位数级位和段位棋手。
B（R17）胆小，但能很好地守住角，推荐给两位数级位棋手。
C（R16）比 B 更差。];B[qe]C[A（S14）是正着。
B（Q15）无缘无故地巩固角地。];W[rf];B[qc]C[若黑现在下在这里，当初为什么要交换A（R15）那一手？这甚至比一开始就直接点三三更差。])</script></div>
