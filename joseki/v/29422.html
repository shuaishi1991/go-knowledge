<h1>小目 · 白小飞挂</h1>
<p class="lead">16 手 · 理想</p>
<p class="seq">黑R16 白O17 黑Q17 白L17 黑J17 白O15 黑N16 白O16 黑R13 白虚手 黑M18 白L18 黑N18 白M16 黑O18 白N15</p>
<div class="gm-host" data-mode="view" data-at="end" data-numbers="1" data-full="1"><script type="text/plain">(;SZ[19];B[qd]C[小目

又名komoku。小目偏重实地。就效率而言，它介于星位与三三之间。当重心在角上时，它的效力发挥到最大。小目常被视为稳健行棋的最佳占角，多年来一直受职业棋手（以及AI）青睐。即便如此，它缺少星位那种取势、并迅速向中腹发展的潜力。（第6页；另见石榑郁郎《In the Beginning》第11页。）];W[nc]C[大飞挂
这种不太常见的挂角，实地不如小飞挂，但能削弱黑在上边的潜力。（第57页。）

这种挂也能简化局面，因为比起更常见的挂法，它走出的常规定式更少。参见Yilun Yang，2016 Cotsen Open——Yang Yilun 7p对Liao Guiyong 9p表演赛讲解。];B[pc]C[尖守角
黑得到一些实地。但白可以在上边确立据点。（第57页）];W[kc]LB[jc:A]C[定式
要补强一颗弱子时，拆二是标准下法。拆在这里不过是常识。更宽的A（K17）会给黑留下打入，并不安全。];B[ic]C[后续];W[ne];B[md]C[试应手];W[nd]LB[qg:A][pg:B]C[A（R13）和 B（Q13）有相似的后续。];B[qg]LB[ke:A]C[A（L15）正常，是本手。如果 J17 一子没有补上，它就瞄着攻击这子。];W[];B[lb]C[后续];W[kb];B[mb];W[ld];B[nb];W[me])</script></div>
