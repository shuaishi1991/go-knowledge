<h1>小目 · 白挂目外</h1>
<p class="lead">12 手 · 理想</p>

<div class="gm-host" data-mode="view" data-at="end" data-numbers="1" data-full="1"><script type="text/plain">(;SZ[19];B[qd]C[小目

又名komoku。小目偏重实地。就效率而言，它介于星位与三三之间。当重心在角上时，它的效力发挥到最大。小目常被视为稳健行棋的最佳占角，多年来一直受职业棋手（以及AI）青睐。即便如此，它缺少星位那种取势、并迅速向中腹发展的潜力。（第6页；另见石榑郁郎《In the Beginning》第11页。）];W[oc]LB[pe:A][pf:B][pc:C]C[一间低挂

又称小飞挂。这是对小目的基本挂法，把角分给黑白双方。

AlphaGo 之前，人们预期会夹。然而 AI 和当今职业棋手更喜欢在 A（Q15）或 B（Q14）退，或在 C（Q17）踢。];B[mc]LB[pe:A][oe:B][md:C]C[一间低夹
这种贴身夹往往立刻引发战斗。

A（Q15）基本上是当前职业棋手和 AI 考虑的唯一一手。它会导向非常复杂的定式（24937），白若不做重大让步就无法避开。
可以脱先。
B（P15）和 C（N16）是更简单的选择。];W[pe];B[pd];W[od];B[oe];W[ne];B[of];W[md]LB[pg:A][pf:B][ld:C][qg:D][oh:E][qf:F]C[A（Q13）是现代下法。
B（Q14）是传统下法。
C（M16）是复杂棋形。
D（R13）、E（P12）和F（R14）近来也有人下过。];B[pf];W[lc]C[定式
（另见《Shin Hayawakari Shojiten - Tagaisen Joseki》第96页；《Joseki in Our Time》第157页；以及《Punishing and Correcting Joseki mistakes》第2章第2局。）])</script></div>
