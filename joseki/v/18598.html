<h1>星位 · 白小飞挂</h1>
<p class="lead">13 手 · 理想</p>
<p class="seq">黑Q16 白R14 黑R12 白O17 黑Q14 白R17 黑Q17 白R16 黑Q15 白S14 黑Q18 白R18 黑L16</p>
<div class="gm-host" data-mode="view" data-at="end" data-numbers="1"><script type="text/plain">(;SZ[19];B[pd]C[星位

又称星（hoshi）。星位让棋手在角上取得根据地，同时也便于发展外势。

星位虽偏向外势，取地却未必低效。对这手下法要保持灵活，随时按局势调整：有时用来做势，有时用来取地。（第10页）];W[qf]C[小飞挂

如果白正在朝自己的地域发展，比如说右边，就可以用这手挂来攻角。（其他挂法很少比这一手更可取。）（第14页。）

A（O17）和脱先都强调实地与先手，因此在现代围棋里很常用。];B[qh]C[一间低夹
这手窄夹不让白沿边拆开。（第1卷。）

迈克尔·雷蒙在YouTube上的讲解（两位数级至一位数级）];W[nc]C[双挂

通常有两种可能：A（O16）和B（Q14）。AI略偏好A（O16），但B（Q14）在职业棋手里更流行。（参见AI Masterclass。）];B[pf]C[白通常在A（R17）打入。（参见AI大师课。）];W[qc]C[白可以挡在任意一侧。但AI多半推荐挡在A（Q17）。（参见《AI大师课》。）];B[pc];W[qd];B[pe];W[rf];B[pb];W[qb]C[这一手守住了角。（参见《AI大师课》。）

如果黑不在意白在X（Q13）扳，就可以在A（L16）夹。否则，黑应在B（N16）压。];B[kd]C[定式
