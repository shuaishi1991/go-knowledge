<h1>星位 · 白脱先</h1>
<p class="lead">6 手 · 理想</p>
<p class="seq">黑Q16 白虚手 黑R14 白Q13 黑R13 白Q11</p>
<div class="gm-host" data-mode="view" data-at="end" data-numbers="1"><script type="text/plain">(;SZ[19];B[pd]C[星位

又称星（hoshi）。星位让棋手在角上取得根据地，同时也便于发展外势。

星位虽偏向外势，取地却未必低效。对这手下法要保持灵活，随时按局势调整：有时用来做势，有时用来取地。（第10页）];W[]C[一般而言，守角优先于边上的拆。];B[qf]LB[pg:A][ob:B][pb:D][nc:C][pc:E][jc:X][qc:F]C[小飞守角

这种守角有时不错，但不如小目守角那样把角守牢。白有好几手可以从角上咬下一大块。（第15页。）

虽然A已经非常流行，最常见的后续仍是在X落子，不让黑往上边拆。

A（Q13）自AlphaGo以来变得流行。
B（P18）和D（Q18）是传统下法，意在让角部和上边形成见合。
C（O17）直接来挂，必须准备作战。
黑在X（K17）一带有棋时，有时会下E（Q17）。
F（R17）意在角上小活，通常会涉及劫。];W[pg]LB[pk:D][qj:E][pj:F][qi:G]C[压
从前这手很少见，尤其在序盘更是罕见。它看起来并不急，也不是先手，但 AlphaGo 经常下它之后，人们的看法变了。其用意是压缩黑的阵势，而不是直接打入。与打入相比，这手风险更低，可以用角换取外势。这也符合围棋的根本原则：不要试图摧毁对手、通吃一切，只要下得比对手好一点，多得一点即可。

对这手压进行夹击，是人工智能带来的思路，如今很常见。D（Q9）、E（R10）、F（Q10）和 G（R11）是当前（2019年）职业对局里的常客，但尚未完全形成固定套路。];B[qg];W[pi]C[定式])</script></div>
