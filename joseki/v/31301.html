<h1>三三 · 白星</h1>
<p class="lead">10 手 · 好棋</p>
<p class="seq">黑R17 白Q16 黑R16 白Q14 黑Q15 白P15 黑R15 白P14 黑R13 白O17</p>
<div class="gm-host" data-mode="view" data-at="end" data-numbers="1" data-full="1"><script type="text/plain">(;SZ[19];B[qc]C[三三

又称 san-san。一着三三就能完全占住角，不过位置偏低，机动性较差。重视实地、并准备打持久战的棋手最常使用，白棋也经常走这里。（第7页）

不像小目那样急着守角或挂角。双方都可以先观望，等别处的进程使挂或守变得合适时再动手。（石榑郁郎——《In the Beginning》，第12–13页。）];W[pd]C[压

这是对付三三的传统应手。

黑下一手往哪边走，取决于两边的配置。

先爬一手，往往是为了随后朝相反方向小飞滑入做准备。若黑走在1位（右侧），随后的小飞就走在上边。黑的小飞会削减它所在那一边的实地潜力。

如果边上已经有白子，白这一手就是错着。那种情况下，白本应从那颗子拆边，而不是走在Q16。];B[qd];W[pf];B[pe];W[oe];B[qe];W[of];B[qg];W[nc]C[定式])</script></div>
