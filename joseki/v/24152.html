<h1>小目 · 白挂目外</h1>
<p class="lead">5 手 · 理想</p>
<p class="seq">黑R16 白P17 黑Q14 白R9 黑R11</p>
<div class="gm-host" data-mode="view" data-at="end" data-numbers="1" data-full="1"><script type="text/plain">(;SZ[19];B[qd]C[小目

又名komoku。小目偏重实地。就效率而言，它介于星位与三三之间。当重心在角上时，它的效力发挥到最大。小目常被视为稳健行棋的最佳占角，多年来一直受职业棋手（以及AI）青睐。即便如此，它缺少星位那种取势、并迅速向中腹发展的潜力。（第6页；另见石榑郁郎《In the Beginning》第11页。）];W[oc]LB[pe:A][pf:B][pc:C]C[一间低挂

又称小飞挂。这是对小目的基本挂法，把角分给黑白双方。

AlphaGo 之前，人们预期会夹。然而 AI 和当今职业棋手更喜欢在 A（Q15）或 B（Q14）退，或在 C（Q17）踢。];B[pf]LB[kd:A][qh:B][lc:C][kc:D][qc:F]C[小飞

这是对白棋挂角的稳健应手。比起尖，它更灵活，黑棋可以在右边拆得更开，但没有那么坚实。

脱先相当流行。
A（L16）是现代的拆法。
B（R12）从另一侧挂入。
C（M17）坚实而有韧性。
D（L17）是古典的拆法。
F（R17）视局面而定，意在立刻安定。黑棋右边已强时，这手是合理的。];W[qk]LB[pp:X]C[黑在X（Q4）有子时，这是常见的分投。];B[qi])</script></div>
