<h1>小目 · 白脱先</h1>
<p class="lead">11 手 · 理想</p>
<p class="seq">黑R16 白虚手 黑P17 白O16 黑虚手 白O17 黑P16 白O15 黑P15 白O14 黑Q13</p>
<div class="gm-host" data-mode="view" data-at="end" data-numbers="1" data-full="1"><script type="text/plain">(;SZ[19];B[qd]C[小目

又名komoku。小目偏重实地。就效率而言，它介于星位与三三之间。当重心在角上时，它的效力发挥到最大。小目常被视为稳健行棋的最佳占角，多年来一直受职业棋手（以及AI）青睐。即便如此，它缺少星位那种取势、并迅速向中腹发展的潜力。（第6页；另见石榑郁郎《In the Beginning》第11页。）];W[]C[布局的最初几步要重视角。尤其下了小目之后，应尽快守角。这样通常能围出大约十目坚实实地。

守角的价值不只是围住的目数。在角上确立坚实根据地，便于从角向两边发展。

角上守角一般优先于边上的拆。];B[oc]LB[mc:X]C[小飞守角
四种守角里，这种最安全。守角之子位置恰当，能防白在X（N17）点入角部，但对右边的影响力较小。这正说明了在三线和四线下棋的基本差别。（第10页）];W[nd]C[压

这手是小飞守角的弱点。它压缩黑的棋形，却不直接打入。与打入相比，风险更低，是用角来交换外侧势力。这也符合围棋的根本道理：不要想着击垮对手、什么都拿到，只要下得比对手好，多得一点点就够了。];B[];W[nc];B[od];W[ne];B[oe];W[nf];B[pg])</script></div>
