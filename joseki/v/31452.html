<h1>目外 · 白挂高目</h1>
<p class="lead">9 手 · 理想</p>
<p class="seq">黑R15 白P16 黑Q17 白P17 黑Q16 白P15 黑Q14 白K17 黑O13</p>
<div class="gm-host" data-mode="view" data-at="end" data-numbers="1" data-full="1"><script type="text/plain">(;SZ[19];B[qe]C[三五点

又名目外。三五点不是常见的布局着法。它侧重外势和边。由于它常常有利于占据高位，全局作战时更有优势，因此更适合喜欢战斗的棋风。（第9页）

它不对称的姿态会引出早期的续着——黑守角，或白来挂——正如小目上的一子那样。（石仓郁郎——《In the Beginning》，第16页）];W[od]C[高挂

这手挂放弃角地，局部略亏。即便如此，它仍是避免被压在低位的可行办法，并能在上边已有的阵地上保持联络与配合的优势。（第56页。）];B[pc];W[oc];B[pd];W[oe];B[pf]LB[kc:A][jc:B]C[A（L17）拆得略窄，是定式的一手。
B（K17）给黑好的后续。];W[jc]C[如果白从壁上按更正常的距离拆——];B[ng]LB[ld:A]C[黑棋得到这手好棋，威胁在 A（M16）一带打入。])</script></div>
