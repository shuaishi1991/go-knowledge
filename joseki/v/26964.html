<h1>小目 · 白挂目外</h1>
<p class="lead">8 手 · 理想</p>
<p class="seq">黑R16 白P17 黑P16 白O16 黑P15 白Q17 黑R17 白L17</p>
<div class="gm-host" data-mode="view" data-at="end" data-numbers="1" data-full="1"><script type="text/plain">(;SZ[19];B[qd]C[小目

又名komoku。小目偏重实地。就效率而言，它介于星位与三三之间。当重心在角上时，它的效力发挥到最大。小目常被视为稳健行棋的最佳占角，多年来一直受职业棋手（以及AI）青睐。即便如此，它缺少星位那种取势、并迅速向中腹发展的潜力。（第6页；另见石榑郁郎《In the Beginning》第11页。）];W[oc]LB[pe:A][pf:B][pc:C]C[一间低挂

又称小飞挂。这是对小目的基本挂法，把角分给黑白双方。

AlphaGo 之前，人们预期会夹。然而 AI 和当今职业棋手更喜欢在 A（Q15）或 B（Q14）退，或在 C（Q17）踢。];B[od]C[靠

这手棋试图靠来加强黑棋，并经营右边。然而，加强自己却不加强对方，往往很难做到。（第1卷）];W[nd]LB[oe:A][pd:B]C[对黑的靠，这手扳常常是正确应手。白随后可以在A（P15）或B（Q16）先手打吃，帮助白走向中腹。一般而言，因为有打吃的潜力，对靠的正确应法是扳。（第1卷）];B[oe];W[pc];B[qc];W[kc])</script></div>
