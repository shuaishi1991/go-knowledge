<h1>小目 · 白挂高目</h1>
<p class="lead">6 手 · 理想</p>
<p class="seq">黑R16 白P16 黑M17 白Q13 黑M15 白R14</p>
<div class="gm-host" data-mode="view" data-at="end" data-numbers="1"><script type="text/plain">(;SZ[19];B[qd]C[3-4 Point

AKA komoku. The 3-4 point favors territory. In this regard, its efficiency is between that of the star and the 3-3 point. Its effectiveness is maximized when the focus is on the corner. Since the 3-4 point is often considered to be the best play for a steady approach to the game, the 3-4 point has been favored by professionals (and AI) over the years. Even so, it lacks the star point's potential for influence and rapid center development. (pp. 6; see also Ishigure Ikuro—In the Beginning, p. 11.)];W[od]C[One-Space High Approach

When White approaches high, it feels like it is pressing down on Black. This creates obvious influence toward the center. Black must take careful notice. (p. 6.)];B[lc]C[Two-Space Low Pincer

This pincer became popular after AlphaGo used it to great effect, particularly to support a Kobayashi framework with a black stone around <X:Q10>.

If the ladders after White <A:Q14> then Black <B:R14> are favorable to White, then A is the correct move.

[Explanation by Go Inside on Youtube (SDK/Dan)\](https://youtu.be/fawf6DcCQDc?si=B_St5jaKHk2Ifcry&t=653)];W[pg];B[le];W[qf])</script></div>
