<p class="lead">13 手 · 好棋</p>

又称星（hoshi）。星位让棋手在角上取得根据地，同时也便于发展外势。

星位虽偏向外势，取地却未必低效。对这手下法要保持灵活，随时按局势调整：有时用来做势，有时用来取地。（第10页）];W[qf]LB[nc:A]C[小飞挂

A（O17）和脱先都强调实地与先手，因此在现代围棋里很常用。];B[nc]LB[qd:A]C[小飞

白试图压制黑并施加压力。黑有三种选择：

“靠则扳。”A（N16）一般是最好的惩罚。

“不知道，随便！”C（O16）同样是好的惩罚。];B[mb]C[这手下扳是业余着，勉强能接受，但不够好，只是马马虎虎。];W[nb];B[ob];W[nd];B[oc];W[lb];B[na];W[lc]LB[rd:A]C[黑中计
