<h1>小目 · 白脱先</h1>
<p class="lead">14 手 · 理想</p>
<p class="seq">黑R16 白虚手 黑P17 白R15 黑Q15 白R14 黑Q14 白R12 黑Q13 白Q12 黑R13 白S13 黑S16 白O12</p>
<div class="gm-host" data-mode="view" data-at="end" data-numbers="1"><script type="text/plain">(;SZ[19];B[qd]C[3-4 Point

AKA komoku. The 3-4 point favors territory. In this regard, its efficiency is between that of the star and the 3-3 point. Its effectiveness is maximized when the focus is on the corner. Since the 3-4 point is often considered to be the best play for a steady approach to the game, the 3-4 point has been favored by professionals (and AI) over the years. Even so, it lacks the star point's potential for influence and rapid center development. (pp. 6; see also Ishigure Ikuro—In the Beginning, p. 11.)];W[]C[The first steps in the opening emphasize the corners. When you play a 3-4 stone, in particular, you should waste no time enclosing the corner. This will usually build about ten points of secure territory.

The value of an enclosure isn't just the points of territory it surrounds. Securing a solid base in the corner makes it easy to develop along either side from the corner.

A corner enclosure generally takes priority over a side extension.];B[oc]C[Small Knight Enclosure
This enclosure is the safest among the four enclosures. The enclosure stone is in the right position to defend against White stepping into the corner at <X:N17>, but has less influence over the right side. This illustrates the basic difference between playing on the third and fourth lines. (p. 10.)];W[qe]C[Attachment

White aims to make Black's corner overconcentrated. However, there are many variations.

It is particularly popular in [this opening\](29512) where it has become the standard move.];B[pe];W[qf];B[pf];W[qh];B[pg];W[ph];B[qg];W[rg];B[rd];W[nh])</script></div>
