<p class="lead">39 手 · 理想</p>

<div class="gm-host" data-mode="view" data-at="end" data-numbers="1" data-full="1"><script type="text/plain">(;SZ[19];B[qd]C[小目

又名komoku。小目偏重实地。就效率而言，它介于星位与三三之间。当重心在角上时，它的效力发挥到最大。小目常被视为稳健行棋的最佳占角，多年来一直受职业棋手（以及AI）青睐。即便如此，它缺少星位那种取势、并迅速向中腹发展的潜力。（第6页；另见石榑郁郎《In the Beginning》第11页。）];W[od]C[一间高挂

白棋高挂时，有压住黑棋的感觉，并向中腹形成明显的外势。黑棋必须小心应对。（第6页）];B[oc]LB[nc:A][pd:B][nd:C][pc:D]C[内靠
黑在此靠，试图加强自己的棋，并保护角上实地。职业棋手常用这个定式。（第1卷）

A（O17）简明，以实地换外势。
B（Q16）会导向复杂的雪崩变化，也有一些简单变化。
C（O16）缓。
D（Q17）较差。];W[pd]C[雪崩形里有许多凶险变化。不过，黑也可以选择几种简明的后续。

在这个形里，定式怎么走，最初由黑来选。典型结果是黑占角，并在边上出头，白取得厚势。

注意，这一手只有当白占着D4时才可能是定式。否则，某些雪崩局面（例如局面27044）里的征子不成立，结果会对黑略好一些。白子仅仅在C4还不够。参见迈克尔·雷蒙《AlphaGo对世界：第26局，尹灿熙六段（白）对AlphaGo Master（黑）》。];B[pc];W[qe]LB[rd:A][nc:B][qc:C][nd:D][re:E]C[A（S16）以简明的方式取得实地。

B（O17）可能引出大雪崩。

C（R17）是另一种避免复杂变化的走法。

D（O16）是小雪崩（ko-nadare）。

E（S15）比较平和，但结果对白有利。

谈到大雪崩定式，武宫正树九段曾经说过：“我这辈子再也不下雪崩了。我不喜欢这种大规模定式，既复杂，又把棋盘定得太多。对初学者，我建议只下简明变化（A）。”迈克尔·雷蒙也推荐A。

参见迈克尔·雷蒙《AlphaGo对世界：第16局，AlphaGo Master（白）对连笑七段（黑）》，以及《第55局，AlphaGo Master（白）对陈耀烨九段+孟泰龄六段（黑）》。];B[nc]LB[rd:A][nd:B][qj:C]C[A（S16）简明。
B（O16）是复杂的大雪崩定式。
C（R10）也是定式。

包括 AlphaGo 在内的强手，更愿意避开大雪崩定式这类局面：它们基本上是在比记忆，而不是比计算和战斗。];W[nd]C[大雪崩定式
又称oo-nadare。];B[md];W[qc];B[rd];W[qb];B[rc];W[mc];B[lc];W[rb];B[re];W[mb];B[nb];W[lb];B[pb];W[kc];B[me];W[of];B[qf];W[nf];B[ke];W[hc];B[lg];W[oi];B[qi]C[问题10和13。];W[ok];B[];W[pa];B[oa];W[ra];B[ma];W[la];B[sb]LB[qa:X][na:X]C[白很难做活，但可以利用X（R19）、X（O19）这个双劫，在日后出现劫争时取得劫材。])</script></div>
