<h1>星位 · 白小飞挂</h1>
<p class="lead">13 手 · 理想</p>
<p class="seq">黑Q16 白R14 黑N17 白R17 黑R16 白Q17 黑P17 白P18 黑O17 白S16 黑S15 白S17 黑R15</p>
<div class="gm-host" data-mode="view" data-at="end" data-numbers="1"><script type="text/plain">(;SZ[19];B[pd]C[星位

又称星（hoshi）。星位让棋手在角上取得根据地，同时也便于发展外势。

星位虽偏向外势，取地却未必低效。对这手下法要保持灵活，随时按局势调整：有时用来做势，有时用来取地。（第10页）];W[qf]C[小飞挂

如果白正在朝自己的地域发展，比如说右边，就可以用这手挂来攻角。（其他挂法很少比这一手更可取。）（第14页。）

A（O17）和脱先都强调实地与先手，因此在现代围棋里很常用。];B[mc]C[大飞

黑大致是请白拿下角上实地，换黑取得外势。参见迈克尔·雷蒙《AlphaGo对世界：第29局，AlphaGo Master（白）对芈昱廷九段（黑）》。];W[qc];B[qd];W[pc];B[oc]C[常见错误];W[ob];B[nc];W[rd];B[re];W[rc];B[qe]C[古代定式

白会以A（S14）或B（Q14）续走。])</script></div>
