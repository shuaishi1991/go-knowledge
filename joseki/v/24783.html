<h1>小目 · 白挂目外</h1>
<p class="lead">8 手 · 理想</p>
<p class="seq">黑R16 白P17 黑Q17 白P16 黑Q14 白L16 黑虚手 白R15</p>
<div class="gm-host" data-mode="view" data-at="end" data-numbers="1"><script type="text/plain">(;SZ[19];B[qd]C[小目

又名komoku。小目偏重实地。就效率而言，它介于星位与三三之间。当重心在角上时，它的效力发挥到最大。小目常被视为稳健行棋的最佳占角，多年来一直受职业棋手（以及AI）青睐。即便如此，它缺少星位那种取势、并迅速向中腹发展的潜力。（第6页；另见石榑郁郎《In the Beginning》第11页。）];W[oc]C[一间低挂

又称小飞挂。这是对小目的基本挂法，把角分给黑白双方。

AlphaGo 之前，人们预期会夹。然而 AI 和当今职业棋手更喜欢在 A（Q15）或 B（Q14）退，或在 C（Q17）踢。];B[pc]C[踢
AlphaGo 重新启用这手，以先手取得角地。];W[od]C[要点
靠来扳，是常识。然而若靠的子已经连回己方，就不能固执地扳。白改为在这里长。若让黑在 P16（X（P16））扳成虎口，是白无法忍受的。（第1卷）];B[pf];W[kd]C[定式];B[];W[qe]C[后续])</script></div>
