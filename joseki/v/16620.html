<h1>星位 · 白小飞挂</h1>
<p class="lead">10 手 · 理想</p>
<p class="seq">黑Q16 白R14 黑O17 白S17 黑R17 白S15 黑S16 白T16 黑R16 白R11</p>
<div class="gm-host" data-mode="view" data-at="end" data-numbers="1"><script type="text/plain">(;SZ[19];B[pd]C[星位

又称星（hoshi）。星位让棋手在角上取得根据地，同时也便于发展外势。

星位虽偏向外势，取地却未必低效。对这手下法要保持灵活，随时按局势调整：有时用来做势，有时用来取地。（第10页）];W[qf]LB[nc:A]C[小飞挂

如果白正在朝自己的地域发展，比如说右边，就可以用这手挂来攻角。（其他挂法很少比这一手更可取。）（第14页。）

A（O17）和脱先都强调实地与先手，因此在现代围棋里很常用。];B[nc]LB[qd:A]C[小飞
取实地的应手。

现代围棋重视速度和角，所以脱先和A（R16）是最流行的选择，而且遥遥领先。];W[rc]C[有点像骗着，但本身也无不可。先下 R17 再下 R16，会转到从 R16 开始的那条变化。通常最好的一手是脱先，尤其在序盘早期。];B[qc];W[re];B[rd];W[sd];B[qd];W[qi]LB[rb:A][ql:B]C[黑避开了骗着，结果大致两分。

对白来说，A（S18）和B（R8）是见合。])</script></div>
