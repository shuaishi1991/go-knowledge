又名高目。四五点着眼于外势。在这一点上，它和三五点相似。

外势的价值低段棋手很难体会。随着战斗经验增加，这一点会越来越清楚。（第36页）

A（Q17）是传统下法，非常常见。
B（R17）正越来越受青睐。
C（R13）从边上挂入。
D（P17）避开正面冲突。];W[pc]C[挂

这手棋施加压力，是高目之后的传统后续。白棋的角上之子此刻显得孤单；白棋若在那里应，黑棋会自然地筑起外势。

脱先是最常见的选择，能让白棋避开复杂变化。
A（R15）用角地换给黑棋外势，但黑棋若抵抗，就会变得棘手。
B（O17）变化复杂，在这条征子对黑不利时最为有效。];W[nc]C[在此靠，是安定白角上棋子的一种方法。不过黑可以造出外势。
