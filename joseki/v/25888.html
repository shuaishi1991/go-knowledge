<h1>小目 · 白挂目外</h1>
<p class="lead">13 手 · 理想</p>
<p class="seq">黑R16 白P17 黑M16 白P14 黑P16 白O16 黑P15 白O15 黑O14 白Q17 黑O17 白Q14 黑N15</p>
<div class="gm-host" data-mode="view" data-at="end" data-numbers="1"><script type="text/plain">(;SZ[19];B[qd]C[3-4 Point

AKA komoku. The 3-4 point favors territory. In this regard, its efficiency is between that of the star and the 3-3 point. Its effectiveness is maximized when the focus is on the corner. Since the 3-4 point is often considered to be the best play for a steady approach to the game, the 3-4 point has been favored by professionals (and AI) over the years. Even so, it lacks the star point's potential for influence and rapid center development. (pp. 6; see also Ishigure Ikuro—In the Beginning, p. 11.)];W[oc]C[One-Space Low Approach

AKA small knight approach. This is the basic approach move to the 3-4 point and divides the corner between Black and White.

Prior to AlphaGo, a pincer would be expected. However, AI and current professionals prefer 'backing off' with <A:Q15> or <B:Q14> or kicking at <C:Q17>.];B[ld]C[Two-Space High Pincer

This pincer maintains balance between territory and influence, offers a plethora of options, and has few weaknesses.

[Explanation by Go Inside on Youtube (SDK/Dan)\](https://youtu.be/aCzDpl9Y5zs?si=6SlLc43nuglDwltt)];W[of]C[Two-Space Jump
This move blunts the effect of an attack at P16 or Q17, lightly, in sente.];B[od];W[nd];B[oe]C[This is definitely not joseki, but there are plenty of brute-force advocates who will play this and such moves whenever the shape permits them, only too happy to be getting embroiled in a fight.];W[ne];B[nf];W[pc];B[nc]C[Toshiro Kageyama once presented this puzzle at a class lecture of about 100 5k-5d players using a large Go board. Hardly anyone in the audience came up with the right answer, even though their moves were restricted to these four points. This made Kageyama sad.];W[pf];B[me]C[Toshiro Kageyama gives <A:Q16> as the refutation, but I think it's a misprint and this point is what he had intended.])</script></div>
