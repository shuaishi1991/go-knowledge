<h1>目外 · 白靠小目</h1>
<p class="lead">6 手 · 理想</p>
<p class="seq">黑R15 白Q17 黑N17 白P16 黑N15 白Q14</p>
<div class="gm-host" data-mode="view" data-at="end" data-numbers="1"><script type="text/plain">(;SZ[19];B[qe]C[3-5 Point

AKA mokuhazushi. The 3-5 point is not a common opening play. It emphasizes influence and the side. Since it can often support taking a high position, it has more advantages when fighting globally. So it is more suitable to those who prefer a fighting game. (p. 9.)

Its asymmetrical stance invites an early follow-up play—either an enclosure by Black or an approach by White—as did a stone on the 3-4 point. (Ishigure Ikuro—In the Beginning, p. 16.)

[Explanation by Go Magic on Youtube (DDK/SDK)\](https://youtu.be/uGd_LM3A1H4?si=SL-EB3ZZXxuwC85m)

[Explanation by Go Inside on Youtube (SDK/Dan)\](https://youtu.be/enVLz7ZHzUY?si=bA8o6Rg6qafuQcDf)];W[pc]C[Low Approach
The usual move.

<A:P16> is the expected continuation. Black presses and normally retains sente.<br>
<B:O16> is the beginning of the Taisha joseki.];B[mc]C[Double Approach

Also called a two-space low pincer. This move can work well with an established position in the upper left corner, taking control of the upper side.

See [Michael Redmond, *AlphaGo vs. The World: Game 39, Iyama Yuta 9p (W) vs. AlphaGo Master (B)*\](https://www.youtube.com/watch?v=4Zle03cXJLY&t=175s) and [*Game 54, Nie Weiping 9p (W) vs. AlphaGo Master (B)*\](https://www.youtube.com/watch?v=0vZE3xaDXyc&t=213s).];W[od];B[me];W[pf]C[Joseki

Black continues the pushing battle with a push (<A:R14>) or a jump ahead (<B:R13>).

See [Michael Redmond, *AlphaGo vs. The World: Game 54, Nie Weiping 9p (W) vs. AlphaGo Master (B)*\](https://www.youtube.com/watch?v=0vZE3xaDXyc&t=213s).])</script></div>
