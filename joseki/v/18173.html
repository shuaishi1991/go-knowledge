<h1>星位 · 白小飞挂</h1>
<p class="lead">15 手 · 理想</p>
<p class="seq">黑Q16 白R14 黑R12 白Q12 黑Q11 白P12 黑R13 白Q14 黑O16 白P15 黑R17 白Q9 黑P11 白O11 黑P10</p>
<div class="gm-host" data-mode="view" data-at="end" data-numbers="1" data-full="1"><script type="text/plain">(;SZ[19];B[pd]C[星位

又称星（hoshi）。星位让棋手在角上取得根据地，同时也便于发展外势。

星位虽偏向外势，取地却未必低效。对这手下法要保持灵活，随时按局势调整：有时用来做势，有时用来取地。（第10页）];W[qf]LB[nc:A]C[小飞挂

如果白正在朝自己的地域发展，比如说右边，就可以用这手挂来攻角。（其他挂法很少比这一手更可取。）（第14页。）

A（O17）和脱先都强调实地与先手，因此在现代围棋里很常用。];B[qh]C[一间低夹
这手窄夹不让白沿边拆开。（第1卷。）];W[ph]LB[jd:X]C[这一手的一个用途，是防止黑的模样（例如黑在 X（K16）有一子）。];B[pi];W[oh];B[qg];W[pf];B[nd]C[这样白可以先手补上断点，再反击那三子。];W[oe];B[qc]LB[rd:A]C[把黑子在角里固定住。不过，这会让A（S16）的立更别扭。];W[pk]C[这是做第二只眼的要点。];B[oi];W[ni];B[oj]LB[jd:B]C[战斗定式
