<h1>收气吃</h1>
<p class="stars">★</p>
<p class="lead">被迫提子</p>
<div class="prose"><p>收气吃说的是这样一种局面：对方把公气（单官）填掉之后，你除了提掉他的棋子别无选择。在围棋里提子通常是好事，但收气吃往往是被逼出来的一手，对提子的一方未必有利——提完之后可能留下效率很低的棋形，也可能让原本能成空的地方缩水。正因如此，它反倒成了对方手里一件好用的战略工具。</p><p>中盘的战斗里，一块棋的气可能被紧到不够用，只好先提掉对方的棋子，而没法继续打下去。到了收官阶段，一手好棋可以破掉对方的眼位，或者添出一个断点，最后逼出收气吃，压缩对方的空间。</p></div>
