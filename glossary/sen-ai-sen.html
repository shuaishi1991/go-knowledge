<h1>先相先</h1>
<p class="lead">下手三局执两盘黑的手合</p>
<div class="prose"><p>先相先（日语：Sen-ai-sen）是一种如今基本已成历史的手合（棋份）制度：每三盘里，下手执两盘黑。次序是黑、白、黑。在贴目普及之前，这是职业对局中最轻的一种让子方式。</p><p>这套办法是为棋力接近的两个人略微找平：让一子嫌多，那就先相先。</p><p>它多用于成套的番棋。一方净胜四盘之后，手合就要调整：下手赢的话，就减到互先，双方分先对弈；下手输的话，就加到定先，由下手每盘都执黑。</p></div>
