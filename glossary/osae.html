<h1>挡</h1>
<p class="lead">拦住对方的去路</p>
<div class="prose"><p>挡（日语：Osae）的意思是“压下去”“拦住”，指的是不让对方长出去或者逃出去的一手，在局部战斗和死活里都很常见。</p></div>

__en: In response to Black 1, White should play a block (osae) at A, preventing Black from breaking into the corner.__ru:]LB[co:1][cp:A]AP[Sabaki:0.52.2]CA[UTF-8];W[cp]C[__Solution: true])</script></div>
<div class="prose"><p>实战中，挡既能把实地围实，也能限制打入的那块棋的余地。它多半出现在一串交换的末端——对方刚冲了一手或者扳了一手，还想接着往前走，这时就该挡了。</p></div>
