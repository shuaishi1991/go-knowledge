<h1>角番</h1>
<p class="lead">输不起的一局、决定命运的一局</p>
<div class="prose"><p>角番（日语：Kadoban）指番棋决战中输不起的那一局：一方已经被逼到悬崖边上，再输一盘就丢掉头衔或整个系列赛。五番棋、七番棋里最常见到它，落后的一方走到角番，就意味着背水一战。</p><p>角番主要是围棋用语，日本将棋和相扑里也在用。比如相扑中，大关（仅次于横纲的级别）若某次本场所战绩告负，下一场就处于角番——再打不好，就要被降级。</p><p>围棋史上，角番这一局催生过职业棋坛最惊心动魄的翻盘，成了大赛中最令人难忘的名场面。</p></div>
