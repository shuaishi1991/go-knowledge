<h1>倒脱靴 / 脱骨<button type="button" class="speak" data-speak="倒脱靴 / 脱骨" aria-label="朗读"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M4 9v6h4l5 4V5L8 9H4zm11.5 3a3.5 3.5 0 0 0-1.8-3.1v6.2A3.5 3.5 0 0 0 15.5 12z"/></svg></button></h1>
<p class="stars">★</p>
<p class="lead">在对方提子之后反击<button type="button" class="speak" data-speak="在对方提子之后反击" aria-label="朗读"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M4 9v6h4l5 4V5L8 9H4zm11.5 3a3.5 3.5 0 0 0-1.8-3.1v6.2A3.5 3.5 0 0 0 15.5 12z"/></svg></button></p>
<div class="prose"><p>倒脱靴（日语：Ishi no Shita，意为“在棋子底下”）是一种战术手段：先弃掉几颗子，等对方提走之后，再在腾出来的空点上落子，反过来把对方的棋吃掉。它和单纯的点眼、扑不同——一定要等对方先提子，圈套才会显形。<button type="button" class="speak" data-speak="倒脱靴（日语：Ishi no Shita，意为“在棋子底下”）是一种战术手段：先弃掉几颗子，等对方提走之后，再在腾出来的空点上落子，反过来把对方的棋吃掉。它和单纯的点眼、扑不同——一定要等对方先提子，圈套才会显形。" aria-label="朗读"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M4 9v6h4l5 4V5L8 9H4zm11.5 3a3.5 3.5 0 0 0-1.8-3.1v6.2A3.5 3.5 0 0 0 15.5 12z"/></svg></button></p><p>这个手段常见于死活题和手筋的变化里。倒脱靴走成功，局部的胜负会整个翻过来，眼看要输的棋反而绝处逢生。<button type="button" class="speak" data-speak="这个手段常见于死活题和手筋的变化里。倒脱靴走成功，局部的胜负会整个翻过来，眼看要输的棋反而绝处逢生。" aria-label="朗读"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M4 9v6h4l5 4V5L8 9H4zm11.5 3a3.5 3.5 0 0 0-1.8-3.1v6.2A3.5 3.5 0 0 0 15.5 12z"/></svg></button></p></div>
