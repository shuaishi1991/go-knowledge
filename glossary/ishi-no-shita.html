<h1>倒脱靴 / 脱骨</h1>
<p class="stars">★</p>
<p class="lead">在对方提子之后反击</p>
<div class="prose"><p>倒脱靴（日语：Ishi no Shita，意为“在棋子底下”）是一种战术手段：先弃掉几颗子，等对方提走之后，再在腾出来的空点上落子，反过来把对方的棋吃掉。它和单纯的点眼、扑不同——一定要等对方先提子，圈套才会显形。</p><p>这个手段常见于死活题和手筋的变化里。倒脱靴走成功，局部的胜负会整个翻过来，眼看要输的棋反而绝处逢生。</p></div>
