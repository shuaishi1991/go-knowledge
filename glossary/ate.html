<h1>打吃 / 叫吃</h1>
<p class="lead">紧气打吃的一手</p>
<div class="prose"><p><em>打</em>（Ate）指的是把对方一颗子或者一块棋逼到只剩一口气、下一手就能提掉的那一着。这个词本身是存在的，只是西方棋界很少用。实际交流中，大家用 <em>atari</em> 既指“只差一手就被提”的状态，也指造成这个状态的那一着。两种用法互通，于是 <em>atari</em> 成了日常谈棋时的主流叫法。中文里这两层意思并不区分，都叫打吃。</p></div>
<div class="gm-host" data-mode="view" data-at="end" data-numbers="1" data-full="1"><script type="text/plain">(;GM[1]FF[4]CA[UTF-8]AP[Sabaki:0.52.2]KM[6.5]SZ[19]DT[2025-03-17]AB[cp][do][ep]AW[dp]LB[ep:1]C[__zh: 黑1把白子的气收到只剩一口气。这一手叫做打吃。
__en: Black 1 reduces the white stone's liberty to one. We call Black 1 'ate' or 'atari' on the white stone.__ru:])</script></div>
<div class="prose"><p>打常被用作战斗、劫争和对杀里的先手交换。打得准，就能掌握全局的节奏：要么稳稳吃掉对方的棋，要么逼着对方回手补棋。</p></div>
