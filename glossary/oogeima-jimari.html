<h1>大飞守角</h1>
<p class="lead">用大飞的步子守住角</p>
<div class="prose"><p>大飞守角（日语：Oogeima-jimari）是用大飞的步子把角守起来，通常从小目飞到六三位。它比紧凑的小飞守角（小目到五三位）更有速度，朝边上放出的外势也更足，同时角地依然相当稳固。</p></div>
<div class="gm-host" data-mode="view" data-at="end" data-numbers="1" data-full="1"><script type="text/plain">(;GM[1]FF[4]CA[UTF-8]AP[Sabaki:0.52.2]KM[6.5]SZ[19]DT[2025-04-11]AE[cp]AB[qd][nc]LB[nc:1]C[__zh: 黑1做成大飞守角。
__en: Black 1 makes a large knight's move enclosure to the corner (oogeima-shimari).__ru:])</script></div>
<div class="prose"><p>从战略上说，它介于稳健的小飞守角和更高、更松的守角（比如一间高守角，小目到五四位）之间。这种弹性让它很适合那些既要实地、又要向外发展的布局构思。</p><p>虽然中间的空当略大，大飞守角面对常见的打入和试应手依然相当结实。在那些崇尚速度与外势、不追求死抠实地的年代，它尤其流行。</p></div>
