<h1>气紧</h1>
<p class="stars">★</p>
<p class="lead">气不够用</p>
<div class="prose"><p>气紧（日语：Damezumari）指的是一块棋气太少的局面：回旋的余地被压缩，做活也变得困难。气一少，往往就顾不上应对对方的手段，这块棋很容易被吃。</p><p>damezumari 在日语里是“堵塞”“拥挤”的意思。 </p><p>在对杀中，气紧指的是一块棋的气太少，该走的手段走不出来——比如想去紧对方的气，自己反而先被打吃——结果赢不下这场对杀。</p></div>

<div class="prose"><p>还有一个与气紧有关的经典棋形，叫<strong>金鸡独立</strong>。在这个棋形里，一块棋只剩下一口真正管用的气，随时可能被吃。 </p></div>
