<h1>单官, 气<button type="button" class="speak" data-speak="单官, 气" aria-label="朗读"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M4 9v6h4l5 4V5L8 9H4zm11.5 3a3.5 3.5 0 0 0-1.8-3.1v6.2A3.5 3.5 0 0 0 15.5 12z"/></svg></button></h1>
<p class="stars">★</p>
<p class="lead">与棋子相邻的空交叉点<button type="button" class="speak" data-speak="与棋子相邻的空交叉点" aria-label="朗读"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M4 9v6h4l5 4V5L8 9H4zm11.5 3a3.5 3.5 0 0 0-1.8-3.1v6.2A3.5 3.5 0 0 0 15.5 12z"/></svg></button></p>
<div class="prose"><p>围棋里的<strong>气</strong>（日语：dame）首先指紧挨着一颗棋子或一块棋的空点。一块棋的死活全看气：想把它提掉，就得把它剩下的气一口口填满。这层含义与气紧（damezumari）以及各种吃子手段密切相关。 <button type="button" class="speak" data-speak="围棋里的气（日语：dame）首先指紧挨着一颗棋子或一块棋的空点。一块棋的死活全看气：想把它提掉，就得把它剩下的气一口口填满。这层含义与气紧（damezumari）以及各种吃子手段密切相关。" aria-label="朗读"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M4 9v6h4l5 4V5L8 9H4zm11.5 3a3.5 3.5 0 0 0-1.8-3.1v6.2A3.5 3.5 0 0 0 15.5 12z"/></svg></button></p></div>
<div class="gm-host" data-mode="view" data-at="end" data-numbers="1"><script type="text/plain">(;GM[1]FF[4]CA[UTF-8]AP[Sabaki:0.52.2]KM[6.5]SZ[19]DT[2025-02-15]AE[ar][dq][er][dr][cr][ds][bq][aq][bp][bs][ap][ao][bo][dp][eq][eo][fp][fr][fs][es]C[__zh: 这些标记的点叫做气，也可以叫单官。
__en: The marked points are called liberties or dame.__ru:]AB[cq][cp][co]TR[bo][bp][bq][cn][cr][do][dp][dq])</script></div>
<div class="prose"><p><strong>单官</strong>则是它的另一层意思：棋盘上不属于任何一方的空交叉点。这些点通常不影响死活，双方一般也没什么兴趣去下。<button type="button" class="speak" data-speak="单官则是它的另一层意思：棋盘上不属于任何一方的空交叉点。这些点通常不影响死活，双方一般也没什么兴趣去下。" aria-label="朗读"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M4 9v6h4l5 4V5L8 9H4zm11.5 3a3.5 3.5 0 0 0-1.8-3.1v6.2A3.5 3.5 0 0 0 15.5 12z"/></svg></button></p></div>
