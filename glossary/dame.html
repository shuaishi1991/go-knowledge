<h1>单官, 气</h1>
<p class="stars">★</p>
<p class="lead">与棋子相邻的空交叉点</p>
<div class="prose"><p>围棋里的<strong>气</strong>（日语：dame）首先指紧挨着一颗棋子或一块棋的空点。一块棋的死活全看气：想把它提掉，就得把它剩下的气一口口填满。这层含义与气紧（damezumari）以及各种吃子手段密切相关。 </p></div>

__ru:]AB[cq][cp][co]TR[bo][bp][bq][cn][cr][do][dp][dq])</script></div>
<div class="prose"><p><strong>单官</strong>则是它的另一层意思：棋盘上不属于任何一方的空交叉点。这些点通常不影响死活，双方一般也没什么兴趣去下。</p></div>
