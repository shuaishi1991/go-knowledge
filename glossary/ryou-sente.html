<h1>双先</h1>
<p class="lead">双方在同一处各有先手</p>
<div class="prose"><p>双方先手（日语：Ryou-sente）指的是这样一处局面：黑白双方在这里各有一手棋，对方都非应不可——换句话说，谁下都是先手。这样的地方，行棋次序就变得格外要紧。</p></div>

__en: "A" is a double sente move, or ryou-sente, valuable for both players. Whoever plays at A first forces the opponent to respond, as it directly threatens the life and death of their group.__ru:](;B[dr]C[__Solution: true];W[as])(;B[]C[__Solution: true];W[dr];B[er]))</script></div>
<div class="prose"><p>双方先手的地方，谁先落子谁就掌握了节奏：逼对方跟着应，自己再转到别处抢主动。所以棋手常常要仔细掂量——是马上把这个先手走掉，还是脱先去下更急的地方。</p></div>
<div class="gm-host" data-mode="view" data-at="end" data-numbers="1" data-full="1"><script type="text/plain">(;GM[1]FF[4]CA[UTF-8]AP[Sabaki:0.52.2]KM[5.5]SZ[19]DT[2025-05-26]AE[do][dq][ep][cp][bn]AB[dp][fp][fo]AW[fq][gp][cn][go]LB[eq:A]C[__zh: 这是定式棋形。A对双方都是双先。
__en: A joseki pattern. A is a double sente move for both players.__ru:](;B[eq]C[__Solution: true];W[gq])(;B[]C[__Solution: true];W[eq];B[dn]))</script></div>
<div class="prose"><p>这个概念在中盘和官子里都很关键，尤其是计算官子的时候——半目之差就足以决定胜负。</p></div>
