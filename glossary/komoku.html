<h1>小目</h1>
<p class="stars">★★</p>
<p class="lead">角上三线与四线的交叉点</p>
<div class="prose"><p>小目（日语：Komoku）指角上距一条边三线、距另一条边四线的那个交叉点。它在布局里分量很重：既能把角上的实地抓在手里，又能朝中腹发挥影响。</p></div>

<div class="prose"><p>小目实地和外势两头都能兼顾，布局阶段用起来很灵活。从小目出发有大量定式可选，可以随着对手的应手和全局形势临机变招。在传统布局里，小目正因为这种平衡感，长期都是最常见的开局着点。</p></div>
