<p class="lead">角上三线与四线的交叉点<button type="button" class="speak" data-speak="角上三线与四线的交叉点" aria-label="朗读"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M4 9v6h4l5 4V5L8 9H4zm11.5 3a3.5 3.5 0 0 0-1.8-3.1v6.2A3.5 3.5 0 0 0 15.5 12z"/></svg></button></p>
<div class="prose"><p>小目（日语：Komoku）指角上距一条边三线、距另一条边四线的那个交叉点。它在布局里分量很重：既能把角上的实地抓在手里，又能朝中腹发挥影响。<button type="button" class="speak" data-speak="小目（日语：Komoku）指角上距一条边三线、距另一条边四线的那个交叉点。它在布局里分量很重：既能把角上的实地抓在手里，又能朝中腹发挥影响。" aria-label="朗读"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M4 9v6h4l5 4V5L8 9H4zm11.5 3a3.5 3.5 0 0 0-1.8-3.1v6.2A3.5 3.5 0 0 0 15.5 12z"/></svg></button></p></div>

<div class="prose"><p>小目实地和外势两头都能兼顾，布局阶段用起来很灵活。从小目出发有大量定式可选，可以随着对手的应手和全局形势临机变招。在传统布局里，小目正因为这种平衡感，长期都是最常见的开局着点。<button type="button" class="speak" data-speak="小目实地和外势两头都能兼顾，布局阶段用起来很灵活。从小目出发有大量定式可选，可以随着对手的应手和全局形势临机变招。在传统布局里，小目正因为这种平衡感，长期都是最常见的开局着点。" aria-label="朗读"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M4 9v6h4l5 4V5L8 9H4zm11.5 3a3.5 3.5 0 0 0-1.8-3.1v6.2A3.5 3.5 0 0 0 15.5 12z"/></svg></button></p></div>
