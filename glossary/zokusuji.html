<h1>俗手<button type="button" class="speak" data-speak="俗手" aria-label="朗读"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M4 9v6h4l5 4V5L8 9H4zm11.5 3a3.5 3.5 0 0 0-1.8-3.1v6.2A3.5 3.5 0 0 0 15.5 12z"/></svg></button></h1>
<p class="lead">粗笨、不讲究的下法<button type="button" class="speak" data-speak="粗笨、不讲究的下法" aria-label="朗读"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M4 9v6h4l5 4V5L8 9H4zm11.5 3a3.5 3.5 0 0 0-1.8-3.1v6.2A3.5 3.5 0 0 0 15.5 12z"/></svg></button></p>
<div class="prose"><p>俗手指的是那种不够好、下得笨拙的一手——目的也许达到了，过程却别扭又低效。它正好和手筋相对：手筋是围棋里那些漂亮又见效的战术手段。 <button type="button" class="speak" data-speak="俗手指的是那种不够好、下得笨拙的一手——目的也许达到了，过程却别扭又低效。它正好和手筋相对：手筋是围棋里那些漂亮又见效的战术手段。" aria-label="朗读"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M4 9v6h4l5 4V5L8 9H4zm11.5 3a3.5 3.5 0 0 0-1.8-3.1v6.2A3.5 3.5 0 0 0 15.5 12z"/></svg></button></p></div>

__en: Normally, White 1 is a good move, but now it's a crude play, or a "zokusuji". Play at A to see why.__ru:]LB[bn:1][do:A];B[do]C[__Solution: true];W[cn];B[dr];W[eo]C[__zh: 白的棋形没有效率，黑却先手把角和外面连上了。
__en: White's shape is ineffective, while Black connects the corner to the outside in sente.__ru:])</script></div>
<div class="prose"><p>俗手的代价可能是丢掉先手，可能是白白把对方走厚，也可能留下坏味道，或者反而把自己的实地走小了。<button type="button" class="speak" data-speak="俗手的代价可能是丢掉先手，可能是白白把对方走厚，也可能留下坏味道，或者反而把自己的实地走小了。" aria-label="朗读"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M4 9v6h4l5 4V5L8 9H4zm11.5 3a3.5 3.5 0 0 0-1.8-3.1v6.2A3.5 3.5 0 0 0 15.5 12z"/></svg></button></p></div>
