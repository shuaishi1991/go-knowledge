<h1>重复</h1>
<p class="lead">过于集中、效率偏低的棋形</p>
<div class="prose"><p><em>凝形</em>指一块棋下得太密、太挤，和它在盘上真正创造的价值不相称。这样的棋形往往很结实、很安全，却没有把空间和外势用足，战略上的潜力因此受限。比起薄，凝形被认为是更隐蔽也更伤人的低效：棋一旦凝了，后面几乎没机会补救。</p></div>

__en: White marked stones are overconcentrated and inefficient. We call them "korigatachi".__ru:])</script></div>
<div class="prose"><p>这个词来自日语动词 <em>koru</em>，意思是变硬、凝固，或者过于执着——正好点出这种棋形的僵硬和不灵活。讲棋形效率时常常提到凝形，它也是<em>手割</em>引出的核心概念之一：手割就是把落子顺序假设性地重新排一遍，用来判断局面得失的方法。</p></div>
