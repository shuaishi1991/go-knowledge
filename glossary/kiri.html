<h1>断 / 切断</h1>
<p class="stars">★</p>
<p class="lead">切断对方的联络</p>
<div class="prose"><p>断（日语：Kiri）就是不让对方的棋连成一片的一手。把两块棋之间的联络切开，对方就得同时照顾两头，攻击的机会往往由此而来。kiri 在日语里正是“切”“断”的意思，直白地说明了它的作用。</p><p>断得成立，对方的阵势就被分开，每一块都变薄、变弱。不过断也要看时机——它固然能给对方施加压力，但周围子力接应不上的话，断的这几颗子自己反而会陷入困境。</p></div>

<div class="prose"><p>断是进攻的利器，但同样重要的是知道什么时候该回头补强自己，别让对方先断了。</p></div>
