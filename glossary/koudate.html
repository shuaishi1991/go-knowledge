<h1>劫材</h1>
<p class="lead">劫争中的先手威胁</p>
<div class="prose"><p><em>劫材</em>是打劫过程中的一手：它逼着对方非应不可，自己才好回头把劫提回来。这是维持压力的重要手段，能左右整盘棋的走向。好的劫材要够大，大到对方不应就得吃亏；同时又要够便宜，即使对方应了，自己在局部损失一点也不心疼。</p></div>

<div class="prose"><p>有没有劫材、劫材够不够硬，往往决定了这个劫能不能打。有经验的棋手不只看眼前的劫，还会把全盘的劫材先数一数、掂一掂分量。攻击对方的孤棋、威胁提子、打入逼对方回防，都可以成为劫材。</p></div>
