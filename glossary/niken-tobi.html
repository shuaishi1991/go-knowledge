<h1>二间跳</h1>
<p class="lead">隔两路的跳</p>
<div class="prose"><p>二间跳是围棋里的基本棋形，用来快速向中腹或边上展开（沿边展开时通常叫<em>二间拆</em>）。它由两颗棋子组成，横向或纵向相隔两路。 </p></div>

__en: White 1 is a two-space jump (niken tobi) from the marked stone. This is a standard shape for White to make a base along the side area.__ru:]TR[qj]LB[qm:1])</script></div>
<div class="prose"><p>在开阔的局面里，或者附近有己方棋子接应时，二间跳能高效地筑势或扩张实地。布局和中盘常常见到它，用来构筑模样，或者向边上拆出。</p><p>二间跳虽然留有断点，但它轻灵，对方往往不敢贸然进攻；只要算得清楚，面对切断也能灵活应对。局面更紧、更讲究战斗的时候，棋手会选择小飞这类更厚实的下法，图个安定。</p></div>
