<h1>白棋</h1>
<p class="lead">白棋、执白的一方</p>
<div class="prose"><p>白（日语：<em>Shiro</em>）指的就是白子——按惯例，执白的一方后落子。</p><p>黑棋先行，开局天然占着一点便宜；作为补偿，白棋有<em>贴目</em>——终局时额外算给白方的目数。</p><p>白棋并不只是被动应对。白棋要走得平衡：既要有效应对黑棋的展开，又要耐心经营自己的阵地，等待战术上的机会。执白的一方必须走得灵活，随着盘面的变化不断调整构思。</p></div>
