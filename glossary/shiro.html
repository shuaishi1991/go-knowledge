<h1>白棋<button type="button" class="speak" data-speak="白棋" aria-label="朗读"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M4 9v6h4l5 4V5L8 9H4zm11.5 3a3.5 3.5 0 0 0-1.8-3.1v6.2A3.5 3.5 0 0 0 15.5 12z"/></svg></button></h1>
<p class="lead">白棋、执白的一方<button type="button" class="speak" data-speak="白棋、执白的一方" aria-label="朗读"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M4 9v6h4l5 4V5L8 9H4zm11.5 3a3.5 3.5 0 0 0-1.8-3.1v6.2A3.5 3.5 0 0 0 15.5 12z"/></svg></button></p>
<div class="prose"><p>白（日语：<em>Shiro</em>）指的就是白子——按惯例，执白的一方后落子。<button type="button" class="speak" data-speak="白（日语：Shiro）指的就是白子——按惯例，执白的一方后落子。" aria-label="朗读"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M4 9v6h4l5 4V5L8 9H4zm11.5 3a3.5 3.5 0 0 0-1.8-3.1v6.2A3.5 3.5 0 0 0 15.5 12z"/></svg></button></p><p>黑棋先行，开局天然占着一点便宜；作为补偿，白棋有<em>贴目</em>——终局时额外算给白方的目数。<button type="button" class="speak" data-speak="黑棋先行，开局天然占着一点便宜；作为补偿，白棋有贴目——终局时额外算给白方的目数。" aria-label="朗读"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M4 9v6h4l5 4V5L8 9H4zm11.5 3a3.5 3.5 0 0 0-1.8-3.1v6.2A3.5 3.5 0 0 0 15.5 12z"/></svg></button></p><p>白棋并不只是被动应对。白棋要走得平衡：既要有效应对黑棋的展开，又要耐心经营自己的阵地，等待战术上的机会。执白的一方必须走得灵活，随着盘面的变化不断调整构思。<button type="button" class="speak" data-speak="白棋并不只是被动应对。白棋要走得平衡：既要有效应对黑棋的展开，又要耐心经营自己的阵地，等待战术上的机会。执白的一方必须走得灵活，随着盘面的变化不断调整构思。" aria-label="朗读"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M4 9v6h4l5 4V5L8 9H4zm11.5 3a3.5 3.5 0 0 0-1.8-3.1v6.2A3.5 3.5 0 0 0 15.5 12z"/></svg></button></p></div>
