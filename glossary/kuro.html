<h1>黑</h1>
<p class="lead">黑棋、执黑的一方</p>
<div class="prose"><p>日语里的 <em>kuro</em> 就是黑棋——围棋两种颜色之一。执黑的一方永远先行，这点先行的便宜通常由<em>贴目</em>规则来抹平：白棋因此得到补偿的目数。</p><p>这个词在围棋语境里到处都用得上——说棋子、说实地、说着法都行，比如“kuro no ishi”（黑子）。</p></div>
</main>
