<h1>地, 地盘</h1>
<p class="lead">地、实地</p>
<div class="prose"><p>围棋里的<em>地</em>（日语：Ji）指的是一方成功围住的空点。这些空点落在自己的势力范围之内，终局时都要计入总分。不同规则下，地的算法并不一样：</p><ul><li><strong>日本规则</strong>：只数围住的空。</li><li><strong>中国规则</strong>：既数围住的空，也数落在棋盘上的子。</li></ul><p>下棋要在扩张自己的地和压缩对方的地之间找平衡：既让自己的地尽可能大，又让对方的地尽可能小。把地经营得高效——守住自己的，破掉对方的——是一项基本功，一盘棋的成败常常就系于此。</p><p>在中国以外，多数情况下都按日本规则数目。</p></div>
