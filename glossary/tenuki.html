<h1>脱先</h1>
<p class="stars">★★★</p>
<p class="lead">不应对方，转投他处</p>
<div class="prose"><p><strong>脱先</strong>指的是不理会对方的上一手，转身到棋盘的别处落子。 </p></div>

__en: Play A to see the appropriate timing for a tenuki.__ru:];B[dq]C[__Solution: true];W[cq];B[cr];W[eq];B[dr];W[ep];B[er];W[bq];B[hq]C[__zh: 定式到这一手结束。白现在应该脱先，因为左下角已经没有值得下的要点。
__en: This move is the end of a joseki. White should play tenuki now, as the bottom left corner doesn't have any valuable strategic moves.__ru:];W[de]C[__zh: 比方说，这就是脱先时值得下的一处。
__en: For example, this is one of the valuable places to play tenuki.__ru:])</script></div>
<div class="prose"><p>脱先体现的是一种判断：别处那手棋的价值，比在这里应一手更大。它往往意味着先把局部的问题挂起来，去抢更要紧的机会。</p><p>脱先能把局面拉向对自己有利的一边，但也有风险——万一那手棋非应不可，一直拖着会越来越难受，代价可能不小。</p><p>用好脱先，关键在时机：走早了，局部会留下毛病，也可能白白丢掉本该到手的便宜。</p></div>

__en: White just played 1. See what happens if Black plays tenuki A now.__ru:]LB[cj:A][ec:1];B[cj]C[__Solution: true
__zh: 通常黑应该在A按定式继续。可是黑选择了脱先……
__en: Normally, Black is expected to continue the standard joseki by playing A. However, since Black chose to tenuki...__ru:]LB[eb:A];W[eb]C[__zh: 白高兴地占到这一点，黑的角就死了。脱先脱得不是时候，后果会很严重。
