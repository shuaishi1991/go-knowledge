<h1>点眼</h1>
<p class="stars">★★</p>
<p class="lead">往对方眼位里落子，破掉两只眼</p>
<div class="prose"><p><strong>点眼</strong>（日语：Nakade）指往对方较大的眼位里落一子，让它做不出两只真眼，直接把这块棋的死活摆上台面。 </p></div>

__en: White's marked stone is a nakade.__ru:])</script></div>
<div class="prose"><p><em>基本点眼的一个例子 </em></p><p>点眼成功，往往就决定了一块棋的生死——做不出两只眼，它就得被提掉。像“刀把五”“曲三”这类棋形，都是点眼大显身手的经典场合。不过点眼这一手必须算准：要把对方所有的应手和变化都过一遍，确认这一子落下去，两只眼是真的做不出来了。</p></div>
