<h1>双吃 / 双打 / 双打吃</h1>
<p class="lead">一手同时打吃两块棋</p>
<div class="prose"><p>双打吃（日语：Ryou-atari）是围棋的基本手法：一手同时把对方的两块棋打吃。对方一次只救得了一边，另一边通常就被提掉，局面的均衡随之大变。</p></div>

__en: Black playing at A next will create a double atari.__ru:]LB[co:A];B[co]C[__Solution: true](;W[dp];B[bn])(;W[bn];B[dp]))</script></div>
<div class="prose"><p>手法简单，所以入门阶段很早就会学到。它生动地说明了围棋的一条道理：一手棋兼顾两处威胁，收益最大。既能看出双打吃的机会，也能提前发现自己棋形里的隐患——这是基本的战斗嗅觉。</p><p>高手对双打吃的苗头始终保持警觉：既要抓住它，也要避开它。</p></div>
