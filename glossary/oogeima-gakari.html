<h1>大桂馬掛</h1>
<p class="lead">用大飞的步子挂角</p>
<div class="prose"><p>大飞挂（日语：Oogeima-gakari）是挂角的一种手法：相对角上的那颗子走出大飞的步子——横向三路、纵向一路，位置比小飞挂再远一路。布局阶段常用它来轻灵而有弹性地给角上施压，尤其是挂小目。</p></div>

<div class="prose"><p>这一手既能朝边上撑出外势，又给自己留足了余地。和小飞挂相比，大飞挂放出的外势更足，但棋形松，也更容易挨反击。</p><p>周围有自己的接应时，大飞挂尤其好用——棋形虽松，对方却不容易惩罚。之后的变化很多：是走成定式还是就此打起来，全看对方怎么应——靠、夹攻，还是干脆脱先不理。</p></div>
