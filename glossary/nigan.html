<h1>两眼</h1>
<p class="lead">两只真眼</p>
<div class="prose"><p>围棋里的<strong>两眼</strong>，指一块棋做出了<strong>两只互不相连的真眼</strong>——在通常的规则下，这样的棋就提不掉了。这是死活题里的基石概念，也是判断一块棋安全与否的根本。</p></div>
<div class="gm-host" data-mode="view" data-at="end" data-numbers="1" data-full="1"><script type="text/plain">(;GM[1]FF[4]CA[UTF-8]AP[Sabaki:0.52.2]KM[6.5]SZ[19]DT[2025-04-10]AE[fp][cn][fq][es][er][br][ep][ap][aq][cs][eo]AB[bq][cq][cr][bs][ar]AW[bp][cp][dq][dr][dp][ds]C[__zh: 黑在角里是活的，因为已经有了两只眼。
__en: Black is alive in the corner, as they have already secured two eyes (nigan).__ru:]CR[as][br])</script></div>
<div class="prose"><p>一块棋要算“活棋”，就得能做出两只对方填不掉的眼——填进去等于自杀，规则不允许。只有一只眼，或者做出来的是假眼，这块棋就依然危险，随时可能被杀。</p><p>能不能算清一块棋做不做得出两眼、能不能拦住对方做出两眼，无论进攻还是防守都至关重要。棋手得掂量清楚：打入对方阵地拿到的价值，是否值得冒被封在里面、做不出两眼的风险。</p></div>
