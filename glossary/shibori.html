<h1>滚包; 滚打</h1>
<p class="lead">一路滚打，把对方挤成愚形</p>
<div class="prose"><p>滚打包收（日语：Shibori）是一种手筋：逼着对方走出一连串效率极低的棋，自己从中得利。日语原词的意思是“拧”“绞”，中文叫“滚打包收”，说的正是这个过程——对方被越挤越紧，你却借机走厚或者围空。</p></div>

<div class="prose"><p>常见的手法是弃子、打吃、先手交换连成一串，把对方的气收干净，棋形挤成愚形。滚打包收既可能直接吃掉一块棋，也可能让整场战斗彻底倒向自己一边。 </p></div>
