<h1>倒扑<button type="button" class="speak" data-speak="倒扑" aria-label="朗读"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M4 9v6h4l5 4V5L8 9H4zm11.5 3a3.5 3.5 0 0 0-1.8-3.1v6.2A3.5 3.5 0 0 0 15.5 12z"/></svg></button></h1>
<p class="lead">弃一子，反提对方一块<button type="button" class="speak" data-speak="弃一子，反提对方一块" aria-label="朗读"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M4 9v6h4l5 4V5L8 9H4zm11.5 3a3.5 3.5 0 0 0-1.8-3.1v6.2A3.5 3.5 0 0 0 15.5 12z"/></svg></button></p>
<div class="prose"><p>倒扑是围棋里的经典手筋：主动送上一颗子，引对方来提，提完之后自己立刻反提回一块更大的棋。 <button type="button" class="speak" data-speak="倒扑是围棋里的经典手筋：主动送上一颗子，引对方来提，提完之后自己立刻反提回一块更大的棋。" aria-label="朗读"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M4 9v6h4l5 4V5L8 9H4zm11.5 3a3.5 3.5 0 0 0-1.8-3.1v6.2A3.5 3.5 0 0 0 15.5 12z"/></svg></button></p></div>

<div class="prose"><p>关键在于：对方提子之后，那几颗棋只剩一口气，于是马上就能被反提。<button type="button" class="speak" data-speak="关键在于：对方提子之后，那几颗棋只剩一口气，于是马上就能被反提。" aria-label="朗读"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M4 9v6h4l5 4V5L8 9H4zm11.5 3a3.5 3.5 0 0 0-1.8-3.1v6.2A3.5 3.5 0 0 0 15.5 12z"/></svg></button></p><p>日语 utte-gaeshi 字面是“打回去”，恰好道出这一手翻转之快。初学者常常中招，高手也会用倒扑来逼对方交换、赢下劫争，或者铺垫更复杂的次序。<button type="button" class="speak" data-speak="日语 utte-gaeshi 字面是“打回去”，恰好道出这一手翻转之快。初学者常常中招，高手也会用倒扑来逼对方交换、赢下劫争，或者铺垫更复杂的次序。" aria-label="朗读"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M4 9v6h4l5 4V5L8 9H4zm11.5 3a3.5 3.5 0 0 0-1.8-3.1v6.2A3.5 3.5 0 0 0 15.5 12z"/></svg></button></p></div>
