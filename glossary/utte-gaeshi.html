<h1>倒扑</h1>
<p class="lead">弃一子，反提对方一块</p>
<div class="prose"><p>倒扑是围棋里的经典手筋：主动送上一颗子，引对方来提，提完之后自己立刻反提回一块更大的棋。 </p></div>

__en: Black playing at A can create a snapback ("utte-gaeshi") to secure an eye.__ru:];B[fa]C[__Solution: true];W[ea];B[fa])</script></div>
<div class="prose"><p>关键在于：对方提子之后，那几颗棋只剩一口气，于是马上就能被反提。</p><p>日语 utte-gaeshi 字面是“打回去”，恰好道出这一手翻转之快。初学者常常中招，高手也会用倒扑来逼对方交换、赢下劫争，或者铺垫更复杂的次序。</p></div>
