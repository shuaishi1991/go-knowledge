<h1>试应手</h1>
<p class="lead">试探对方应手的一手</p>
<div class="prose"><p>试应手（日语 <em>yosumi</em>，也作 <em>yosumiru</em>）不是为了眼前的便宜，而是为了看对方怎么应。它常常决定后续的战略方向，在局面不明朗时尤其有力。 </p></div>
<div class="gm-host" data-mode="view" data-at="end" data-numbers="1" data-full="1"><script type="text/plain">(;GM[1]FF[4]CA[UTF-8]AP[Sabaki:0.52.2]KM[6.5]SZ[19]DT[2025-05-26]AB[qd][oc]AW[rd]LB[rd:1]C[__zh: 白1是典型的试应手，试探黑如何应对，再决定下一手。
__en: White 1 is a classic probing move, or a "yosumi", testing Black’s response so White can decide on the next move accordingly.__ru:])</script></div>
<div class="prose"><p>这背后是围棋一贯的道理：先看清，再动手。逼对方先表态，自己却不必把话说死，既把风险控制住，全局的余地也更大。</p></div>
