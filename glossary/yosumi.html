<h1>试应手<button type="button" class="speak" data-speak="试应手" aria-label="朗读"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M4 9v6h4l5 4V5L8 9H4zm11.5 3a3.5 3.5 0 0 0-1.8-3.1v6.2A3.5 3.5 0 0 0 15.5 12z"/></svg></button></h1>
<p class="lead">试探对方应手的一手<button type="button" class="speak" data-speak="试探对方应手的一手" aria-label="朗读"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M4 9v6h4l5 4V5L8 9H4zm11.5 3a3.5 3.5 0 0 0-1.8-3.1v6.2A3.5 3.5 0 0 0 15.5 12z"/></svg></button></p>
<div class="prose"><p>试应手（日语 <em>yosumi</em>，也作 <em>yosumiru</em>）不是为了眼前的便宜，而是为了看对方怎么应。它常常决定后续的战略方向，在局面不明朗时尤其有力。 <button type="button" class="speak" data-speak="试应手（日语 yosumi，也作 yosumiru）不是为了眼前的便宜，而是为了看对方怎么应。它常常决定后续的战略方向，在局面不明朗时尤其有力。" aria-label="朗读"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M4 9v6h4l5 4V5L8 9H4zm11.5 3a3.5 3.5 0 0 0-1.8-3.1v6.2A3.5 3.5 0 0 0 15.5 12z"/></svg></button></p></div>
<div class="gm-host" data-mode="view" data-at="end" data-numbers="1"><script type="text/plain">(;GM[1]FF[4]CA[UTF-8]AP[Sabaki:0.52.2]KM[6.5]SZ[19]DT[2025-05-26]AB[qd][oc]AW[rd]LB[rd:1]C[__zh: 白1是典型的试应手，试探黑如何应对，再决定下一手。
__en: White 1 is a classic probing move, or a "yosumi", testing Black’s response so White can decide on the next move accordingly.__ru:])</script></div>
<div class="prose"><p>这背后是围棋一贯的道理：先看清，再动手。逼对方先表态，自己却不必把话说死，既把风险控制住，全局的余地也更大。<button type="button" class="speak" data-speak="这背后是围棋一贯的道理：先看清，再动手。逼对方先表态，自己却不必把话说死，既把风险控制住，全局的余地也更大。" aria-label="朗读"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M4 9v6h4l5 4V5L8 9H4zm11.5 3a3.5 3.5 0 0 0-1.8-3.1v6.2A3.5 3.5 0 0 0 15.5 12z"/></svg></button></p></div>
