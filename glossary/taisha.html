<h1>大斜</h1>
<p class="lead">大斜，也叫大斜定式</p>
<div class="prose"><p>大斜（日语 taisha，意为“大的斜”）是一类格外繁复难缠的定式，通常由目外或小目的下法演变而来。 </p></div>

__en: The Taisha joseki usually arises when Black plays at the 5-3 point and White approaches with the move at 3-4. At this stage, Black can initiate the taisha joseki by playing A.__ru:];B[fd]C[__Solution: true
])</script></div>
<div class="prose"><p>大斜以变化复杂、考验计算著称，过去一直被看作定式功力的终极试金石。日语里称它“百变定式”，中文则有“大斜千变”的说法，可见其繁复。许多变化几手之内就会演成全局的大战，连职业棋手也常常下不出定论。</p></div>

__en: One of the variations of the Taisha joseki. Start at A.__ru:]PL[W];W[de]C[__Solution: true];B[dd];W[ed];B[cd];W[ec];B[ee];W[df];B[cc];W[fc];B[ef];W[dg];B[gd];W[hb];B[eg];W[dh];B[eh];W[di];B[hc];W[ib];B[ei];W[dj];B[db];W[eb];B[cb];W[gc];B[fk])</script></div>
<div class="prose"><p>尽管历史地位显赫，大斜在 AI 时代已经不多见——现代分析常能找到效率更高的下法。但它依然是值得钻研的教材，也让人得以一窥围棋战略的丰饶。</p></div>
