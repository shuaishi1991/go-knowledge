<h1>小尖<button type="button" class="speak" data-speak="小尖" aria-label="朗读"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M4 9v6h4l5 4V5L8 9H4zm11.5 3a3.5 3.5 0 0 0-1.8-3.1v6.2A3.5 3.5 0 0 0 15.5 12z"/></svg></button></h1>
<p class="stars">★★</p>
<p class="lead">在自己棋子的斜对角落一手<button type="button" class="speak" data-speak="在自己棋子的斜对角落一手" aria-label="朗读"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M4 9v6h4l5 4V5L8 9H4zm11.5 3a3.5 3.5 0 0 0-1.8-3.1v6.2A3.5 3.5 0 0 0 15.5 12z"/></svg></button></p>
<div class="prose"><p>尖（日语：Kosumi）指紧挨着自己的棋子斜走一手，两颗子虽不直接相连，却互为呼应，攻守之间取得平衡。这一手看着平平无奇，却能让你的棋更有弹性，也更容易掌控局面的走向。<button type="button" class="speak" data-speak="尖（日语：Kosumi）指紧挨着自己的棋子斜走一手，两颗子虽不直接相连，却互为呼应，攻守之间取得平衡。这一手看着平平无奇，却能让你的棋更有弹性，也更容易掌控局面的走向。" aria-label="朗读"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M4 9v6h4l5 4V5L8 9H4zm11.5 3a3.5 3.5 0 0 0-1.8-3.1v6.2A3.5 3.5 0 0 0 15.5 12z"/></svg></button></p></div>

<div class="prose"><p><em>空棋盘上的尖</em><button type="button" class="speak" data-speak="空棋盘上的尖" aria-label="朗读"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M4 9v6h4l5 4V5L8 9H4zm11.5 3a3.5 3.5 0 0 0-1.8-3.1v6.2A3.5 3.5 0 0 0 15.5 12z"/></svg></button></p><p>尖是初学阶段就该掌握的基本棋形之一。这一手落点灵活，面对各种局面都能从容应对，既加固了自己的阵地，又不把棋走重、走死。<button type="button" class="speak" data-speak="尖是初学阶段就该掌握的基本棋形之一。这一手落点灵活，面对各种局面都能从容应对，既加固了自己的阵地，又不把棋走重、走死。" aria-label="朗读"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M4 9v6h4l5 4V5L8 9H4zm11.5 3a3.5 3.5 0 0 0-1.8-3.1v6.2A3.5 3.5 0 0 0 15.5 12z"/></svg></button></p></div>
