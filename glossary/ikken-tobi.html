<h1>单关, 跳</h1>
<p class="stars">★</p>
<p class="lead">隔一路的跳</p>
<div class="prose"><p>一间跳（日语：Ikken Tobi）是围棋最基本的一手：在自己棋子隔一路的位置落子。这个棋形常用来向中腹进军、从攻击中逃出，或者高效地扩张外势，同时还留有余地。</p></div>

__en: Black's next move at A is an 'ikken tobi,' a one-point jump.__ru:];B[fo])</script></div>
<div class="prose"><p>一间跳的可贵之处，在于速度与坚实之间的平衡。小飞、二间跳这类走得更快的手段容易留下断点，一间跳则相对安全，同时还能带着整块棋往前走。</p><p>棋谚说“一间跳无恶手”，正说明即便在复杂局面里，它也是一手可靠的通用好棋。不过，周围子力配置不同，这一跳也可能被对方刺一手，或者干脆断开。</p></div>
