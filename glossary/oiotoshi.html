<h1>接不归</h1>
<p class="lead">接上反而被吃</p>
<div class="prose"><p>接不归（日语：Oiotoshi，字面意思是“追着打下去”）是一种威力很大的手筋：用连续的打吃把对方的棋一路追着走。中文名说得更直白——接是接上了，可这块棋再也回不了家。</p><p>常见的套路是引诱对方去接：接完之后棋子仍然处在打吃状态，下一手就被整块提掉。于是出现了看似矛盾的局面——接上不但没能活棋，反而立刻丢了一大块。</p></div>

<div class="prose"><p>它和倒扑、扑、气紧这些概念关系很近。接不归的特别之处在于那种必然性——第一手一落，对方的选择就迅速归零了。</p></div>
