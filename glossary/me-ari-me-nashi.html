<h1>有眼杀无眼</h1>
<p class="lead">有眼一方对无眼一方的对杀</p>
<div class="prose"><p>有眼杀无眼说的是围棋里常见又关键的一种局面：双方两块棋在对杀，但只有一方做出了一只完整的真眼。这时通常是有眼的一方获胜——对方要提掉它，还得先填掉自己的眼，这一手之差往往就是胜负。</p></div>

__en: This capturing race situation is called "eye vs no eye" (me ari me nashi). With one eye advantage, Black wins the capturing race even if it is White's turn. Play at A to see why.__ru:]LB[sq:A]PL[W];W[sq]C[__Solution: true];B[ns];W[ps];B[oq])</script></div>
<div class="prose"><p>这条道理在死活判断里分量很重，局面越紧越明显：哪怕只有一只眼，也可能就是生与死的分界。没有眼的那块棋只能更快地填掉自己的气，最后被提掉。</p><p>日语原文直译过来就是“有眼、无眼”，棋手常用它一句话说清对杀的形势。</p></div>
