<h1>征子</h1>
<p class="stars">★</p>
<p class="lead">连续打吃的追杀手段</p>
<div class="prose"><p><strong>征子</strong>是最基本的吃子方法之一：进攻方连续打吃（每一手都直接威胁提子），一步步紧掉对方的气。被追的棋子只能一路向外逃，却始终逃不出去，除非外面有接应，否则终究难逃被提的命运。</p></div>
<div class="gm-host" data-mode="view" data-at="end" data-numbers="1" data-full="1"><script type="text/plain">(;GM[1]FF[4]CA[UTF-8]AP[Sabaki:0.52.2]KM[6.5]SZ[19]DT[2025-02-17]C[__zh: 下在A就做成征子，这颗黑子必被征吃。请试下A，看黑想逃为什么逃不掉。
__en: Playing A creates a ladder (shicho), guaranteeing the capture of the single black stone. Try playing A to see how Black’s attempt to escape fails.__ru:]AB[dp][gp][fo][eo]AW[fq][fp][go]LB[hp:A]PL[W];W[hp]C[__Solution: true];B[gq];W[gr];B[hq];W[iq];B[hr](;W[ir])(;W[hs];B[ir];W[jr]))</script></div>
<div class="prose"><p>只要在恰当的位置多出一颗子，就能挡住征子的去路，让被追的棋子逃出生天。这样的一颗子叫作引征。</p></div>
<div class="gm-host" data-mode="view" data-at="end" data-numbers="1" data-full="1"><script type="text/plain">(;GM[1]FF[4]CA[UTF-8]AP[Sabaki:0.52.2]KM[6.5]SZ[19]DT[2025-02-18]AB[cq][dq][ep]AW[dp][eq][fq][bn][gp]AE[cn]C[__zh: 因为有这颗标记的子做征子接应，黑不能用征子。请下在A，看这个次序如何展开。
__en: Black cannot use the ladder because of the marked stone, which acts as a ladder-breaker. Play A to see how the sequence unfolds.__ru:]TR[bn]LB[do:A];B[do]C[__Solution: true];W[cp];B[bp];W[co])</script></div>
<div class="prose"><p>征子（Shicho）是初学者最早接触的吃子手段之一。一个征子成不成立，能不能算清楚，直接关系到棋能不能下好——所以才有那句老话：“不懂征子，就别下围棋。”</p></div>
