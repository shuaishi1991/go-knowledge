<h1>角<button type="button" class="speak" data-speak="角" aria-label="朗读"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M4 9v6h4l5 4V5L8 9H4zm11.5 3a3.5 3.5 0 0 0-1.8-3.1v6.2A3.5 3.5 0 0 0 15.5 12z"/></svg></button></h1>
<p class="lead">棋盘四角<button type="button" class="speak" data-speak="棋盘四角" aria-label="朗读"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M4 9v6h4l5 4V5L8 9H4zm11.5 3a3.5 3.5 0 0 0-1.8-3.1v6.2A3.5 3.5 0 0 0 15.5 12z"/></svg></button></p>
<div class="prose"><p>围棋里的<strong>角</strong>（日语称 sumi）指的是棋盘四角那一带。开局阶段角最值钱：在这里围空最省棋子，一手落在角上就能同时照顾两条边，战略价值极高。<button type="button" class="speak" data-speak="围棋里的角（日语称 sumi）指的是棋盘四角那一带。开局阶段角最值钱：在这里围空最省棋子，一手落在角上就能同时照顾两条边，战略价值极高。" aria-label="朗读"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M4 9v6h4l5 4V5L8 9H4zm11.5 3a3.5 3.5 0 0 0-1.8-3.1v6.2A3.5 3.5 0 0 0 15.5 12z"/></svg></button></p></div>
<div class="gm-host" data-mode="view" data-at="end" data-numbers="1"><script type="text/plain">(;GM[1]FF[4]CA[UTF-8]AP[Sabaki:0.52.2]KM[6.5]SZ[19]DT[2025-05-26]AE[od][dp]AB[pd][pp]AW[dc][cq]C[__zh: 四个角都已经被占。
__en: All four corners are occupied.__ru:])</script></div>
<div class="prose"><p>布局多半从角上开始，最常见的是小目和星位，它们都能为后续发展打下扎实的底子。以此为据点，棋子再向边和中腹铺开，同时把角里的实地牢牢握住。<button type="button" class="speak" data-speak="布局多半从角上开始，最常见的是小目和星位，它们都能为后续发展打下扎实的底子。以此为据点，棋子再向边和中腹铺开，同时把角里的实地牢牢握住。" aria-label="朗读"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M4 9v6h4l5 4V5L8 9H4zm11.5 3a3.5 3.5 0 0 0-1.8-3.1v6.2A3.5 3.5 0 0 0 15.5 12z"/></svg></button></p><p>怎样利用和守住自己的角，怎样打进对方的角——弄懂这些，棋力才谈得上长进。<button type="button" class="speak" data-speak="怎样利用和守住自己的角，怎样打进对方的角——弄懂这些，棋力才谈得上长进。" aria-label="朗读"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M4 9v6h4l5 4V5L8 9H4zm11.5 3a3.5 3.5 0 0 0-1.8-3.1v6.2A3.5 3.5 0 0 0 15.5 12z"/></svg></button></p></div>
