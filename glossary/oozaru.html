<h1>大伸腿</h1>
<p class="lead">从二路大飞插进对方的空</p>
<div class="prose"><p>日语里的 <em>oozaru</em> 字面意思是“大猿”，形象地道出了这一手的样子——中文叫大伸腿，也有人称“仙鹤伸腿”。它通常出现在官子中：一方借着二路上的坚实棋形，一步深深跨进对方的地盘。</p><p>守方在一路、二路缺少接应，被威胁的那一带补不牢，大伸腿才成立。攻方以二路的子作跳板切进去，一口气刮走一大块目数，本来平静的局部常常就此变成决定胜负的交换。</p></div>

<div class="prose"><p>名字虽然好玩，这一手却非常见效，而且往往还能保住先手。只是它既挑局面条件，也考验你算得够不够深。</p></div>
