<h1>胀牯牛 / 胀死牛</h1>
<p class="lead">挤得对方连也连不上</p>
<div class="prose"><p>胀牯牛（日语：Oshitsubushi）是死活里的一种手段：把对方逼到这样的境地——想接上，就只能走出自杀的一手，而规则不允许这么下<strong></strong>（自己落子后把自己的气全部填光，属于禁着点）。 </p></div>

<div class="prose"><p>一手胀牯牛下对了，一块棋的死活就此改写。</p><p>这一手管不管用，很大程度上取决于用哪套规则。我们讲课依照禁止自杀的日本规则，但也有一些规则允许自己提自己的子。</p></div>
