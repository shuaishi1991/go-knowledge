<h1>开花</h1>
<p class="stars">★★★</p>
<p class="lead">提一子后留下的拔花棋形</p>
<div class="prose"><p><strong>开花</strong>是围棋中提掉对方一颗子之后留下的棋形：四颗子围着一个空点，像一朵张开的花。这个形向四面八方都放出力量，能让自己的阵势一下子厚实起来，因此被视为极有价值的好形。</p></div>

<div class="prose"><p>提掉一子之后，围在这个点周围的四颗子正好摆成一朵花的形状。这个形以效率高、控制面广著称。</p><p>围棋谚语<strong>“开花三十目”</strong>说的就是它的分量。它未必真值三十目，但这句话点出了开花在圈地和控盘上的厚度与影响力。</p><p>开花攻守两利：既可以当作向外发展的根据地，也可以用来安定一块孤棋。</p></div>
