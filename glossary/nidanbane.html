<h1>连扳</h1>
<p class="lead">连续两次扳</p>
<div class="prose"><p>连扳，就是在对方相邻的棋子上连着扳两手的战术手法。</p></div>

__ru:]LB[bn:1][cn:A]PL[W];W[cn]C[__Solution: true];B[do];W[bm];B[bp];W[an];B[bq])</script></div>
<div class="prose"><p>当对方有孤棋要照顾时，连扳格外有力：既能给自己筑起厚实的棋形，又能打乱对方的阵形。不过连扳需要算清楚——用得太随手，或者在不利的局面下硬扳，反而可能凝形或者留下弱点。</p><p>无论古谱还是现代对局，连扳都被视为一手锐利而果断的棋：走对了，往往当场改变局部的力量对比。</p></div>
