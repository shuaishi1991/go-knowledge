<h1>透点</h1>
<p class="lead">往对方阵地里点的一手</p>
<div class="prose"><p>点（日语：Oki）是把一颗子直接放进对方的阵地里，而且不挨着任何棋子。这一手的用途很广：杀棋、做出假眼、在官子里破空，甚至可以当作弃子来抢先手。</p></div>

<div class="prose"><p>点常常瞄着一块棋的要害，往往能带来意想不到的翻盘。不过这一手也很凶险：算不清就点进去，很容易变成一次无理的打入，反倒把对方走厚。</p></div>
