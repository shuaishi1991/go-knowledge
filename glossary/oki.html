<h1>透点<button type="button" class="speak" data-speak="透点" aria-label="朗读"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M4 9v6h4l5 4V5L8 9H4zm11.5 3a3.5 3.5 0 0 0-1.8-3.1v6.2A3.5 3.5 0 0 0 15.5 12z"/></svg></button></h1>
<p class="lead">往对方阵地里点的一手<button type="button" class="speak" data-speak="往对方阵地里点的一手" aria-label="朗读"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M4 9v6h4l5 4V5L8 9H4zm11.5 3a3.5 3.5 0 0 0-1.8-3.1v6.2A3.5 3.5 0 0 0 15.5 12z"/></svg></button></p>
<div class="prose"><p>点（日语：Oki）是把一颗子直接放进对方的阵地里，而且不挨着任何棋子。这一手的用途很广：杀棋、做出假眼、在官子里破空，甚至可以当作弃子来抢先手。<button type="button" class="speak" data-speak="点（日语：Oki）是把一颗子直接放进对方的阵地里，而且不挨着任何棋子。这一手的用途很广：杀棋、做出假眼、在官子里破空，甚至可以当作弃子来抢先手。" aria-label="朗读"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M4 9v6h4l5 4V5L8 9H4zm11.5 3a3.5 3.5 0 0 0-1.8-3.1v6.2A3.5 3.5 0 0 0 15.5 12z"/></svg></button></p></div>

<div class="prose"><p>点常常瞄着一块棋的要害，往往能带来意想不到的翻盘。不过这一手也很凶险：算不清就点进去，很容易变成一次无理的打入，反倒把对方走厚。<button type="button" class="speak" data-speak="点常常瞄着一块棋的要害，往往能带来意想不到的翻盘。不过这一手也很凶险：算不清就点进去，很容易变成一次无理的打入，反倒把对方走厚。" aria-label="朗读"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M4 9v6h4l5 4V5L8 9H4zm11.5 3a3.5 3.5 0 0 0-1.8-3.1v6.2A3.5 3.5 0 0 0 15.5 12z"/></svg></button></p></div>
