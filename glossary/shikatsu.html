<h1>死活</h1>
<p class="lead">一块棋的生与死</p>
<div class="prose"><p>死活（日语：Shikatsu）说的是一块棋能不能活下来的关键局面。判断一块棋是能够做活，还是注定被吃，正是许多战斗的核心。</p><p>死活题是围棋训练的基石。看清一块棋是活棋、死棋还是尚未定型，才谈得上做出靠谱的战略判断，也才不会犯下代价高昂的错误。</p></div>

<div class="prose"><p>围棋里还有一个相近的说法，叫<em>死活题</em>。区别在于：死活指实战中出现的生死局面，而<em>死活题</em>是为训练和研究专门编排出来的题目。</p></div>
