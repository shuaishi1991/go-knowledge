<h1>双挂</h1>
<p class="lead">从两边同时挂角</p>
<div class="prose"><p>双挂（日语：Ryou-gakari）指的是对同一个角连挂两手，从两边分别挂过去。这在布局阶段有时很好用：既能及早给角上加压，也能不让对方安安稳稳地守住角。</p></div>

__en: These are several common double approach patterns, or "ryou-gakari". Black is approaching White's corners from both sides.__ru:])</script></div>
<div class="prose"><p>这是相当强硬、主动的一手，往往能打乱对方原本的构思。时机拿捏得好，双挂能把局面导向对自己有利的战斗，尤其是在对方守不住角的时候。</p><p>不过，身边没有接应的子就双挂，风险也不小：容易摊得太开；一旦对方应对得当，自己反倒多出几块薄棋。</p></div>
