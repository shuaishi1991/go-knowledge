<h1>飞</h1>
<p class="lead">二路滑下的一手</p>
<div class="prose"><p>滑，也叫小飞下，一般下在棋盘的二路，从对方三路的子底下钻过去。它可以在边上稳稳地占住实地，也能让一块被压得很紧的棋透口气。这一手看着平常，却是边角一带最要紧的手段之一。</p></div>

<div class="prose"><p>最常见的是小飞滑下，既安全又有进展。滑得更远自然多占地方，但棋形松散，往往留有隐患。时机最关键——一手恰到好处的滑，既能把外势坐实，也能掏空对方的阵地。</p></div>
