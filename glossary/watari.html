<h1>渡<button type="button" class="speak" data-speak="渡" aria-label="朗读"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M4 9v6h4l5 4V5L8 9H4zm11.5 3a3.5 3.5 0 0 0-1.8-3.1v6.2A3.5 3.5 0 0 0 15.5 12z"/></svg></button></h1>
<p class="lead">搭桥，从底下渡过去<button type="button" class="speak" data-speak="搭桥，从底下渡过去" aria-label="朗读"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M4 9v6h4l5 4V5L8 9H4zm11.5 3a3.5 3.5 0 0 0-1.8-3.1v6.2A3.5 3.5 0 0 0 15.5 12z"/></svg></button></p>
<div class="prose"><p>渡是一种手法，能在棋盘边上把两块棋像搭桥一样连起来。这一手通常走在一路或二路，偶尔在三路，对保持联络、减少薄味非常关键。<button type="button" class="speak" data-speak="渡是一种手法，能在棋盘边上把两块棋像搭桥一样连起来。这一手通常走在一路或二路，偶尔在三路，对保持联络、减少薄味非常关键。" aria-label="朗读"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M4 9v6h4l5 4V5L8 9H4zm11.5 3a3.5 3.5 0 0 0-1.8-3.1v6.2A3.5 3.5 0 0 0 15.5 12z"/></svg></button></p></div>

<div class="prose"><p>渡最常见于收官阶段：把分开的两块棋连回去，既加固自己的阵地，也堵住对方打入的机会。渡成功了，切断的手段就落空，周围那些棋子的作用也随之打折。<button type="button" class="speak" data-speak="渡最常见于收官阶段：把分开的两块棋连回去，既加固自己的阵地，也堵住对方打入的机会。渡成功了，切断的手段就落空，周围那些棋子的作用也随之打折。" aria-label="朗读"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M4 9v6h4l5 4V5L8 9H4zm11.5 3a3.5 3.5 0 0 0-1.8-3.1v6.2A3.5 3.5 0 0 0 15.5 12z"/></svg></button></p></div>
