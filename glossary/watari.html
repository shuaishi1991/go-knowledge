<h1>渡</h1>
<p class="lead">搭桥，从底下渡过去</p>
<div class="prose"><p>渡是一种手法，能在棋盘边上把两块棋像搭桥一样连起来。这一手通常走在一路或二路，偶尔在三路，对保持联络、减少薄味非常关键。</p></div>

__en: Black playing at A will connect two black groups along the edge. This technique is called "watari".__ru:]AP[Sabaki:0.52.2]CA[UTF-8];B[or]C[__Solution: true];W[pr];B[ps];W[nr];B[oq])</script></div>
<div class="prose"><p>渡最常见于收官阶段：把分开的两块棋连回去，既加固自己的阵地，也堵住对方打入的机会。渡成功了，切断的手段就落空，周围那些棋子的作用也随之打折。</p></div>
