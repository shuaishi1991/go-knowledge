<h1>雪崩</h1>
<p class="lead">雪崩定式</p>
<div class="prose"><p>雪崩是从小目开局衍生出的定式：对方先高挂，接着向内一靠，变化就此展开。它的名字取自雪崩这一自然现象——后续的着法层层滚落，往往波及大半个棋盘。也有棋手说，白棋的棋子看上去就像顺着山坡滑下的积雪。</p></div>

<div class="prose"><p>过去大家认为雪崩定式的结果对双方都算公平。但随着 AI 分析兴起——尤其是 2018 年之后——人们发现其中一些变化，特别是大雪崩，对白棋略有不利。</p><p>如果不想把局面搅复杂，双方都有办法把定式引向平稳的结果。</p></div>
