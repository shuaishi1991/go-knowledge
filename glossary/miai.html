<h1>见合</h1>
<p class="stars">★★★</p>
<p class="lead">价值相等、可以互换的两点</p>
<div class="prose"><p><strong>见合</strong>是围棋里的一个概念，指两个点或两种下法的战略价值完全相当：一方走了其中一个，另一方顺势占住另一个，谁也不吃亏。</p></div>

<div class="prose"><p>见合让你的选择变得从容：对手走哪边，你就跟着调整，既守住全局的平衡，又能高效地化解对方的威胁。</p><p>看出见合关系，就能更快地掂量一手棋的价值——不必在一个地方投入过多，也能在别处留住余地。</p><p>官子与死活中的见合</p><p>判断一块棋的死活时，见合尤其关键。做活或杀棋常常有两个点互为见合，能不能找到这两点，直接决定你算得准不准。</p></div>
