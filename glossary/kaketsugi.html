<h1>虎接</h1>
<p class="lead">虎接，用虎口连回的补法</p>
<div class="prose"><p>虎（日语：Kaketsugi）是围棋里的关键棋形，走出来就是一个<em>虎口</em>——防断特别有效率的形状。 </p></div>

<div class="prose"><p>和实接不同，虎接中间留了一点空隙，却同样能把一块棋补厚，更经得起对方的进攻。</p><p>虎接看着松一些，胜在灵活、有效率，是防守时少不了的手段。，但胜在灵活、有效率，是防守时少不了的手段。</p></div>
