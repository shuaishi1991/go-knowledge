<h1>挖</h1>
<p class="stars">★</p>
<p class="lead">从对方两子之间挖进去的一手</p>
<div class="prose"><p>挖，就是把一颗棋子下进对方两颗棋子之间的那一路空隙，制造断点，或者把对方的棋切成两块。这一手逼着对方必须应，往往由此引出一场战斗，或者局部的战术交换。</p></div>

<div class="prose"><p>挖是一手锋利而有效的战术棋，时机抓得准，足以扭转整盘棋的形势。想在各种局面里用好它，就得同时看清它的威力和它的风险。</p></div>
